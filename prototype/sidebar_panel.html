<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY Roundtable · 圆桌会议</title>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0d0f14;
      --surface: #14171f;
      --surface-2: #1a1e29;
      --surface-3: #222736;
      --surface-subtle: #11141b;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text: #eceef2;
      --text-2: #9ba3b4;
      --text-3: #6c7486;
      --accent: #5e8bff;
      --accent-hover: #749bff;
      --accent-fg: #ffffff;
      --accent-soft: rgba(94, 139, 255, 0.12);
      --accent-border: rgba(94, 139, 255, 0.34);
      --ok: #3fb980;
      --ok-soft: rgba(63, 185, 128, 0.11);
      --ok-border: rgba(63, 185, 128, 0.3);
      --warn: #d9a441;
      --warn-soft: rgba(217, 164, 65, 0.12);
      --warn-border: rgba(217, 164, 65, 0.34);
      --err: #e06c75;
      --err-soft: rgba(224, 108, 117, 0.12);
      --err-border: rgba(224, 108, 117, 0.34);
      --code-bg: rgba(255, 255, 255, 0.06);
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.45);
      --backdrop: rgba(6, 8, 12, 0.72);
      --scroll-track: #0d0f14;
      --scroll-thumb: #293040;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-2: #f1f1ee;
      --surface-3: #e7e7e2;
      --surface-subtle: #fafaf8;
      --border: rgba(24, 24, 27, 0.09);
      --border-strong: rgba(24, 24, 27, 0.18);
      --text: #18181b;
      --text-2: #52525b;
      --text-3: #83838e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-fg: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --accent-border: rgba(37, 99, 235, 0.28);
      --ok: #15803d;
      --ok-soft: rgba(21, 128, 61, 0.08);
      --ok-border: rgba(21, 128, 61, 0.24);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --warn-border: rgba(180, 83, 9, 0.26);
      --err: #b91c1c;
      --err-soft: rgba(185, 28, 28, 0.08);
      --err-border: rgba(185, 28, 28, 0.26);
      --code-bg: rgba(24, 24, 27, 0.055);
      --shadow-pop: 0 12px 32px rgba(15, 23, 42, 0.12);
      --backdrop: rgba(15, 23, 42, 0.42);
      --scroll-track: #f7f7f5;
      --scroll-thumb: #d4d4d8;
      color-scheme: light;
    }

    :root {
      --ctrl-h-xs: 22px;
      --ctrl-h-chip: 24px;
      --ctrl-h-sm: 28px;
      --ctrl-h-md: 32px;
      --ctrl-lh: 1.35;
      --stage-px: 22px;
      --stage-py: 18px;
    }
    @media (max-width: 680px) {
      :root {
        --stage-px: 12px;
        --stage-py: 12px;
      }
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }
    ::selection { background: var(--accent-soft); color: var(--text); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body {
      margin: 0;
      padding: 0 0 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.55;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon svg { display: block; }
    .tx { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .u-wrap { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }

    /* ==================== RESPONSIVE STICKY TOP BAR ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      min-height: 54px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .v-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    .proj-picker {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      max-width: 280px;
      flex: 1 1 150px;
    }
    .proj-picker select {
      min-height: 30px;
      height: auto;
      padding: 4px 8px;
      font-size: 12.5px;
      font-weight: 500;
      background-color: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      text-overflow: ellipsis;
      min-width: 0;
      width: 100%;
    }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-2);
      min-height: 30px;
      height: auto;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-btn.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
    }
    .nav-count {
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      margin-left: auto;
    }

    @media (max-width: 1040px) {
      .topbar { padding: 8px 14px; row-gap: 8px; }
      .topbar-left { flex: 1 1 100%; justify-content: space-between; }
      .topbar-left .v-sep { display: none; }
      .proj-picker { flex: 1 1 200px; max-width: none; }
      .topbar-right { flex: 1 1 100%; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--border); }
    }
    @media (max-width: 560px) {
      .topbar { padding: 8px 10px; row-gap: 6px; }
      .proj-picker { flex: 1 1 100%; order: 3; }
      .topbar-nav { order: 2; }
      .nav-btn { padding: 4px 8px; font-size: 12px; }
      #btn-cmd-k > span:not(.icon), #btn-cmd-k kbd { display: none; }
      #btn-cmd-k { padding: 0 8px; }
      .topbar-right { justify-content: space-between; }
    }

    /* ==================== MAIN CONTAINER ==================== */
    .shell {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }
    @media (max-width: 680px) {
      .shell { padding: 14px 12px 0; }
    }

    /* ==================== BUTTONS, INPUTS, TAGS ==================== */
    .btn {
      min-height: var(--ctrl-h-md);
      height: auto;
      padding: 5px 12px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 12.5px;
      font-weight: 500;
      line-height: var(--ctrl-lh);
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      max-width: 100%;
      min-width: 0;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-wrap { white-space: normal; text-align: left; }
    .btn-sec {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-sec:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border-color: transparent;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger {
      background: var(--err-soft);
      color: var(--err);
      border-color: var(--err-border);
    }
    .btn-danger:hover { background: var(--err); color: #fff; }
    .btn-warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--warn-border);
    }
    .btn-warn:hover { border-color: var(--warn); }
    .btn-sm { min-height: var(--ctrl-h-sm); height: auto; padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .btn-xs { min-height: 23px; height: auto; padding: 2px 7px; font-size: 11px; border-radius: 6px; }
    .btn-icon { width: 30px; min-height: 30px; height: 30px; padding: 0; border-radius: 6px; flex-shrink: 0; }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: var(--surface-subtle);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 13px;
      line-height: var(--ctrl-lh);
      font-family: inherit;
      transition: border-color 0.14s ease;
    }
    select {
      height: auto;
      min-height: 30px;
      padding: 5px 8px;
      background-color: var(--surface-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    select option {
      background-color: var(--surface);
      color: var(--text);
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 78px; line-height: 1.55; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-2 > *, .grid-3 > *, .seat-grid > *, .fig-grid > *, .fig-compare-grid > * { min-width: 0; max-width: 100%; }
    @media (max-width: 720px) {
      .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
    }

    /* Quiet semantic pills & status dots */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: var(--ctrl-h-xs);
      height: auto;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.25;
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      white-space: nowrap;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .tag-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .tag-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
    .tag-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-border); }
    .tag-err { background: var(--err-soft); color: var(--err); border-color: var(--err-border); }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-ok { background: var(--ok); }
    .dot-run { background: var(--accent); animation: calmPulse 1.8s ease-in-out infinite; }
    .dot-warn { background: var(--warn); }
    .dot-err { background: var(--err); }
    @keyframes calmPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Monochrome Initials Avatar */
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .avatar.av-human { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .avatar.av-speaking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .avatar-sm { width: 20px; height: 20px; font-size: 10px; }

    /* ==================== UTILITY POPOVER MENU ==================== */
    .popover {
      position: fixed;
      top: 56px;
      right: 16px;
      width: 320px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 76px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow-pop);
      padding: 10px;
      z-index: 80;
    }
    .pop-sec {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    .pop-sec:last-child { border-bottom: none; padding-bottom: 2px; }
    .pop-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .pop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text);
    }
    .pop-item-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }
    .pop-item-btn:hover { background: var(--surface-2); }

    /* ==================== SEGMENTED CONTROLS ==================== */
    .seg {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-wrap: wrap;
      max-width: 100%;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      min-height: 27px;
      height: auto;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      font-weight: 600;
    }

    /* ==================== COMPOSER PANEL (FLAT, CLEAN, ON-DEMAND) ==================== */
    .composer-panel {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: var(--stage-py) var(--stage-px);
      margin-bottom: 20px;
    }
    .composer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .composer-mode-hint {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
    }
    .composer-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .composer-launch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .setup-strip {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 13px;
      margin-bottom: 12px;
    }
    .setup-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 10px;
    }
    .ctrl-inline-field {
      display: inline-grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      font-size: 12px;
      color: var(--text-2);
    }
    .ctrl-inline-field > span:first-child {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ctrl-inline-field select {
      flex: 1 1 auto;
      width: auto;
      max-width: min(290px, 100%);
      min-width: 0;
      min-height: 29px;
      height: auto;
      padding: 4px 8px;
      font-size: 12px;
    }
    @media (max-width: 560px) {
      .ctrl-inline-field { display: flex; width: 100%; }
      .ctrl-inline-field select { flex: 1 1 auto; width: 100%; max-width: 100%; min-width: 0; }
    }
    .seat-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .seat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px 6px 7px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--text-2);
      max-width: 100%;
      min-width: 0;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .seat-pill-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
      flex-wrap: wrap;
    }
    .seat-pill-name {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.3;
    }
    .seat-pill-spec {
      font-size: 10.5px;
      color: var(--text-3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .seat-pill-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      .seat-pill { width: 100%; justify-content: space-between; }
      .seat-pill-main { flex-direction: column; align-items: flex-start; gap: 1px; }
      .seat-pill-spec { white-space: normal; overflow-wrap: anywhere; }
    }
    .seat-pill:hover { border-color: var(--border-strong); color: var(--text); }
    .seat-pill.selected {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--text);
    }
    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .host-set-btn {
      font-size: 10.5px;
      color: var(--text-3);
      background: transparent;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .host-set-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface);
    }
    .fig-contract-strip {
      background: var(--surface-subtle);
      border: 1px solid var(--accent-border);
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 10px;
    }
    .flow-note {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Pipeline builder inside composer */
    .stages-track {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .stage-col {
      min-width: 276px;
      max-width: 320px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .stage-arrow {
      display: flex;
      align-items: center;
      color: var(--text-3);
      font-size: 14px;
      user-select: none;
    }
    .ws-node {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px;
      min-width: 0;
      max-width: 100%;
    }
    .ws-node select, .ws-node input[type="text"] {
      margin-bottom: 6px;
      min-height: 30px;
      height: auto;
      font-size: 12px;
      line-height: 1.3;
    }
    .ws-node input[type="text"] { margin-bottom: 0; }

    /* ==================== ACTIVE STAGE (CLEAN DOCUMENT-FIRST SURFACE) ==================== */
    .task-pills-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .task-pill {
      min-height: 28px;
      height: auto;
      max-width: min(280px, 100%);
      min-width: 0;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .task-pill.active {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text);
      font-weight: 600;
    }

    .stage-surface {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .stage-header {
      padding: var(--stage-py) var(--stage-px) 14px;
      border-bottom: 1px solid var(--border);
    }
    .stage-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stage-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--text);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .stage-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-2);
    }
    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 10px var(--stage-px);
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
    }
    .stage-body {
      padding: var(--stage-py) var(--stage-px);
    }

    /* Live participant bar (calm, clean, zero giant neon oval) */
    .live-roster-strip {
      padding: 11px var(--stage-px);
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }
    .live-phase-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
      gap: 8px;
    }
    .seat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-width: 0;
      max-width: 100%;
    }
    .seat-card.speaking {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .seat-snippet {
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text-2);
      line-height: 1.45;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Quiet inline banners */
    .notice {
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .notice-ok { background: var(--ok-soft); border-color: var(--ok-border); }
    .notice-warn { background: var(--warn-soft); border-color: var(--warn-border); }
    .notice-err { background: var(--err-soft); border-color: var(--err-border); }

    /* ==================== READING-FIRST DELIVERABLE TYPOGRAPHY ==================== */
    .doc-reading {
      max-width: 780px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.72;
      color: var(--text);
    }
    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.4em 0;
    }
    .doc-actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .md-body { word-break: break-word; overflow-wrap: anywhere; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.35;
      margin: 1.35em 0 0.5em;
    }
    .md-body h1:first-child, .md-body h2:first-child, .md-body h3:first-child { margin-top: 0; }
    .md-body h1 { font-size: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .md-body h2 { font-size: 15.5px; }
    .md-body h3 { font-size: 14px; }
    .md-body h4 { font-size: 13.5px; color: var(--text-2); }
    .md-body p { margin: 0 0 0.75em; }
    .md-body ul { margin: 0 0 0.85em 1.3em; padding: 0; }
    .md-body li { margin: 0.25em 0; }
    .md-body code {
      background: var(--code-bg);
      color: var(--text);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md-body pre {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 11px 13px;
      border-radius: 8px;
      overflow-x: auto;
      max-width: 100%;
      font-size: 12px;
      line-height: 1.55;
      margin: 0.9em 0;
    }
    .md-body pre code { background: transparent; padding: 0; overflow-wrap: normal; word-break: normal; }
    .md-table-wrap { overflow-x: auto; max-width: 100%; margin: 1em 0; -webkit-overflow-scrolling: touch; }
    .md-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    .md-table th, .md-table td {
      border: 1px solid var(--border);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md-table th {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }

    /* Clickable file/web links (natural multi-line wrap so long paths never blow past cards!) */
    .ans-link {
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid transparent;
      padding: 1px 6px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      display: inline;
      overflow-wrap: anywhere;
      word-break: break-word;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .ans-link .icon {
      display: inline-flex;
      vertical-align: -2px;
      margin-right: 3px;
    }
    .ans-link:hover {
      border-color: var(--accent-border);
      text-decoration: none;
    }

    /* Inline Markdown Figure Proof Card (pure-white canvas + click to Lightbox) */
    .md-fig-box {
      display: block;
      margin: 10px 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: var(--surface-subtle);
      max-width: 100%;
    }
    .md-fig-canvas {
      background: #ffffff;
      padding: 12px;
      text-align: center;
      cursor: zoom-in;
      border-bottom: 1px solid var(--border);
    }
    .md-fig-canvas img {
      max-width: 100%;
      max-height: 440px;
      width: auto;
      height: auto;
      display: inline-block;
      border-radius: 3px;
    }
    .md-fig-cap {
      padding: 7px 11px;
      font-size: 11.5px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .md-fig-stub {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      max-width: 100%;
    }
    .md-fig-stub:hover { border-color: var(--accent-border); background: var(--accent-soft); }

    /* ==================== FLAT DISCUSSION TIMELINE (NO NESTED BUBBLE CLUTTER) ==================== */
    .chat-list {
      display: flex;
      flex-direction: column;
    }
    .chat-round-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.02em;
    }
    .chat-round-divider::before,
    .chat-round-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .chat-entry {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .chat-entry:last-child { border-bottom: none; }
    .chat-entry-body { flex: 1; min-width: 0; }
    .chat-entry-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-3);
    }
    .chat-entry-meta strong { color: var(--text); font-weight: 600; }
    .chat-entry.is-user {
      background: var(--accent-soft);
      margin: 4px -12px;
      padding: 12px;
      border-radius: 8px;
      border-bottom: none;
    }

    /* Docked Interjection Bar */
    .interject-dock {
      padding: 10px var(--stage-px) 12px;
      background: var(--surface-subtle);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .interject-dock select { width: auto; max-width: 100%; min-height: 34px; font-size: 12.5px; }
    .interject-dock input[type="text"] { flex: 1 1 180px; min-width: 0; min-height: 34px; }

    /* ==================== QUESTION CARD & MODALS ==================== */
    .q-panel {
      background: var(--surface-subtle);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .q-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      margin-top: 10px;
    }
    .q-opt {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-subtle);
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text);
    }
    .q-opt:hover { border-color: var(--accent-border); }
    .q-opt input { margin-top: 3px; width: auto; flex-shrink: 0; }
    .q-opt > span { min-width: 0; flex: 1; overflow-wrap: anywhere; word-break: break-word; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 120;
    }
    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px 20px;
      box-shadow: var(--shadow-pop);
    }
    .modal-dialog.wide { max-width: 880px; }

    .src-viewer {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 60vh;
      overflow: auto;
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      padding: 6px 0;
    }
    .src-line { display: flex; padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
    .src-line.hl { background: var(--warn-soft); }
    .src-ln { width: 42px; flex-shrink: 0; color: var(--text-3); text-align: right; padding-right: 12px; user-select: none; }

    /* ==================== HISTORY & MEMBERS FLAT LISTS ==================== */
    .list-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .list-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: var(--surface-subtle); }

    .member-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      max-width: 100%;
    }
    .member-card-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 7px;
    }
    .member-card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-2);
    }

    .fs-list {
      max-height: 290px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-subtle);
      margin: 10px 0;
    }
    .fs-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
    }
    .fs-item:last-child { border-bottom: none; }
    .fs-item:hover { background: var(--surface-2); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-2);
      border: 1px dashed var(--border-strong);
      border-radius: 12px;
      background: var(--surface);
    }

    details summary {
      cursor: pointer;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 500;
      user-select: none;
    }
    details summary:hover { color: var(--text); }

    .footer-note {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-3);
    }
    .footer-note a { color: var(--text-2); text-decoration: none; }
    .footer-note a:hover { color: var(--text); text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      max-width: min(380px, calc(100vw - 24px));
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      display: none;
      z-index: 200;
      box-shadow: var(--shadow-pop);
      overflow-wrap: anywhere;
    }
    .toast.is-err { border-color: var(--err); color: var(--err); }

    /* ==================== COMMAND PALETTE (Ctrl+K), @MENTION & AUDIT PANEL ==================== */
    .kbd-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      height: auto;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11.5px;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.14s ease, color 0.14s ease;
    }
    .kbd-pill:hover { border-color: var(--border-strong); color: var(--text); }
    .kbd-pill kbd {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10.5px;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
    }

    .cmdk-dialog {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow-pop);
      overflow: hidden;
      align-self: flex-start;
      margin-top: 9vh;
    }
    .cmdk-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
    }
    .cmdk-input-row input {
      border: none;
      background: transparent;
      padding: 2px 0;
      font-size: 13.5px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cmdk-input-row input:focus { outline: none; }
    .cmdk-list { max-height: 380px; overflow-y: auto; padding: 6px; }
    .cmdk-group {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px 8px 4px;
    }
    .cmdk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text);
    }
    .cmdk-item:hover, .cmdk-item.active { background: var(--surface-2); }
    .cmdk-item-sub { font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }

    .preset-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .preset-chip {
      min-height: 26px;
      height: auto;
      max-width: 100%;
      min-width: 0;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11.5px;
      line-height: 1.3;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: border-color 0.14s ease, color 0.14s ease, background 0.14s ease;
    }
    .preset-chip:hover { border-color: var(--accent-border); color: var(--text); background: var(--accent-soft); }

    .pill-edit-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      padding: 0;
    }
    .pill-edit-btn:hover { background: var(--surface); color: var(--text); }

    .audit-panel {
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 18px;
    }
    .audit-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .interject-wrap {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      margin-top: -1px;
      background: var(--surface-subtle);
      position: relative;
    }
    .quick-target-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      padding: 9px var(--stage-px) 0;
    }
    .qt-chip {
      min-height: var(--ctrl-h-chip);
      height: auto;
      max-width: min(260px, 100%);
      min-width: 0;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11.5px;
      line-height: 1.25;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }
    .qt-chip:hover { border-color: var(--border-strong); color: var(--text); }
    .qt-chip.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--text); font-weight: 600; }

    .mention-popup {
      position: absolute;
      left: var(--stage-px);
      bottom: 58px;
      width: 340px;
      max-width: calc(100% - 24px);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow-pop);
      padding: 5px;
      z-index: 60;
      max-height: 240px;
      overflow-y: auto;
    }
    .tpl-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    /* ==================== ARTIFACTS & SCIENTIFIC FIGURE GALLERY (PURE WHITE CANVAS + PROOF FILTERS) ==================== */
    .art-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .fig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .fig-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 100%;
    }
    .fig-card-head {
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .fig-canvas {
      background: #ffffff;
      color: #18181b;
      padding: 14px;
      min-height: 210px;
      max-height: 460px;
      overflow: auto;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      border-bottom: 1px solid var(--border);
      cursor: zoom-in;
    }
    .fig-canvas img {
      display: block;
      margin: auto;
      border-radius: 3px;
      transition: width 0.14s ease;
    }
    .fig-canvas.zoom-fit img { max-width: 100%; max-height: 420px; width: auto; height: auto; }
    .fig-canvas.zoom-100 img { max-width: none; width: auto; height: auto; }
    .fig-canvas.zoom-150 img { max-width: none; width: 150%; height: auto; }
    .fig-canvas.zoom-200 img { max-width: none; width: 200%; height: auto; }
    /* Machado (2009) linearRGB CVD + Grayscale Proofing Aid Filters */
    .proof-grayscale img, .proof-grayscale iframe { filter: grayscale(100%); }
    .proof-deutan img, .proof-deutan iframe { filter: url(#cvd-deutan); }
    .proof-protan img, .proof-protan iframe { filter: url(#cvd-protan); }
    .proof-tritan img, .proof-tritan iframe { filter: url(#cvd-tritan); }
    .fig-meta-strip {
      padding: 9px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .fig-diag-list {
      padding: 7px 13px 9px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .fig-compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    @media (max-width: 820px) {
      .fig-grid, .fig-compare-grid { grid-template-columns: minmax(0, 1fr); }
    }
    /* Top-Level Static Lightbox (Immune to 1.2s Stage Redraw!) */
    .lb-dialog {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      width: min(1160px, 96vw);
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-pop);
    }
    .lb-head {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lb-stage {
      flex: 1 1 auto;
      min-height: 300px;
      max-height: 70vh;
      background: #ffffff;
      overflow: auto;
      padding: 18px;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
    }
    .lb-stage img { display: block; margin: auto; border-radius: 3px; }
    .lb-stage.zoom-fit img { max-width: 100%; max-height: 64vh; width: auto; height: auto; }
    .lb-stage.zoom-100 img { max-width: none; width: auto; height: auto; }
    .lb-stage.zoom-150 img { max-width: none; width: 150%; height: auto; }
    .lb-stage.zoom-200 img { max-width: none; width: 200%; height: auto; }
    .lb-foot {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .cmd-log-row {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cmd-log-row:last-child { border-bottom: none; }
    .cmd-code-line {
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      color: var(--text);
      word-break: break-all;
    }

    /* Interactive Seat Hot-Swap Pills & Quota Backup Badges */
    .seat-swap-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      height: auto;
      max-width: 100%;
      min-width: 0;
      padding: 3px 9px 3px 4px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      line-height: 1.25;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .seat-swap-pill:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .seat-swap-pill .swap-ic {
      opacity: 0.45;
      display: inline-flex;
      flex-shrink: 0;
      transition: opacity 0.14s ease;
    }
    .seat-swap-pill:hover .swap-ic {
      opacity: 1;
      color: var(--accent);
    }
    .seat-bk-hint {
      font-size: 10.5px;
      color: var(--ok);
      background: var(--ok-soft);
      border: 1px solid var(--ok-border);
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 16px;
      white-space: nowrap;
      flex-shrink: 0;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* v5.6.0 Three-Tier Sandbox Center, Topbar Pill & Per-Seat Permission Badges */
    .sb-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 26px;
      height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-2);
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .sb-pill:hover { border-color: var(--border-strong); background: var(--surface-2); color: var(--text); }
    .sb-pill.sb-rw {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }
    .sb-pill.sb-danger {
      background: var(--err-soft);
      color: var(--err);
      border-color: var(--err-border);
    }
    .sb-tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin: 10px 0 14px;
    }
    .sb-tier-card {
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .sb-tier-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .sb-tier-card.danger {
      border-color: var(--err-border);
    }
    .sb-tier-card.danger.active {
      border-color: var(--err);
      background: var(--err-soft);
    }
    .sb-tier-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: var(--text);
    }
    .sb-tier-desc {
      font-size: 11.5px;
      color: var(--text-2);
      line-height: 1.45;
      flex: 1;
    }
    .add-dir-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .add-dir-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 7px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      font-size: 12px;
    }
    .add-dir-path {
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      color: var(--text);
      overflow-wrap: anywhere;
      min-width: 0;
      flex: 1;
    }
    .seat-sb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      min-width: 22px;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-2);
      font-size: 10.5px;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    .seat-sb-btn.rw { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .seat-sb-btn.danger { background: var(--err-soft); color: var(--err); border-color: var(--err-border); }
  </style>
</head>
<body>
  <!-- Machado et al. (IEEE TVCG 2009, Table 1) Exact Linear-RGB Color Vision Deficiency Proofing Filters -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <defs>
      <filter id="cvd-protan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="cvd-deutan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="cvd-tritan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.303900 0 0  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- ==================== RESPONSIVE STICKY TOP BAR ==================== -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark" id="brand-icon"></span>
        <span>AGY Roundtable</span>
        <button type="button" id="btn-ver-pill" class="tag tabular" style="height:20px; min-height:20px; padding:0 6px; font-size:10.5px; cursor:pointer; border:1px solid var(--border); background:var(--surface-subtle); color:var(--text-2); margin-left:2px; flex-shrink:0;" onclick="onVersionPillClick()" title="版本与更新检查">v5.7.2</button>
      </div>
      <div class="v-sep"></div>
      <div class="proj-picker">
        <select id="project-select" onchange="onQuickProjectSelect(this.value)" title="Switch Workspace"></select>
        <button class="btn btn-ghost btn-icon" id="btn-browse-folder" onclick="openFolderBrowserModal()" title="Browse folder"></button>
        <button class="btn btn-ghost btn-icon" id="btn-open-folder" onclick="openCurrentFolder()" title="Open in Explorer"></button>
      </div>
      <div class="v-sep"></div>
      <nav class="topbar-nav" aria-label="Primary">
        <button class="nav-btn active" id="nav-workspace" onclick="switchView('workspace')">
          <span id="nav-workspace-lbl">现场</span>
          <span id="badge-active-count" class="tag tag-accent hidden" style="height:18px; padding:0 6px; font-size:10.5px;">0</span>
        </button>
        <button class="nav-btn" id="nav-history" onclick="switchView('history')">
          <span id="nav-history-lbl">历史</span>
          <span id="badge-history-count" class="nav-count">0</span>
        </button>
        <button class="nav-btn" id="nav-members" onclick="switchView('members')">
          <span id="nav-members-lbl">成员</span>
          <span id="badge-member-count" class="nav-count">0</span>
        </button>
      </nav>
    </div>

    <div class="topbar-right">
      <span id="paused-pill" class="tag tag-warn hidden"></span>
      <button type="button" id="btn-sandbox-pill" class="sb-pill sb-ro" onclick="openSandboxModal()" title="沙箱与目录权限中心">🔒 只读</button>
      <button class="kbd-pill" id="btn-cmd-k" onclick="openCmdK()" title="Quick Switch Specialist & Actions (Ctrl+K)" aria-label="Quick Switch Specialist"></button>
      <button class="btn btn-sm" id="btn-new-task" onclick="toggleComposerOpen()" aria-label="New Task"></button>
      <button class="btn btn-ghost btn-icon" id="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle Theme"></button>
      <button class="btn btn-ghost btn-sm" id="btn-lang-toggle" onclick="toggleLanguage()" style="font-weight:600;" aria-label="Toggle Language"></button>
      <button class="btn btn-ghost btn-icon" id="btn-utils-menu" onclick="toggleUtilsMenu(event)" title="Workspace Settings" aria-label="Workspace Settings"></button>
    </div>
  </header>

  <!-- Floating Settings & Engine Popover -->
  <div id="utils-popover" class="popover hidden"></div>

  <main class="shell">
    <!-- ==================== VIEW 1: STUDIO WORKSPACE ==================== -->
    <section id="view-workspace">
      <div id="composer-panel" class="composer-panel hidden">
        <div class="composer-head">
          <div class="seg" id="mode-tabs">
            <button class="seg-btn active" data-mode="roundtable" onclick="selectComposerMode('roundtable')"></button>
            <button class="seg-btn" data-mode="chief_dispatch" onclick="selectComposerMode('chief_dispatch')"></button>
            <button class="seg-btn" data-mode="custom_dag" onclick="selectComposerMode('custom_dag')"></button>
            <button class="seg-btn" data-mode="single_member" onclick="selectComposerMode('single_member')"></button>
          </div>
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; max-width:100%;">
            <select id="cmp-sandbox" style="width:auto; max-width:100%; min-height:29px; padding:4px 26px 4px 8px; font-size:12px;" onchange="CMP.sandboxUserTouched=true; renderComposerStudio(); renderFigureContractStrip(); renderComposerSandboxBanner();"></select>
            <button type="button" class="btn btn-sec btn-xs" id="btn-cmp-perm-center" onclick="openSandboxModal()" title="沙箱与跨目录权限中心">🛡️ 权限中心</button>
            <button class="btn btn-ghost btn-icon hidden" id="btn-close-composer" onclick="setComposerOpen(false)" title="Close"></button>
          </div>
        </div>

        <div id="composer-sandbox-banner"></div>
        <div id="composer-mode-hint" class="composer-mode-hint"></div>
        <div id="composer-mode-studio"></div>
        <div id="composer-playbooks-bar" class="preset-strip" style="margin-bottom:8px;"></div>
        <div id="composer-figure-contract"></div>

        <div style="margin-bottom:10px;">
          <textarea id="cmp-goal"></textarea>
        </div>

        <div class="composer-footer">
          <div class="composer-launch-row">
            <details id="cmp-adv-details" data-persist-id="cmp-adv" style="margin:0; flex:1 1 260px; min-width:0;">
              <summary id="cmp-adv-summary"></summary>
              <div class="grid-3" style="margin-top:10px;">
                <div>
                  <label id="lbl-cmp-title"></label>
                  <input type="text" id="cmp-title">
                </div>
                <div>
                  <label id="lbl-cmp-scope"></label>
                  <input type="text" id="cmp-subscope" value=".">
                </div>
                <div style="display:flex; flex-direction:column; gap:6px; justify-content:center; padding-top:8px;">
                  <label style="display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
                    <input type="checkbox" id="cmp-manual-rule" style="width:auto; flex-shrink:0;">
                    <span id="lbl-cmp-manual"></span>
                  </label>
                  <label style="display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
                    <input type="checkbox" id="cmp-reuse-sess" style="width:auto; flex-shrink:0;">
                    <span id="lbl-cmp-reuse"></span>
                  </label>
                </div>
              </div>
            </details>
            <button class="btn" id="btn-launch-task" onclick="submitTask()" style="flex-shrink:0; align-self:flex-start;"></button>
          </div>
        </div>
      </div>

      <!-- Active Task Pills (when >1 unarchived task in workspace) -->
      <div id="stage-pills" class="task-pills-row hidden"></div>

      <!-- Main Stage Surface + Persistent Interject Dock -->
      <div id="active-stage-container">
        <div id="active-stage-dynamic"></div>
        <div id="active-stage-interject" class="interject-wrap hidden">
          <div id="mention-popup" class="mention-popup hidden"></div>
          <div id="quick-target-bar" class="quick-target-bar"></div>
          <div class="interject-dock" style="border:none; padding-top:8px;">
            <select id="interject-target" class="hidden"></select>
            <input type="text" id="interject-input"
              oninput="onInterjectInput(this)"
              onkeydown="onInterjectKeydown(event)">
            <label style="display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; color:var(--text-2); white-space:nowrap;">
              <input type="checkbox" id="interject-wake" checked style="width:auto;">
              <span id="lbl-interject-wake"></span>
            </label>
            <button class="btn btn-sm" id="btn-interject-send" onclick="sendInterjection()"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== VIEW 2: HISTORY ==================== -->
    <section id="view-history" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div class="seg">
            <button class="seg-btn active" id="hist-scope-cur" onclick="setHistoryScope('current')"></button>
            <button class="seg-btn" id="hist-scope-all" onclick="setHistoryScope('all')"></button>
          </div>
          <input type="text" id="hist-search" style="flex:1 1 180px; max-width:260px; min-width:0; min-height:32px;" oninput="renderHistoryView()">
        </div>
        <button class="btn btn-sec btn-sm" id="btn-archive-all" onclick="archiveAllCompleted()"></button>
      </div>
      <div id="history-container"></div>
    </section>

    <!-- ==================== VIEW 3: MEMBERS & MODELS ==================== -->
    <section id="view-members" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
        <div>
          <div style="font-size:15px; font-weight:600;" id="lbl-members-heading"></div>
          <div style="font-size:12px; color:var(--text-2);" id="lbl-members-sub"></div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-sec btn-sm" id="btn-auto-bind-all" onclick="autoBindAllBackupsAction()"></button>
          <button class="btn btn-sm" id="btn-optimize-roster" onclick="optimizeRosterAction()"></button>
          <button class="btn btn-sec btn-sm" id="btn-refresh-models" onclick="loadCapabilities(true)"></button>
        </div>
      </div>

      <div id="members-grid" class="grid-2" style="margin-bottom:14px;"></div>

      <div class="composer-panel" style="margin-bottom:12px; padding:14px 16px;">
        <details data-persist-id="tpl-gallery-drawer" open>
          <summary id="lbl-tpl-gallery"></summary>
          <div id="tpl-gallery-grid" class="grid-2" style="margin-top:12px;"></div>
        </details>
      </div>

      <div class="composer-panel" style="margin-bottom:12px; padding:14px 16px;">
        <details data-persist-id="add-member-drawer">
          <summary id="lbl-add-member"></summary>
          <div class="grid-3" style="margin-top:12px;">
            <div><label id="lbl-m-id"></label><input type="text" id="add-m-id"></div>
            <div><label id="lbl-m-name"></label><input type="text" id="add-m-name"></div>
            <div><label id="lbl-m-role"></label><select id="add-m-role"></select></div>
            <div>
              <label id="lbl-m-client"></label>
              <select id="add-m-client" onchange="populateClientModels('add-m-client', 'add-m-model', 'add-m-effort')">
                <option value="antigravity">Antigravity (Gemini / Claude)</option>
                <option value="codex">Codex (GPT)</option>
              </select>
            </div>
            <div><label id="lbl-m-model"></label><select id="add-m-model" onchange="syncClientEfforts('add-m-client', 'add-m-model', 'add-m-effort')"></select></div>
            <div><label id="lbl-m-effort"></label><select id="add-m-effort"></select></div>
          </div>
          <div class="grid-3" style="margin-top:10px;">
            <div><label id="lbl-m-spec"></label><input type="text" id="add-m-spec"></div>
            <div>
              <label id="lbl-m-grounding"></label>
              <select id="add-m-grounding">
                <option value="strict">Strict (Anti-Hallucination)</option>
                <option value="balanced">Balanced</option>
              </select>
            </div>
            <div>
              <label id="lbl-m-sandbox">文件权限 (Sandbox)</label>
              <select id="add-m-sandbox">
                <option value="workspace-write">允许修改文件 (workspace-write)</option>
                <option value="read-only">仅只读分析 (read-only)</option>
              </select>
            </div>
          </div>
          <div style="margin-top:10px;">
            <label id="lbl-m-persona"></label>
            <textarea id="add-m-persona" style="min-height:66px;"></textarea>

    function toast(msg, isErr = false) {
      const el = document.getElementById('toast');
      el.className = 'toast' + (isErr ? ' is-err' : '');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._tt);
      window._tt = setTimeout(() => { el.style.display = 'none'; }, 3400);
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPathBreakable(p) {
      return esc(p || '-').replace(/([\\/])/g, '$1<wbr>');
    }

    function _normModelTok(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    }

    function formatMemberOptionLabel(m, id) {
      const name = String(m?.name || id || '').trim();
      const eng = m?.client === 'antigravity' ? 'AGY' : 'Codex';
      const slug = String(m?.model || '').trim();
      const disp = String(
        ((CAPS.clients?.[m?.client]?.models) || []).find(x => x.slug === slug)?.display_name || slug
      ).trim();
      // Only omit trailing model suffix if name's final (...) or [...] already matches model slug/display name!
      const tailMatch = name.match(/(?:\(([^()]+)\)|\[([^\[\]]+)\])\s*$/);
      let alreadyHasModel = false;
      if (tailMatch) {
        const tailNorm = _normModelTok(tailMatch[1] || tailMatch[2] || '');
        const slugNorm = _normModelTok(slug);
        const dispNorm = _normModelTok(disp);
        if (tailNorm && ((slugNorm && tailNorm.includes(slugNorm)) || (dispNorm && tailNorm.includes(dispNorm)))) {
          alreadyHasModel = true;
        }
      }
      return alreadyHasModel ? `[${eng}] ${name}` : `[${eng}] ${name} (${disp || slug})`;
    }

    function formatFigureInspectBits(insp, fObj = null) {
      const metaBits = [];
      if (!insp || typeof insp !== 'object') {
        if (fObj?.size) metaBits.push(`${Math.max(1, Math.round(fObj.size / 1024))} KB`);
        return metaBits;
      }
      if (insp.width_px && insp.height_px) metaBits.push(`${insp.width_px}×${insp.height_px}px`);
      if (insp.dpi_x) metaBits.push(`${insp.dpi_x} DPI`);
      const mW = insp.physical_width_mm ?? insp.canvas_width_mm ?? insp.width_mm;
      const mH = insp.physical_height_mm ?? insp.canvas_height_mm ?? insp.height_mm;
      if (mW && mH) metaBits.push(`${mW}×${mH}mm`);
      const vb = insp.viewBox ?? insp.viewbox;
      if (vb) metaBits.push(`viewBox ${vb}`);
      const effFont = insp.effective_min_font_pt ?? insp.min_font_pt ?? insp.min_font_size_pt;
      if (effFont !== null && effFont !== undefined) {
        metaBits.push(`minFont ${effFont}pt`);
      } else if (insp.font_status === 'no_text_nodes') {
        metaBits.push(LANG === 'en' ? 'no <text> (outlined?)' : '无<text>节点(疑似转曲)');
      } else if (insp.font_status === 'unmeasured_complex') {
        metaBits.push(LANG === 'en' ? 'font unparsed' : '字号未解析');
      }
      if (insp.is_blank === true) metaBits.push(LANG === 'en' ? 'BLANK!' : '全空白异常!');
      if (fObj?.size) metaBits.push(`${Math.max(1, Math.round(fObj.size / 1024))} KB`);
      return metaBits;
    }

      return FIG_PROOF_FILTER && FIG_PROOF_FILTER !== 'normal' ? `proof-${FIG_PROOF_FILTER}` : '';

    function normPath(p) {
      return String(p || '').replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase();

    function fmtTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function fmtElapsedSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function liveTimerBadge(startedAt) {
      if (!startedAt) return '';
      const sec = Math.max(0, (Date.now() / 1000) - startedAt);
      return `<span class="tag tag-accent live-timer" data-started-at="${startedAt}">${fmtElapsedSec(sec)}</span>`;
    }

    function updateLiveTimersInDom() {
      const nowSec = Date.now() / 1000;
      document.querySelectorAll('.live-timer[data-started-at]').forEach(el => {
        const st = parseFloat(el.getAttribute('data-started-at') || '0');
        if (st > 0) el.textContent = fmtElapsedSec(nowSec - st);
      });
    }

    function initialsFor(id, member) {
      if (id === 'user') return LANG === 'en' ? 'You' : '我';
      const name = String(member?.name || id || '?').trim();
      if (/^Antigravity/i.test(name)) return 'AG';
      if (/^Codex/i.test(name)) return 'CX';
      const ascii = name.match(/[A-Za-z0-9]+/g);
      if (ascii && ascii.length >= 2) return (ascii[0][0] + ascii[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

      const cls = ['avatar'];
      if (id === 'user') cls.push('av-human');
      if (opts.speaking) cls.push('av-speaking');

      return `<span class="${cls.join(' ')}" title="${esc(member?.name || id)}">${esc(initialsFor(id, member))}</span>`;

      const map = {

        running: [t('stRunning'), 'dot-run', 'tag-accent'],
        working: [t('stWorking'), 'dot-run', 'tag-accent'],

        aborted: [t('stAborted'), 'dot-warn', 'tag-warn'],
        failed: [t('stFailed'), 'dot-err', 'tag-err']

      return map[st] || [st || '-', '', ''];

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      const d = await r.json();
      if (!r.ok || d.ok === false) throw new Error(d.error || `HTTP ${r.status}`);
      return d;
    }

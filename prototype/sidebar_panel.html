      LAST_STAGE_STRUCT_SIG = '';
      if (STATE) renderAll(STATE, { forceFullStage: true });
    }

    function renderLiveRosterStrip(st, task) {
      const ms = st.members || {};
      const steps = task.steps || [];
      const meta = task.mode_meta || {};
      const mode = task.execution_mode || task.dispatch_mode || 'single_member';
      const hostId = meta.host_member_id || meta.chief_member_id || steps[0]?.member_id;
      const parts = meta.participants || [...new Set(steps.map(s => s.member_id))];
      const ordered = (hostId && parts.includes(hostId)) ? parts : (hostId ? [hostId, ...parts.filter(x => x !== hostId)] : parts);
      const consultTotal = steps.reduce((a, s) => a + (s.consult_count || 0), 0);
      const boundCount = ordered.filter(mid => Boolean(ms[mid]?.quota_backup)).length;

      // Completed: calm summary + clickable hot-swap specialist pills + quick backup binding & add-seat controls
      if (task.status === 'succeeded') {
        const sumTxt = mode === 'roundtable'
          ? t('consensusDone', { n: ordered.length, r: meta.discussion_rounds || 2, c: consultTotal })
          : t('completedSummary', { n: steps.length, m: (task.chat_room || []).length });
        const chips = ordered.map(mid => {
          const m = ms[mid] || { name: mid };
          const isHost = mid === hostId && (mode === 'roundtable' || mode === 'chief_dispatch');
          const qb = m.quota_backup;
          const bkShort = qb ? (qb.model || qb.display_name || '') : '';
          const tip = qb
            ? `${t('swapSeatTip')} · ${t('boundBackupLbl')}: ${qb.display_name || qb.model}`
            : t('swapSeatTip');
          return `
            <button class="seat-swap-pill" onclick="openSeatSwapModal('${esc(task.id)}', '${esc(mid)}')" title="${esc(tip)}">
              ${avatarHtml(mid, m, { sm: true })}
              <span class="tx">${esc(m.name || mid)}</span>
              ${isHost ? svgIcon('crown', 11) : ''}
              ${bkShort ? `<span class="seat-bk-hint" title="${esc(t('boundBackupLbl') + ': ' + bkShort)}">↳ ${esc(bkShort)}</span>` : ''}
              <span class="swap-ic">${svgIcon('repeat', 11)}</span>
            </button>
          `;
        }).join('');
        return `
          <div class="live-roster-strip">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
              <span style="font-size:12px; color:var(--text-2); display:inline-flex; align-items:center; gap:7px;">
                <span class="dot dot-ok"></span>${esc(sumTxt)}
              </span>
              <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
                <button class="btn btn-ghost btn-xs" onclick='openSeatBackupsOverviewModal("${esc(task.id)}", ${JSON.stringify(ordered)})'>
                  ${svgIcon('shield', 11)} ${esc(t('bindBackupsBtn'))} <span class="tabular" style="opacity:0.75;">${boundCount}/${ordered.length}</span>
                </button>
                <button class="btn btn-ghost btn-xs" onclick="openAddSeatModal('${esc(task.id)}')">
                  ${svgIcon('plus', 11)} ${esc(t('addSeatBtn'))}
                </button>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">${chips}</div>
          </div>
        `;
      }

      // Running / Active: clean 2-row seat cards giving 100% width to specialist name + mid-process hot-swap!
      const curStep = steps.find(s => s.status === 'running') || steps[task.current_step_index || 0] || steps[steps.length - 1];
      const latestByMember = {};
      steps.forEach(s => {
        const att = (s.attempts || [])[s.attempts.length - 1];
        const txt = (s.status === 'running' && att?.partial_text) ? att.partial_text : (s.latest_result_text || '');
        if (txt) latestByMember[s.member_id] = txt;
      });
      (task.chat_room || []).forEach(cm => {
        if (cm.sender_id && cm.sender_id !== 'user' && cm.content) latestByMember[cm.sender_id] = cm.content;
      });

      const cards = ordered.map(mid => {
        const m = ms[mid] || { name: mid, client: 'codex', model: '-' };
        const isHost = mid === hostId && (mode === 'roundtable' || mode === 'chief_dispatch');
        const runStep = steps.find(s => s.status === 'running' && s.member_id === mid);
        const runAtt = runStep?.attempts?.[runStep.attempts.length - 1];
        const isSpeaking = Boolean(runStep) || (m.status === 'working' && m.current_task_id === task.id);
        const liveAct = isSpeaking ? (m.live_activity || '') : '';
        const snip = liveAct || latestByMember[mid] || '';
        const qb = m.quota_backup;
        return `
          <div class="seat-card ${isSpeaking ? 'speaking' : ''}">
            ${avatarHtml(mid, m, { speaking: isSpeaking })}
            <div style="min-width:0; flex:1;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <div style="min-width:0; flex:1; display:flex; align-items:center; gap:4px;" title="${esc(m.name || mid)}">
                  ${isHost ? svgIcon('crown', 12) : ''}<span class="tx" style="font-size:12.5px; font-weight:600;">${esc(m.name || mid)}</span>
                </div>
                <div style="display:inline-flex; align-items:center; gap:4px; flex-shrink:0;">
                  ${isSpeaking ? liveTimerBadge(runAtt?.started_at) : `<span style="font-size:11px; color:var(--text-3); white-space:nowrap;">${esc(snip ? t('spoke') : t('listening'))}</span>`}
                </div>
              </div>
              <div style="font-size:11px; color:var(--text-3); margin-top:4px; display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap; min-width:0;">
                  <span class="tx" style="max-width:130px;">${esc(m.model || '-')}</span>
                  ${qb
                    ? `<span class="seat-bk-hint" style="cursor:pointer;" onclick="openSeatSwapModal('${esc(task.id)}', '${esc(mid)}')" title="${esc(t('boundBackupLbl'))}">↳ ${esc(qb.model || qb.display_name || '')}</span>`
                    : `<span style="cursor:pointer; text-decoration:underline dotted; opacity:0.75;" onclick="openSeatSwapModal('${esc(task.id)}', '${esc(mid)}')">${esc(t('unboundBackupLbl'))}</span>`}
                </div>
                <button class="btn btn-ghost btn-xs" onclick="openSeatSwapModal('${esc(task.id)}', '${esc(mid)}')" title="${esc(t('swapSeatTip'))}">
                  ${svgIcon('repeat', 10)} ${esc(t('swapSeatBtn'))}
                </button>
              </div>
              ${snip ? `<div class="seat-snippet">${esc(snip.slice(0, 96))}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="live-roster-strip">
          <div class="live-phase-row">
            <span style="font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:7px; min-width:0;">
              <span class="dot dot-run"></span>
              <span class="u-wrap">${esc(t('liveAgenda', { phase: curStep?.round_label || curStep?.title || '-' }))}</span>
            </span>
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <button class="btn btn-ghost btn-xs" onclick='openSeatBackupsOverviewModal("${esc(task.id)}", ${JSON.stringify(ordered)})'>
                ${svgIcon('shield', 11)} ${esc(t('bindBackupsBtn'))} ${boundCount}/${ordered.length}
              </button>
              <button class="btn btn-ghost btn-xs" onclick="openAddSeatModal('${esc(task.id)}')">
                ${svgIcon('plus', 11)} ${esc(t('addSeatBtn'))}
              </button>
              <span class="tabular" style="color:var(--text-3);">${esc(t('msgsUnit', { n: (task.chat_room || []).length }))}</span>
            </div>
          </div>
          <div class="seat-grid">${cards}</div>
        </div>
      `;
    }

    function renderRunningDiscussionEntries(st, task) {
      const ms = st.members || {};
      const runningSteps = (task.steps || []).filter(s => s.status === 'running');
      if (!runningSteps.length) return '';
      return runningSteps.map(s => {
        const m = ms[s.member_id] || { name: s.member_id };
        const att = (s.attempts || [])[s.attempts.length - 1];
        const partial = att?.partial_text || m.live_activity || (LANG === 'en' ? 'Analyzing workspace files...' : '正在查阅项目文件并思考...');
        return `
          <article class="chat-entry">
            ${avatarHtml(s.member_id, m, { speaking: true })}
            <div class="chat-entry-body">
              <div class="chat-entry-meta">
                <strong>${esc(m.name || s.member_id)}</strong>
                <span class="tag tag-accent"><span class="dot dot-run"></span>${esc(s.title)}</span>
                ${liveTimerBadge(att?.started_at)}
              </div>
              <div class="doc-reading" style="margin:0; max-width:none; color:var(--text-2); font-size:13px;">${renderLiteMarkdown(partial.slice(-1400), { taskId: task.id })}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderDiscussionTab(st, task) {
      const msgs = task.chat_room || [];
      const ms = st.members || {};
      const runningSteps = (task.steps || []).filter(s => s.status === 'running');
      if (!msgs.length && !runningSteps.length) {
        return `<div style="padding:28px 0; text-align:center; color:var(--text-3);">${esc(t('noChatYet'))}</div>`;
      }

      let lastRound = '';
      const out = [];
      for (const cm of msgs) {
        const rl = cm.round_label || '';
        if (rl && rl !== lastRound) {
          lastRound = rl;
          out.push(`<div class="chat-round-divider">${esc(rl)}</div>`);
        }
        const isUser = cm.sender_id === 'user';
        const mem = ms[cm.sender_id] || { name: cm.sender_name, client: cm.sender_client || 'codex' };
        let kindTag = '';
        if (cm.kind === 'mention_ask') kindTag = `<span class="tag tag-warn">@${esc(cm.to_member_name || cm.to_member_id)}</span>`;
        else if (cm.kind === 'mention_reply') kindTag = `<span class="tag tag-accent">↳ @${esc(cm.to_member_name || cm.to_member_id)}</span>`;
        else if (cm.kind === 'review') kindTag = `<span class="tag">${LANG === 'en' ? 'Review' : '审查意见'}</span>`;
        else if (cm.kind === 'fact_check') kindTag = `<span class="tag tag-accent">${svgIcon('shield', 11)}${LANG === 'en' ? 'Fact-Check' : '事实核查'}</span>`;
        else if (cm.kind === 'deliverable') kindTag = `<span class="tag tag-ok">${LANG === 'en' ? 'Synthesis' : '终稿交付'}</span>`;

        const rawC = cm.content || '';
        const isLong = rawC.length > 900;
        const expanded = EXPANDED_MSGS.has(cm.id);
        const shown = (isLong && !expanded) ? (safeSliceMarkdown(rawC, 820) + '\n\n*...*') : rawC;

        out.push(`
          <article class="chat-entry ${isUser ? 'is-user' : ''}" data-msg-id="${esc(cm.id)}">
            ${avatarHtml(cm.sender_id, mem)}
            <div class="chat-entry-body">
              <div class="chat-entry-meta">
                <strong>${esc(cm.sender_name || cm.sender_id)}</strong>
                ${cm.sender_model ? `<span>${esc(cm.sender_model)}</span>` : ''}
                ${kindTag}
                <span class="tabular">${fmtTime(cm.ts)}</span>
              </div>
              <div class="doc-reading chat-msg-md" style="margin:0; max-width:none; font-size:13.5px;">${renderLiteMarkdown(shown, { taskId: task.id })}</div>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px;">
                ${isLong ? `<button class="btn btn-sec btn-sm btn-expand-msg" onclick="toggleExpandMsg('${esc(cm.id)}')">${esc(expanded ? t('collapseText') : t('expandFull', { n: rawC.length }))}</button>` : ''}
                ${!isUser && task.status !== 'running' ? `
                  <button class="btn btn-ghost btn-sm" onclick="openFactCheckModal('${esc(task.id)}', '${esc(cm.id)}')">${svgIcon('shield', 12)} ${esc(t('checkThisMsg'))}</button>
                  <button class="btn btn-ghost btn-sm" onclick="openReanswerModal('${esc(task.id)}', '${esc(cm.id)}')">${svgIcon('repeat', 12)} ${esc(t('reanswerMsg'))}</button>
                ` : ''}
              </div>
            </div>
          </article>
        `);
      }

      out.push(`<div id="live-running-entries">${renderRunningDiscussionEntries(st, task)}</div>`);
      return `<div class="chat-list">${out.join('')}</div>`;
    }

    async function loadPlottingBackends(refresh = false) {
      try {
        PLOT_BACKENDS = await api('GET', `/api/env/plotting_backends?refresh=${refresh ? 1 : 0}`);
        if (UTILS_OPEN) renderUtilsPopover();
        renderFigureContractStrip();
        if (STATE && FOCUSED_TASK_ID && MANUAL_STAGE_TABS[FOCUSED_TASK_ID] === 'artifacts') renderAll(STATE);
      } catch (e) { console.error(e); }
    }

    function _artifactsCacheSig(task) {
      const doneSteps = (task?.steps || []).filter(s => ['succeeded', 'failed', 'aborted', 'blocked'].includes(s.status)).length;
      return `${task?.status || ''}|${doneSteps}|${task?.research_signoff?.verified_at || 0}|${(task?.steps || []).length}`;
    }

    async function loadTaskArtifacts(taskId, force = false) {
      if (!taskId) return;
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      const sig = _artifactsCacheSig(task);
      const cur = ARTIFACTS_CACHE[taskId];
      if (!force && cur && (cur.loading || cur.sig === sig)) return;
      ARTIFACTS_CACHE[taskId] = { sig, data: cur?.data || null, loading: true, error: '' };
      try {
        const res = await api('GET', `/api/tasks/artifacts?task_id=${encodeURIComponent(taskId)}`);
        ARTIFACTS_CACHE[taskId] = { sig, data: res, loading: false, error: '' };
      } catch (e) {
        ARTIFACTS_CACHE[taskId] = { sig, data: cur?.data || null, loading: false, error: e.message || String(e) };
      }
      if (STATE) renderAll(STATE);
      if (FIG_LIGHTBOX && FIG_LIGHTBOX.taskId === taskId) renderFigLightbox();
    }

    function setFigFmt(figId, fmt) {
      FIG_UI[figId] = { ...(FIG_UI[figId] || { zoom: 'fit' }), fmt };
      if (STATE) renderAll(STATE);
    }

    function setFigZoom(figId, zoom) {
      FIG_UI[figId] = { ...(FIG_UI[figId] || {}), zoom };
      if (STATE) renderAll(STATE);
    }

    function setProofFilter(mode) {
      FIG_PROOF_FILTER = mode || 'normal';
      if (FIG_LIGHTBOX) renderFigLightbox();
      if (STATE) renderAll(STATE);
    }

    function renderProofFilterBar(compact = false) {
      const opts = [
        ['normal', t('proofNormal')],
        ['grayscale', t('proofGray')],
        ['deutan', t('proofDeutan')],
        ['protan', t('proofProtan')],
        ['tritan', t('proofTritan')]
      ];
      return `
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; ${compact ? '' : 'margin-bottom:12px;'}">
          <div class="seg" role="group" aria-label="Color Proofing Filter">
            ${opts.map(([val, lbl]) => `
              <button type="button" class="seg-btn ${FIG_PROOF_FILTER === val ? 'active' : ''}" onclick="setProofFilter('${val}')">${esc(lbl)}</button>
            `).join('')}
          </div>
          ${FIG_PROOF_FILTER !== 'normal' ? `<span style="font-size:11px; color:var(--text-3);">${esc(t('proofAidNote'))}</span>` : ''}
        </div>
      `;
    }

    function toggleFigCompare(figsList) {
      FIG_COMPARE.active = !FIG_COMPARE.active;
      if (FIG_COMPARE.active && Array.isArray(figsList) && figsList.length >= 2) {
        if (!FIG_COMPARE.leftId) FIG_COMPARE.leftId = figsList[0];
        if (!FIG_COMPARE.rightId) FIG_COMPARE.rightId = figsList[1];
      }
      if (STATE) renderAll(STATE);
    }

    async function verifyTaskManifest(taskId, manifestRel) {
      try {
        const r = await api('POST', '/api/tasks/verify_figure', { task_id: taskId, manifest_path: manifestRel });
        const ok = r.report?.ok;
        const stStr = r.report?.status || (ok ? 'passed' : 'failed');
        const msg = ok
          ? (stStr === 'not_verifiable' ? `${t('qaStructOnly')} (${r.report?.checked_artifacts || 0})` : t('artSignoffPass'))
          : `${t('artSignoffFail')}: ${(r.report?.blocking || [])[0] || ''}`;
        toast(msg, !ok);
        await refreshState(true);
        await loadTaskArtifacts(taskId, true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    function openGalleryFigLightbox(taskId, figId, preferredFmt = '') {
      const figs = ARTIFACTS_CACHE[taskId]?.data?.figures || [];
      const fig = figs.find(f => f.id === figId);
      if (!fig) return;
      const fmts = fig.format_list || Object.keys(fig.formats || {});
      const curFmt = (preferredFmt && fig.formats?.[preferredFmt]) ? preferredFmt : (FIG_UI[figId]?.fmt || fmts[0] || '');
      LAST_FOCUS_EL = document.activeElement;
      FIG_LIGHTBOX = {
        mode: 'gallery',
        taskId,
        figId,
        fmt: curFmt,
        zoom: 'fit'
      };
      renderFigLightbox();
      document.getElementById('fig-lightbox').style.display = 'flex';
    }

    function openSimpleFigLightbox(el) {
      if (!el) return;
      LAST_FOCUS_EL = document.activeElement;
      FIG_LIGHTBOX = {
        mode: 'simple',
        taskId: FOCUSED_TASK_ID || '',
        rawUrl: el.getAttribute('data-lb-url') || '',
        relPath: el.getAttribute('data-lb-path') || '',
        title: el.getAttribute('data-lb-title') || 'Figure',
        fmt: el.getAttribute('data-lb-fmt') || 'png',
        zoom: 'fit'
      };
      renderFigLightbox();
      document.getElementById('fig-lightbox').style.display = 'flex';
    }

    function setFigLightboxZoom(z) {
      if (!FIG_LIGHTBOX) return;
      FIG_LIGHTBOX.zoom = z;
      renderFigLightbox();
    }

    function setFigLightboxFmt(fmt) {
      if (!FIG_LIGHTBOX) return;
      FIG_LIGHTBOX.fmt = fmt;
      if (FIG_LIGHTBOX.figId) FIG_UI[FIG_LIGHTBOX.figId] = { ...(FIG_UI[FIG_LIGHTBOX.figId] || {}), fmt };
      renderFigLightbox();
    }

    function closeFigLightbox() {
      FIG_LIGHTBOX = null;
      const bd = document.getElementById('fig-lightbox');
      if (bd) bd.style.display = 'none';
      if (LAST_FOCUS_EL && typeof LAST_FOCUS_EL.focus === 'function') {
        try { LAST_FOCUS_EL.focus(); } catch (_) {}
      }
      LAST_FOCUS_EL = null;
    }

    function renderFigLightbox() {
      const body = document.getElementById('fig-lightbox-body');
      if (!body || !FIG_LIGHTBOX) return;
      let title = FIG_LIGHTBOX.title || 'Figure';
      let rawUrl = FIG_LIGHTBOX.rawUrl || '';
      let relPath = FIG_LIGHTBOX.relPath || '';
      let fmt = FIG_LIGHTBOX.fmt || '';
      let fmts = [];
      let insp = {};
      let fObj = null;
      let fig = null;

      if (FIG_LIGHTBOX.mode === 'gallery') {
        const figs = ARTIFACTS_CACHE[FIG_LIGHTBOX.taskId]?.data?.figures || [];
        fig = figs.find(f => f.id === FIG_LIGHTBOX.figId);
        if (fig) {
          title = fig.title || fig.stem;
          fmts = fig.format_list || Object.keys(fig.formats || {});
          fmt = (FIG_LIGHTBOX.fmt && fig.formats?.[FIG_LIGHTBOX.fmt]) ? FIG_LIGHTBOX.fmt : (fmts[0] || '');
          FIG_LIGHTBOX.fmt = fmt;
          fObj = fig.formats?.[fmt];
          insp = fObj?.inspect || {};
          relPath = fObj?.rel_path || '';
          rawUrl = fObj ? `/api/fs/raw_file?path=${encodeURIComponent(fObj.rel_path)}&task_id=${encodeURIComponent(FIG_LIGHTBOX.taskId)}&v=${Math.floor(fObj.mtime || 0)}` : '';
        }
      }

      const zoom = FIG_LIGHTBOX.zoom || 'fit';
      const metaBits = formatFigureInspectBits(insp, fObj);
      const isTiff = fmt === 'tiff' || fmt === 'tif';
      const isPdf = fmt === 'pdf';

      let stageBody = '';
      if (!rawUrl) {
        stageBody = `<div style="color:#71717a; font-size:13px;">No previewable asset</div>`;
      } else if (isPdf) {
        stageBody = `<iframe src="${esc(rawUrl)}" style="width:100%; height:64vh; border:none; background:#fff;"></iframe>`;
      } else if (isTiff) {
        stageBody = `
          <div style="text-align:center; padding:18px; color:#18181b; max-width:420px;">
            <div style="font-weight:600; font-size:14px; margin-bottom:6px;">TIFF Publication Raster · ${esc(title)}</div>
            <div style="font-size:12px; color:#52525b; margin-bottom:12px;">${esc(t('tiffPreviewHint'))}</div>
            <div style="font-family:ui-monospace,Consolas,monospace; font-size:12px; margin-bottom:12px;">${esc(metaBits.join(' · '))}</div>
            <button class="btn btn-sm" data-path="${esc(relPath)}" onclick="openItemNatively(this.getAttribute('data-path'), false)">${svgIcon('external', 12)} ${esc(t('openNative'))}</button>
          </div>
        `;
      } else {
        stageBody = `<img src="${esc(rawUrl)}" alt="${esc(title)}">`;
      }

      const fmtPills = fmts.map(f => `
        <button type="button" class="btn ${f === fmt ? 'btn-sm' : 'btn-ghost btn-sm'}" style="min-height:24px; padding:2px 7px; font-size:11px; text-transform:uppercase;" onclick="setFigLightboxFmt('${esc(f)}')">${esc(f)}</button>
      `).join('');

      const zoomBtns = (!isPdf && !isTiff) ? `
        <div class="seg">
          ${['fit', '100', '150', '200'].map(z => `
            <button type="button" class="seg-btn ${zoom === z ? 'active' : ''}" onclick="setFigLightboxZoom('${z}')">${z === 'fit' ? 'Fit' : z + '%'}</button>
          `).join('')}
        </div>
      ` : '';

      const diagItems = [
        ...((fig?.qa_blocking || []).map(b => `<div style="color:var(--err);">• [BLOCK] ${esc(b)}</div>`)),
        ...((fig?.qa_warnings || []).map(w => `<div style="color:var(--warn);">• [WARN] ${esc(w)}</div>`))
      ].join('');

      body.innerHTML = `
        <div class="lb-head">
          <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1; flex-wrap:wrap;">
            <strong style="font-size:14px;" class="u-wrap">${esc(title)}</strong>
            ${fmtPills}
          </div>
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            ${zoomBtns}
            ${relPath ? `<button class="btn btn-sec btn-sm" data-path="${esc(relPath)}" onclick="openItemNatively(this.getAttribute('data-path'), false)">${svgIcon('external', 12)} ${esc(t('openNative'))}</button>` : ''}
            ${FIG_LIGHTBOX.taskId ? `<button class="btn btn-sec btn-sm" data-tid="${esc(FIG_LIGHTBOX.taskId)}" data-fid="${esc(fig ? fig.id : relPath)}" data-mf="${esc(fig?.manifest_rel || '')}" onclick="closeFigLightbox(); openPlotFixModal(this.getAttribute('data-tid'), this.getAttribute('data-fid'), this.getAttribute('data-mf'))">${svgIcon('edit', 12)} ${esc(t('plotFixBtn'))}</button>` : ''}
            <button class="btn btn-ghost btn-icon" onclick="closeFigLightbox()" aria-label="${esc(t('close'))}">${svgIcon('x', 15)}</button>
          </div>
        </div>
        <div style="padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface-subtle);">
          ${renderProofFilterBar(true)}
        </div>
        <div class="lb-stage zoom-${esc(zoom)} ${proofFilterClass()}">${stageBody}</div>
        ${diagItems ? `<div class="fig-diag-list">${diagItems}</div>` : ''}
        <div class="lb-foot">
          <span class="tabular u-wrap" style="font-family:ui-monospace,Consolas,monospace;">${esc(metaBits.join(' · ') || relPath || '-')}</span>
          ${relPath ? `<span class="u-wrap" style="font-family:ui-monospace,Consolas,monospace; color:var(--text-3);">${formatPathBreakable(relPath)}</span>` : ''}
        </div>
      `;
    }

    function openPlotFixModal(taskId, figIdOrPath, manifestRel = '') {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      if (!task) return;
      const figs = ARTIFACTS_CACHE[taskId]?.data?.figures || [];
      const fig = figs.find(f => f.id === figIdOrPath);
      const primaryRel = fig
        ? (fig.formats?.[FIG_UI[fig.id]?.fmt]?.rel_path || Object.values(fig.formats || {})[0]?.rel_path || fig.stem)
        : figIdOrPath;
      const mfRel = manifestRel || fig?.manifest_rel || '';
      const blocks = fig?.qa_blocking || [];
      const warns = fig?.qa_warnings || [];
      const ms = STATE?.members || {};
      const ids = getRunnableIds(STATE);
      const defaultWrite = task.sandbox === 'workspace-write';
      const preferredPlotter = ids.find(id => ms[id].client === 'codex' && ((ms[id].tags || []).includes('plotting') || id.includes('plot') || id === 'codex_author_2'))
        || ids.find(id => ms[id].client === 'codex')
        || ids[0] || '';
      const preferredReviewer = ids.find(id => id === 'agy_carbon_plotter' || (ms[id].tags || []).includes('plotting')) || ids[0] || '';
      const defTarget = defaultWrite ? preferredPlotter : preferredReviewer;

      window._PLOT_FIX_CTX = {
        taskId,
        primaryRel,
        mfRel,
        blocks,
        warns,
        isRunning: task.status === 'running'
      };

      const opts = ids.map(id => `<option value="${esc(id)}" ${id === defTarget ? 'selected' : ''}>${esc(formatMemberOptionLabel(ms[id], id))}</option>`).join('');
      const diagSummary = [...blocks.map(b => `[BLOCK] ${b}`), ...warns.map(w => `[WARN] ${w}`)];

      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
          <strong style="font-size:15px; display:inline-flex; align-items:center; gap:7px;">${svgIcon('edit', 15)} ${esc(t('plotFixTitle'))}</strong>
          <button class="btn btn-ghost btn-icon" onclick="closeModal()">${svgIcon('x', 15)}</button>
        </div>
        <div style="font-size:12px; color:var(--text-2); margin-bottom:12px;">${esc(t('plotFixDesc'))}</div>
        <div style="background:var(--surface-subtle); border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:12px; font-size:12px;">
          <div class="u-wrap"><strong>Figure:</strong> <code>${formatPathBreakable(primaryRel)}</code></div>
          ${mfRel ? `<div class="u-wrap" style="margin-top:3px;"><strong>Manifest:</strong> <code>${formatPathBreakable(mfRel)}</code></div>` : ''}
          ${diagSummary.length ? `<div style="margin-top:6px; color:var(--warn); font-size:11.5px;">${diagSummary.map(d => `<div>• ${esc(d)}</div>`).join('')}</div>` : ''}
        </div>
        <div style="margin-bottom:10px;">
          <label>${LANG === 'en' ? 'Target Specialist' : '指派修图 / 视觉质检专家'}</label>
          <select id="pf-member">${opts}</select>
        </div>
        ${!window._PLOT_FIX_CTX.isRunning ? `
          <div style="margin-bottom:10px;">
            <label>${LANG === 'en' ? 'Execution Permission' : '执行写盘权限'}</label>
            <select id="pf-sandbox">
              <option value="workspace-write" ${defaultWrite ? 'selected' : ''}>${esc(t('plotFixModeWrite'))}</option>
              <option value="read-only" ${!defaultWrite ? 'selected' : ''}>${esc(t('plotFixModeRo'))}</option>
            </select>
          </div>
        ` : ''}
        <div style="margin-bottom:12px;">
          <label>${esc(t('plotFixNote'))}</label>
          <textarea id="pf-note" style="min-height:78px;" placeholder="${esc(t('plotFixNotePh'))}"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-sec btn-sm" onclick="closeModal()">${esc(t('cancel'))}</button>
          <button class="btn btn-sm" onclick="submitPlotFix()">${svgIcon('send', 12)} ${esc(t('confirm'))}</button>
        </div>
      `, true);
    }

    async function submitPlotFix() {
      const ctx = window._PLOT_FIX_CTX;
      if (!ctx) return;
      const targetId = document.getElementById('pf-member')?.value || '';
      const note = (document.getElementById('pf-note')?.value || '').trim();
      const sandbox = document.getElementById('pf-sandbox')?.value || 'read-only';
      const diagLines = [
        ...(ctx.blocks || []).map(b => `- [BLOCK] ${b}`),
        ...(ctx.warns || []).map(w => `- [WARN] ${w}`)
      ];
      const prompt = [
        `[Figure Visual & QA Revision Request]`,
        `Target figure: ${ctx.primaryRel}`,
        ctx.mfRel ? `Manifest: ${ctx.mfRel}` : '',
        diagLines.length ? `Active QA diagnostics:\n${diagLines.join('\n')}` : '',
        note ? `Author visual revision instructions:\n${note}` : 'Please resolve all active figure QA blockers/warnings and re-export publication-grade assets + updated manifest.'
      ].filter(Boolean).join('\n\n');

      try {
        if (ctx.isRunning) {
          await api('POST', '/api/tasks/interject', {
            task_id: ctx.taskId,
            content: prompt,
            target_member_id: targetId || null,
            trigger_reply: false
          });
          closeModal();
          toast(t('plotFixSentRunning'));
        } else {
          await api('POST', '/api/tasks/followup', {
            task_id: ctx.taskId,
            prompt,
            target_member_id: targetId || null,
            sandbox,
            title: LANG === 'en' ? `Figure Fix · ${ctx.primaryRel.split('/').pop()}` : `视觉修图迭代 · ${ctx.primaryRel.split('/').pop()}`
          });
          closeModal();
          MANUAL_STAGE_TABS[ctx.taskId] = 'discussion';
          toast(t('plotFixSentFollowup'));
        }
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    function renderSingleFigureSurface(taskId, fig, isCompare = false) {
      const fmts = fig.format_list || Object.keys(fig.formats || {});
      const ui = FIG_UI[fig.id] || {};
      const curFmt = (ui.fmt && fig.formats?.[ui.fmt]) ? ui.fmt : (fmts[0] || '');
      const zoom = isCompare ? 'fit' : (ui.zoom || 'fit');
      const fObj = fig.formats?.[curFmt];
      const insp = fObj?.inspect || {};
      const rawUrl = fObj ? `/api/fs/raw_file?path=${encodeURIComponent(fObj.rel_path)}&task_id=${encodeURIComponent(taskId)}&v=${Math.floor(fObj.mtime || 0)}` : '';
      const isTiff = curFmt === 'tiff' || curFmt === 'tif';
      const isPdf = curFmt === 'pdf';
      const metaBits = formatFigureInspectBits(insp, fObj);

      let canvasBody = '';
      if (!fObj) {
        canvasBody = `<div style="color:#71717a; font-size:12px;">No previewable asset</div>`;
      } else if (isPdf) {
        canvasBody = `<iframe src="${esc(rawUrl)}" style="width:100%; height:360px; border:none; background:#fff;"></iframe>`;
      } else if (isTiff) {
        const dpiTxt = insp.dpi_x ? `${insp.dpi_x} × ${insp.dpi_y || insp.dpi_x} DPI` : '-';
        const pw = insp.physical_width_mm ?? insp.width_mm;
        const ph = insp.physical_height_mm ?? insp.height_mm;
        const mmTxt = pw ? `${pw} × ${ph} mm` : '-';
        const pxTxt = insp.width_px ? `${insp.width_px} × ${insp.height_px} px` : '-';
        canvasBody = `
          <div style="text-align:center; padding:12px; color:#18181b; max-width:340px;">
            <div style="font-weight:600; font-size:13px; margin-bottom:6px;">TIFF Publication Raster · ${esc(fig.stem)}</div>
            <div style="font-size:12px; color:#52525b; margin-bottom:10px;">${esc(t('tiffPreviewHint'))}</div>
            <div style="display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; font-family:ui-monospace,Consolas,monospace; font-size:11.5px;">
              <span style="background:#f4f4f5; padding:2px 7px; border-radius:4px;">${esc(pxTxt)}</span>
              <span style="background:#f4f4f5; padding:2px 7px; border-radius:4px;">${esc(dpiTxt)}</span>
              <span style="background:#f4f4f5; padding:2px 7px; border-radius:4px;">${esc(mmTxt)}</span>
            </div>
            <button class="btn btn-sm" data-path="${esc(fObj.rel_path)}" onclick="event.stopPropagation(); openItemNatively(this.getAttribute('data-path'), false)">${svgIcon('external', 12)} ${esc(t('openNative'))}</button>
          </div>
        `;
      } else {
        canvasBody = `<img src="${esc(rawUrl)}" alt="${esc(fig.title || fig.stem)}">`;
      }

      const fmtPills = fmts.map(fmt => `
        <button class="btn ${fmt === curFmt ? 'btn-sm' : 'btn-ghost btn-sm'}" style="min-height:22px; padding:1px 7px; font-size:10.5px; text-transform:uppercase;"
          onclick="setFigFmt('${esc(fig.id)}', '${esc(fmt)}')">${esc(fmt)}</button>
      `).join('');

      const zoomBtns = (!isCompare && !isPdf && !isTiff) ? `
        <div style="display:inline-flex; gap:2px;">
          ${['fit', '100', '150'].map(z => `
            <button class="btn ${zoom === z ? 'btn-sec btn-sm' : 'btn-ghost btn-sm'}" style="min-height:22px; padding:1px 6px; font-size:10.5px;"
              onclick="setFigZoom('${esc(fig.id)}', '${z}')">${z === 'fit' ? 'Fit' : z + '%'}</button>
          `).join('')}
        </div>
      ` : '';

      const qaStatus = fig.qa_status || (fig.qa_ok === true ? 'passed' : (fig.qa_ok === false ? 'failed' : 'unverified'));
      let qaBadge = `<span class="tag">${esc(fig.source || 'workspace')}</span>`;
      if (qaStatus === 'passed') {
        qaBadge = `<span class="tag tag-ok">${esc(t('qaPassFull', { a: fig.checked_artifacts || fmts.length || 1, p: fig.checked_panels || 0 }))}</span>`;
      } else if (qaStatus === 'not_verifiable') {
        qaBadge = `<span class="tag tag-warn">${esc(t('qaStructOnly'))}</span>`;
      } else if (qaStatus === 'stale') {
        qaBadge = `<span class="tag tag-warn">${esc(t('qaStale'))}</span>`;
      } else if (qaStatus === 'failed') {
        qaBadge = `<span class="tag tag-err">${esc(t('qaBlockN', { n: (fig.qa_blocking || []).length || 1 }))}</span>`;
      } else if (qaStatus === 'warn') {
        qaBadge = `<span class="tag tag-warn">${esc(t('qaWarnN', { n: (fig.qa_warnings || []).length || 1 }))}</span>`;
      }

      const blocks = fig.qa_blocking || [];
      const warns = fig.qa_warnings || [];
      const diagHtml = (blocks.length || warns.length) ? `
        <div class="fig-diag-list">
          ${blocks.slice(0, 4).map(b => `<div class="u-wrap" style="color:var(--err);">• ${esc(b)}</div>`).join('')}
          ${warns.slice(0, 3).map(w => `<div class="u-wrap" style="color:var(--warn);">• ${esc(w)}</div>`).join('')}
        </div>
      ` : '';

      const srcBtns = (fig.source_tables || []).map(tbl => `
        <button class="btn btn-ghost btn-sm" style="min-height:22px; padding:1px 7px; font-size:11px; max-width:100%;" data-path="${esc(tbl)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)">
          ${svgIcon('file', 11)} <span class="tx">${esc(t('artSourceCsv'))}: ${esc(tbl.split('/').pop())}</span>
        </button>
      `).join('');

      const candBtns = (fig.candidate_tables || []).slice(0, 2).map(tbl => `
        <button class="btn btn-ghost btn-sm" style="min-height:22px; padding:1px 7px; font-size:10.5px; border:1px dashed var(--border-strong); max-width:100%;" data-path="${esc(tbl)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)" title="${LANG === 'en' ? 'Unbound candidate table (same directory)' : '同目录未绑定候选数据表'}">
          ${svgIcon('file', 10)} <span class="tx">${esc(tbl.split('/').pop())}</span>
        </button>
      `).join('');

      const canvasClick = (!isPdf && fObj) ? `data-tid="${esc(taskId)}" data-fid="${esc(fig.id)}" data-fmt="${esc(curFmt)}" onclick="openGalleryFigLightbox(this.getAttribute('data-tid'), this.getAttribute('data-fid'), this.getAttribute('data-fmt'))"` : '';

      return `
        <div class="fig-card">
          <div class="fig-card-head">
            <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 160px; flex-wrap:wrap;">
              <strong style="font-size:13px;" class="u-wrap">${esc(fig.title || fig.stem)}</strong>
              ${qaBadge}
            </div>
            <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
              ${fmtPills}
              ${zoomBtns}
              ${fObj ? `<button class="btn btn-ghost btn-sm" style="min-height:22px; padding:1px 6px; font-size:10.5px;" data-tid="${esc(taskId)}" data-fid="${esc(fig.id)}" data-fmt="${esc(curFmt)}" onclick="openGalleryFigLightbox(this.getAttribute('data-tid'), this.getAttribute('data-fid'), this.getAttribute('data-fmt'))">${svgIcon('search', 11)} ${esc(t('lightboxBtn'))}</button>` : ''}
              ${fObj ? `<button class="btn btn-ghost btn-icon" style="width:24px; height:24px;" data-path="${esc(fObj.rel_path)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)" title="${esc(t('openNative'))}">${svgIcon('external', 12)}</button>` : ''}
            </div>
          </div>
          <div class="fig-canvas zoom-${esc(zoom)} ${proofFilterClass()}" ${canvasClick}>${canvasBody}</div>
          ${diagHtml}
          <div class="fig-meta-strip">
            <span class="tabular u-wrap" style="font-family:ui-monospace,Consolas,monospace; font-size:11px; flex:1 1 180px; min-width:0;">${esc(metaBits.join(' · ') || fObj?.rel_path || '-')}</span>
            <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
              ${srcBtns}
              ${candBtns}
              <button class="btn btn-sec btn-sm" style="min-height:22px; padding:1px 7px; font-size:11px;" data-tid="${esc(taskId)}" data-fid="${esc(fig.id)}" data-mf="${esc(fig.manifest_rel || '')}" onclick="openPlotFixModal(this.getAttribute('data-tid'), this.getAttribute('data-fid'), this.getAttribute('data-mf'))">${svgIcon('edit', 11)} ${esc(t('plotFixBtn'))}</button>
              ${fig.manifest_rel ? `<button class="btn btn-sec btn-sm" style="min-height:22px; padding:1px 7px; font-size:11px;" data-tid="${esc(taskId)}" data-mf="${esc(fig.manifest_rel)}" onclick="verifyTaskManifest(this.getAttribute('data-tid'), this.getAttribute('data-mf'))">${svgIcon('shield', 11)} ${esc(t('artVerifyManifest'))}</button>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderArtifactsTab(st, task) {
      const entry = ARTIFACTS_CACHE[task.id];
      const expectedSig = _artifactsCacheSig(task);
      if (!entry || (!entry.loading && entry.sig !== expectedSig)) {
        setTimeout(() => loadTaskArtifacts(task.id, false), 0);
      }
      if (!entry || (entry.loading && !entry.data)) {
        return `<div style="padding:28px 0; text-align:center; color:var(--text-2); font-size:13px;">${esc(t('artLoading'))}</div>`;
      }
      if (entry.error && !entry.data) {
        return `<div class="notice notice-err"><span>${esc(entry.error)}</span><button class="btn btn-sec btn-sm" onclick="loadTaskArtifacts('${esc(task.id)}', true)">${esc(t('artRefresh'))}</button></div>`;
      }
      const data = entry.data || {};
      const figs = data.figures || [];
      const tbls = data.tables || [];
      const manifests = data.manifests || [];
      const ledgers = data.attempts_ledger || [];
      const signoff = data.research_signoff || task.research_signoff;

      // Plotting backends summary pill
      let backendPills = '';
      if (PLOT_BACKENDS) {
        const py = PLOT_BACKENDS.python || {};
        const r = PLOT_BACKENDS.r || {};
        backendPills = `
          <span class="tag ${py.available ? 'tag-ok' : ''}">Python matplotlib ${esc(py.packages?.matplotlib || (py.available ? 'ok' : 'N/A'))}</span>
          <span class="tag ${r.available ? 'tag-ok' : ''}">R ggplot2 ${esc(r.packages?.ggplot2 || (r.available ? 'ok' : 'N/A'))}</span>
        `;
      }

      // Research Signoff Strip
      let signoffHtml = '';
      if (signoff) {
        const isPass = signoff.status === 'passed';
        const isFail = signoff.status === 'failed' || signoff.status === 'error';
        const cls = isPass ? 'notice-ok' : (isFail ? 'notice-err' : 'notice-warn');
        const headline = isPass ? t('artSignoffPass') : (isFail ? t('artSignoffFail') : t('artSignoffPending'));
        const blocks = (signoff.blocking || []).map(b => `<li class="u-wrap" style="color:var(--err);">${esc(b)}</li>`).join('');
        const obs = (signoff.observations || []).map(o => `<li class="u-wrap" style="color:var(--text-2);">${esc(o)}</li>`).join('');
        signoffHtml = `
          <div class="notice ${cls}" style="display:block; margin-bottom:16px;">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
              <strong style="display:inline-flex; align-items:center; gap:6px;">${svgIcon('shield', 14)} ${esc(headline)}</strong>
              <span class="tag">${esc(signoff.status || 'pending')}</span>
            </div>
            ${blocks ? `<ul style="margin:6px 0 0 18px; font-size:12px;">${blocks}</ul>` : ''}
            ${obs ? `<ul style="margin:4px 0 0 18px; font-size:11.5px;">${obs}</ul>` : ''}
          </div>
        `;
      }

      const truncNotice = data.scan_truncated ? `
        <div class="notice notice-warn" style="margin-bottom:12px;">
          <span>${LANG === 'en' ? 'Artifact scan capped at depth 3 (some deeply nested files were skipped).' : '产物目录扫描已限定在 3 层子目录内（过深嵌套文件已跳过以防卡顿）。'}</span>
        </div>
      ` : '';

      // Manifest quick QA pills
      const mfBar = manifests.length ? `
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
          ${manifests.map(m => {
            const stTag = m.qa_report
              ? (m.qa_report.status === 'passed' ? ' (PASS)' : (m.qa_report.status === 'not_verifiable' ? ' (UNBOUND)' : ' (FAIL)'))
              : '';
            return `
              <button class="btn btn-sec btn-sm" style="max-width:100%;" data-tid="${esc(task.id)}" data-mf="${esc(m.rel_path)}" onclick="verifyTaskManifest(this.getAttribute('data-tid'), this.getAttribute('data-mf'))">
                ${svgIcon('shield', 12)} <span class="tx">${esc(t('artVerifyManifest'))}: ${esc(m.figure_id || m.rel_path)}${stTag}</span>
              </button>
            `;
          }).join('')}
        </div>
      ` : '';

      // Proofing Filter Bar + Compare View or Gallery Grid
      const proofBarHtml = figs.length ? renderProofFilterBar(false) : '';
      let figsSectionHtml = '';
      if (!figs.length) {
        figsSectionHtml = `<div class="empty-state" style="padding:26px 18px; margin-bottom:16px; font-size:12.5px;">${esc(t('artNoFigures'))}</div>`;
      } else if (FIG_COMPARE.active && figs.length >= 2) {
        const leftFig = figs.find(f => f.id === FIG_COMPARE.leftId) || figs[0];
        const rightFig = figs.find(f => f.id === FIG_COMPARE.rightId) || figs[1];
        const optsFor = (selId) => figs.map(f => `<option value="${esc(f.id)}" ${f.id === selId ? 'selected' : ''}>${esc(f.title || f.stem)}</option>`).join('');
        figsSectionHtml = `
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
            <span class="ctrl-inline-field">
              <span style="font-size:12px; color:var(--text-2); white-space:nowrap;">Before / Left:</span>
              <select style="width:auto; max-width:min(240px, 100%); font-size:12px;" onchange="FIG_COMPARE.leftId=this.value; renderAll(STATE);">${optsFor(leftFig.id)}</select>
            </span>
            <span class="ctrl-inline-field">
              <span style="font-size:12px; color:var(--text-2); white-space:nowrap;">After / Right:</span>
              <select style="width:auto; max-width:min(240px, 100%); font-size:12px;" onchange="FIG_COMPARE.rightId=this.value; renderAll(STATE);">${optsFor(rightFig.id)}</select>
            </span>
          </div>
          <div class="fig-compare-grid">
            ${renderSingleFigureSurface(task.id, leftFig, true)}
            ${renderSingleFigureSurface(task.id, rightFig, true)}
          </div>
        `;
      } else {
        figsSectionHtml = `<div class="fig-grid">${figs.map(f => renderSingleFigureSurface(task.id, f, false)).join('')}</div>`;
      }

      // Source Tables section
      const tblsHtml = tbls.length ? `
        <div style="margin-bottom:16px;">
          <div style="font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:8px;">${esc(t('artTablesTitle'))} (${tbls.length})</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${tbls.map(tb => `
              <button class="btn btn-sec btn-sm" style="max-width:100%;" data-path="${esc(tb.rel_path)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)" title="${esc(tb.rel_path)}">
                ${svgIcon('file', 12)} <span class="tx">${esc(tb.rel_path)}</span>
                <span style="opacity:0.65; font-size:11px; flex-shrink:0;">${Math.max(1, Math.round((tb.size || 0) / 1024))} KB</span>
              </button>
            `).join('')}
          </div>
        </div>
      ` : '';

      // Command Execution Ledger & Changed Files
      const allCmds = [];
      const allChgs = [];
      let anyEditAfter = false;
      ledgers.forEach(lg => {
        if (lg.edit_after_check) anyEditAfter = true;
        (lg.command_logs || []).forEach(c => allCmds.push({ ...c, step_index: lg.step_index, member_name: lg.member_name }));
        (lg.changed_files || []).forEach(cf => allChgs.push({ ...cf, step_index: lg.step_index, member_name: lg.member_name }));
      });
      const cmdRowsHtml = allCmds.length ? allCmds.map(c => {
        const okExit = c.exit_code === 0 || c.exit_code === null || c.exit_code === undefined;
        return `
          <div class="cmd-log-row">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span class="cmd-code-line">${svgIcon('terminal', 12)} ${esc(c.command || '-')}</span>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span style="font-size:11px; color:var(--text-3);">#${esc(c.step_index)} ${esc(c.member_name)}</span>
                <span class="tag ${okExit ? 'tag-ok' : 'tag-err'}">exit ${esc(c.exit_code ?? '-')}</span>
              </div>
            </div>
            ${c.output_excerpt ? `<pre style="margin:4px 0 0; font-size:11px; max-height:110px; overflow:auto;">${esc(c.output_excerpt)}</pre>` : ''}
          </div>
        `;
      }).join('') : `<div style="padding:14px; font-size:12px; color:var(--text-3); text-align:center;">${esc(t('artNoCmds'))}</div>`;

      const chgPillsHtml = allChgs.length ? `
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
          ${allChgs.slice(0, 24).map(cf => `
            <button class="btn btn-ghost btn-sm" style="min-height:24px; font-size:11.5px; max-width:100%;" data-path="${esc(cf.path)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)" title="${esc(cf.path)}">
              <span class="tag" style="min-height:17px; padding:1px 5px; font-size:10px;">${esc(cf.kind || 'edit')}</span>
              <span class="tx">${esc(cf.path)}</span>
            </button>
          `).join('')}

        const lastAtt = (s.attempts || [])[s.attempts.length - 1];

              ${s.status !== 'running' ? `<button class="btn btn-sec btn-sm" onclick="openReassignModal('${esc(task.id)}', ${s.step_index}, '${esc(s.member_id)}')">${esc(t('reassign'))}</button>` : ''}
              ${['failed', 'aborted', 'blocked'].includes(s.status) ? `<button class="btn btn-sec btn-sm" onclick="retrySingleStep('${esc(task.id)}', ${s.step_index})">${esc(t('retryClean'))}</button>` : ''}

    function setInterjectTarget(mid) {
      const sel = document.getElementById('interject-target');
      if (sel) sel.value = mid || '';
      renderQuickTargetChips();
      document.getElementById('interject-input')?.focus();
    }

    function renderQuickTargetChips() {
      const bar = document.getElementById('quick-target-bar');
      const sel = document.getElementById('interject-target');
      if (!bar || !sel || !STATE) return;
      const cur = sel.value || '';
      const ms = STATE.members || {};
      const focused = (STATE.tasks || []).find(x => x.id === FOCUSED_TASK_ID);
      const seated = (focused?.mode_meta?.participants || [...new Set((focused?.steps || []).map(s => s.member_id))])
        .filter(id => ms[id] && ['codex', 'antigravity'].includes(ms[id].client));
      const allIds = getRunnableIds(STATE);
      const chipIds = [...new Set([...seated, ...(cur && allIds.includes(cur) ? [cur] : [])])].slice(0, 12);

      bar.innerHTML = `
        <button class="qt-chip ${!cur ? 'active' : ''}" onclick="setInterjectTarget('')">@${esc(t('quickAll'))}</button>
        ${chipIds.map(id => `
          <button class="qt-chip ${cur === id ? 'active' : ''}" onclick="setInterjectTarget('${esc(id)}')" title="${esc(ms[id].specialty || ms[id].model)}">
            ${avatarHtml(id, ms[id], { sm: true })}<span class="tx">${esc(ms[id].name || id)}</span>
          </button>
        `).join('')}
        <button class="qt-chip" onclick="openCmdK()">${svgIcon('search', 11)}<span>${esc(t('quickMore'))}</span></button>
      `;
    }

    function hideMentionPopup() {
      MENTION_OPEN = false;
      document.getElementById('mention-popup')?.classList.add('hidden');
    }

    function onInterjectInput(inp) {
      if (!STATE) return;
      const val = inp.value || '';
      const pos = inp.selectionStart ?? val.length;
      const before = val.slice(0, pos);
      const m = before.match(/(?:^|\s)@([^\s@]{0,24})$/);
      if (!m) { hideMentionPopup(); return; }
      const q = m[1].toLowerCase();
      const ms = STATE.members || {};
      MENTION_LIST = getRunnableIds(STATE).filter(id => {
        const mem = ms[id];
        return !q || id.toLowerCase().includes(q) || (mem.name || '').toLowerCase().includes(q) || (mem.specialty || '').toLowerCase().includes(q) || (mem.model || '').toLowerCase().includes(q);
      });
      if (!MENTION_LIST.length) { hideMentionPopup(); return; }
      MENTION_OPEN = true;
      MENTION_INDEX = 0;
      renderMentionPopup();
    }

    function renderMentionPopup() {
      const pop = document.getElementById('mention-popup');
      if (!pop || !MENTION_OPEN || !STATE) return;
      const ms = STATE.members || {};
      pop.innerHTML = MENTION_LIST.map((id, idx) => {
        const m = ms[id];
        return `
          <div class="cmdk-item ${idx === MENTION_INDEX ? 'active' : ''}" onmousedown="event.preventDefault(); pickMention('${esc(id)}')">
            <div style="display:flex; align-items:center; gap:8px; min-width:0;">
              ${avatarHtml(id, m, { sm: true })}
              <div style="min-width:0;">
                <div style="font-weight:600; font-size:12.5px;">${esc(m.name || id)}</div>
                <div class="cmdk-item-sub">${esc(m.specialty || m.model)}</div>
              </div>
            </div>
            <span class="tag">${m.client === 'antigravity' ? 'AGY' : 'Codex'}</span>
          </div>
        `;
      }).join('');
      pop.classList.remove('hidden');
    }

    function pickMention(mid) {
      const inp = document.getElementById('interject-input');
      const m = STATE?.members?.[mid];
      if (inp && m) {
        const val = inp.value || '';
        const pos = inp.selectionStart ?? val.length;
        const before = val.slice(0, pos).replace(/(^|\s)@([^\s@]{0,24})$/, `$1@${m.name} `);
        inp.value = before + val.slice(pos);
        inp.focus();
      }
      setInterjectTarget(mid);
      hideMentionPopup();
    }

    function onInterjectKeydown(ev) {
      if (MENTION_OPEN) {
        if (ev.key === 'ArrowDown') { ev.preventDefault(); MENTION_INDEX = (MENTION_INDEX + 1) % MENTION_LIST.length; renderMentionPopup(); return; }
        if (ev.key === 'ArrowUp') { ev.preventDefault(); MENTION_INDEX = (MENTION_INDEX - 1 + MENTION_LIST.length) % MENTION_LIST.length; renderMentionPopup(); return; }
        if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); if (MENTION_LIST[MENTION_INDEX]) pickMention(MENTION_LIST[MENTION_INDEX]); return; }
        if (ev.key === 'Escape') { ev.preventDefault(); hideMentionPopup(); return; }
      }
      if (ev.key === 'Enter') { ev.preventDefault(); sendInterjection(); }
    }

    function syncInterjectBar(st, focused) {
      const dock = document.getElementById('active-stage-interject');
      if (!focused) {
        dock.classList.add('hidden');
        hideMentionPopup();
        FOCUSED_TASK_ID = null;
        return;
      }
      dock.classList.remove('hidden');
      const sel = document.getElementById('interject-target');
      const ids = getRunnableIds(st);
      const sig = focused.id + '|' + LANG + '|' + ids.map(id => `${id}:${st.members[id].name}`).join(',');
      if (sel.getAttribute('data-sig') !== sig) {
        const prev = sel.value;
        sel.innerHTML = `<option value="">${esc(t('interjectAll'))}</option>` + ids.map(id => {
          const m = st.members[id];
          return `<option value="${esc(id)}">@${esc(m.name || id)}</option>`;
        }).join('');
        if (prev && ids.includes(prev)) sel.value = prev;
        sel.setAttribute('data-sig', sig);
      }
      FOCUSED_TASK_ID = focused.id;
      renderQuickTargetChips();
    }

    function renderActiveStage(st, projUnarchived, forceFull = false) {
      const pillsEl = document.getElementById('stage-pills');
      const stageEl = document.getElementById('active-stage-dynamic');

      if (!projUnarchived.length) {
        LAST_STAGE_STRUCT_SIG = '';
        pillsEl.classList.add('hidden');
        syncInterjectBar(st, null);
        syncQuestionPopupModal(st, null);
        stageEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:4px;">${esc(t('emptyStageTitle'))}</div>
            <div style="font-size:12.5px;">${esc(t('emptyStageSub'))}</div>
          </div>
        `;
        return;
      }

      const focused = projUnarchived.find(x => x.id === st.active_task_id) || projUnarchived[projUnarchived.length - 1];
      syncInterjectBar(st, focused);
      syncQuestionPopupModal(st, focused);

      if (projUnarchived.length > 1) {
        pillsEl.classList.remove('hidden');
        pillsEl.innerHTML = projUnarchived.slice().reverse().map(tk => {
          const [, dotCls] = statusMeta(tk.status);
          return `
            <button class="task-pill ${tk.id === focused.id ? 'active' : ''}" onclick="focusTask('${esc(tk.id)}')" title="${esc(tk.title)}">
              <span class="dot ${dotCls}"></span>
              <span class="tx">${esc(tk.title)}</span>
            </button>
          `;
        }).join('');
      } else {
        pillsEl.classList.add('hidden');
      }

      const steps = focused.steps || [];
      const curStep = steps.find(s => s.status === 'running') || steps[focused.current_step_index ?? (steps.length - 1)] || steps[steps.length - 1];
      const lastAtt = curStep?.attempts?.[curStep.attempts.length - 1];
      let mainOutput = focused.summary || (focused.status === 'running' && lastAtt?.partial_text) || curStep?.latest_result_text || lastAtt?.result_text || lastAtt?.partial_text || '';
      window._LATEST_MAIN_OUTPUT = mainOutput;

      const curTab = activeTabFor(focused);
      const chatMsgs = focused.chat_room || [];
      const lastChatId = chatMsgs.length ? chatMsgs[chatMsgs.length - 1].id : '';
      const ctxSt = focused.context_stats || {};
      const ctxSnapsCnt = (focused.round_snapshots || []).length;
      const ctxRoCnt = Number(ctxSt.rollover_count || 0);
      const ctxDeltaCnt = Number(ctxSt.delta_turns || 0);
      const ctxInTok = Number(ctxSt.total_input_tokens || 0);
      const ctxPeakTok = Number(ctxSt.max_peak_context_tokens || 0);
      const ctxCachePct = Math.round(Number(ctxSt.cache_hit_ratio || 0) * 100);
      const fmtShortTok = (n) => n >= 1000000 ? `${(n / 1000000).toFixed(2)}M` : (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : `${n}`);
      const ctxBriefParts = [];
      if (ctxPeakTok > 0) ctxBriefParts.push(`${LANG === 'en' ? 'Peak' : '峰值'} ${fmtShortTok(ctxPeakTok)}`);
      if (ctxInTok > 0) ctxBriefParts.push(`${LANG === 'en' ? 'Bill' : '累计'} ${fmtShortTok(ctxInTok)}`);
      if (ctxCachePct > 0) ctxBriefParts.push(`KV ${ctxCachePct}%`);
      if (ctxDeltaCnt > 0) ctxBriefParts.push(`Δ${ctxDeltaCnt}`);
      if (ctxSnapsCnt > 0) ctxBriefParts.push(`${ctxSnapsCnt} snap`);
      if (ctxRoCnt > 0) ctxBriefParts.push(`${ctxRoCnt} ro`);
      const ctxPillLabel = ctxBriefParts.length ? `${t('ctxPillLbl')} · ${ctxBriefParts.join(' · ')}` : `${t('ctxPillLbl')} · v5.7`;

      // Granular in-place live patching: while streaming events/partial text arrive, NEVER destroy completed chat/doc DOM!
      const stageStructSig = [
        focused.id,
        focused.status,
        curTab,
        LANG,
        FIG_PROOF_FILTER,
        (focused.summary || '').length,
        chatMsgs.length,
        lastChatId,
        focused.blocking_reason || '',
        JSON.stringify(focused.pending_questions || null),
        (focused.reviews || []).length,
        focused.latest_fact_check?.ts || 0,
        focused.borda_scoreboard?.ballots_count || 0,
        focused.research_signoff?.status || '',
        ctxSnapsCnt,
        steps.map(s => `${s.step_index}:${s.status}:${s.member_id}:${(s.attempts || []).length}`).join(','),
      ].join('|');

      const canPatchInPlace = (
        !forceFull
        && stageStructSig === LAST_STAGE_STRUCT_SIG
        && (curTab === 'discussion' || (curTab === 'deliverable' && Boolean(focused.summary)))
        && Boolean(document.getElementById('live-roster-slot'))
      );
      if (canPatchInPlace) {
        const rosterSlot = document.getElementById('live-roster-slot');
        if (rosterSlot) rosterSlot.innerHTML = renderLiveRosterStrip(st, focused);
        const pillTx = document.querySelector('#btn-ctx-pill .tx');
        if (pillTx && pillTx.textContent !== ctxPillLabel) pillTx.textContent = ctxPillLabel;
        if (curTab === 'discussion') {
          const liveEntries = document.getElementById('live-running-entries');
          if (liveEntries) liveEntries.innerHTML = renderRunningDiscussionEntries(st, focused);
        }
        return;
      }
      LAST_STAGE_STRUCT_SIG = stageStructSig;

      const qCardHtml = renderQuestionCardHtml(focused);

      // Troubled step rescue notice

        rescueHtml = `
          <div class="notice notice-warn">

              <div style="font-weight:600;">${esc(t('rescueTitle', { n: troubledStep.step_index, t: troubledStep.title }))}</div>

    function renderHistoryView() {
      if (!STATE) return;
      document.getElementById('hist-scope-cur').classList.toggle('active', HISTORY_SCOPE === 'current');
      document.getElementById('hist-scope-all').classList.toggle('active', HISTORY_SCOPE === 'all');

        if (HISTORY_SCOPE === 'current' && normPath(tk.project_path) !== curNorm) return false;

        return true;
      });

    // ==================== ACTIONS ====================
    async function submitTask() {
      const goal = document.getElementById('cmp-goal').value.trim();
      if (!goal) { toast(t('needGoal'), true); return; }

      const mode = CMP.mode;
      const payload = {
        title: document.getElementById('cmp-title').value.trim(),
        goal,
        dispatch_mode: mode,
        execution_mode: mode,
        workspace_scope: document.getElementById('cmp-subscope').value.trim() || '.',
        sandbox: document.getElementById('cmp-sandbox').value,
        require_manual_ruling: document.getElementById('cmp-manual-rule').checked,
        reuse_member_session: document.getElementById('cmp-reuse-sess').checked,
        squad_preset: CMP.squadPreset || ''
      };
      if (CMP.playbooks && CMP.playbooks.length) {
        payload.openscience_playbooks = CMP.playbooks.slice();
      }
      if (CMP.figContract && CMP.figContract.enabled) {
        const preset = JOURNAL_WIDTH_PRESETS.find(p => p.id === CMP.figContract.journalPreset) || JOURNAL_WIDTH_PRESETS[0];
        const targetWidthMm = preset.id === 'custom'
          ? Math.max(30, Math.min(300, Number(CMP.figContract.customWidthMm) || 89))
          : preset.width_mm;
        payload.research_spec = {
          mode: 'figure_contract',
          figure_contract: {
            backend: CMP.figContract.backend || 'python',
            journal_preset: preset.id,
            journal: preset.journal,
            target_width_mm: targetWidthMm,
            min_font_pt: Math.max(4, Math.min(18, Number(CMP.figContract.minFontPt) || 6.0)),
            palette: CMP.figContract.palette || 'Okabe-Ito',
            core_claim: (CMP.figContract.coreClaim || '').trim(),
            required_formats: ['svg', 'pdf', 'png', 'tiff'],
            auto_visual_qa: CMP.figContract.autoVisualQa !== false,
            export_drawio: Boolean(CMP.figContract.exportDrawio),
            max_visual_repairs: 2
          }
        };
      }
      if (mode === 'roundtable') {
        if (CMP.rtParticipants.length < 2) { toast(t('need2Rt'), true); return; }
        payload.participants = CMP.rtParticipants.slice();
        payload.host_member_id = CMP.rtHost;
        payload.discussion_rounds = CMP.rtRounds;
        payload.enable_host_opening = Boolean(CMP.rtHostOpening);
        payload.anonymous_peer_review = Boolean(CMP.rtAnonymousPeer);
        if (payload.sandbox !== 'read-only') {
          payload.allow_member_writes = Boolean(CMP.rtAllowWrites ?? STATE?.settings?.roundtable_allow_member_writes);
          const seatMap = {};
          for (const pid of CMP.rtParticipants) {
            if (CMP.rtSeatSandboxes && CMP.rtSeatSandboxes[pid]) {
              seatMap[pid] = CMP.rtSeatSandboxes[pid];
            }
          }
          if (Object.keys(seatMap).length > 0) {
            payload.seat_sandboxes = seatMap;
          }
        }
      } else if (mode === 'chief_dispatch') {
        payload.chief_member_id = CMP.chiefId;
        if (CMP.chiefMaxMembers) payload.chief_max_members = CMP.chiefMaxMembers;
      } else if (mode === 'custom_dag') {
        payload.stages = CMP.dagStages;
      } else {
        payload.target_member_id = CMP.soloId;
      }

      try {
        const r = await api('POST', '/api/tasks', payload);
        document.getElementById('cmp-goal').value = '';
        document.getElementById('cmp-title').value = '';
        COMPOSER_OPEN_OVERRIDE = false;
        toast(t('startedTask', { title: r.task.title }));
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function sendInterjection() {
      if (!FOCUSED_TASK_ID) return;
      const inp = document.getElementById('interject-input');
      const content = inp.value.trim();
      if (!content) return;
      const target = document.getElementById('interject-target').value || null;
      const wake = document.getElementById('interject-wake').checked;
      try {
        inp.value = '';
        await api('POST', '/api/tasks/interject', {
          task_id: FOCUSED_TASK_ID,
          content,
          target_member_id: target,
          trigger_reply: wake
        });
        MANUAL_STAGE_TABS[FOCUSED_TASK_ID] = 'discussion';
        toast(t('sentChat'));
        await refreshState(true);
      } catch (e) {
        inp.value = content;
        toast(t('toastFail', { err: e.message }), true);
      }
    }

    async function archiveSingleTask(tid) {

      const srcTag = cs.usage_source === 'cli_reported' ? 'CLI exact' : 'est';

          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">

          </div>
          <div class="u-wrap" style="font-size:11.5px; color:var(--text-2); margin-top:4px; font-family:ui-monospace,Consolas,monospace;">

          </div>
        </div>
      `).join('') : `<div style="font-size:12px; color:var(--text-3); padding:8px 0;">${esc(t('ctxNoSnapshots'))}</div>`;

      const sessHtml = sEntries.length ? sEntries.map(sm => {
        const hit = Math.round(Number(sm.cache_hit_ratio || 0) * 100);
        const pk = sm.last_peak_context_tokens || sm.last_input_tokens || 0;
        const callsN = sm.last_internal_api_calls || 1;
        return `

          </div>
        `;

      const maxPeakTok = Number(cs.max_peak_context_tokens || cs.total_input_tokens || 0);
      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">

        <div style="font-size:12px; color:var(--text-2); margin-bottom:12px;">${esc(t('ctxModalSub'))}</div>

            <div style="font-size:11px; color:var(--text-3);">${esc(t('ctxTotalTok'))} (${srcTag})</div>
            <div class="tabular" style="font-size:14px; font-weight:600; margin-top:2px;">${fmtTok(cs.total_input_tokens)} / ${fmtTok(maxPeakTok)}</div>
          </div>
          <div style="border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-subtle);">
            <div style="font-size:11px; color:var(--text-3);">${esc(t('ctxCacheHit'))}</div>
            <div class="tabular" style="font-size:14px; font-weight:600; margin-top:2px; color:${cachePct >= 30 ? 'var(--ok)' : 'var(--text)'};">${cachePct}%</div>

            <div style="font-size:11px; color:var(--text-3);">${esc(t('ctxMasked'))}</div>

            ${svgIcon('layers', 12)} ${esc(t('ctxCompactNow'))}
          </button>
        </div>
        <div style="margin-bottom:12px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-subtle);">
          <div style="font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px;">${svgIcon('search', 12)} ${esc(t('ctxMemSearchTitle'))}</div>
          <div style="display:flex; gap:6px; align-items:center;">
            <input id="ctx-fts-q" type="text" style="flex:1; min-width:0; height:28px; font-size:12px;" placeholder="${esc(t('ctxMemSearchPh'))}" onkeydown="if(event.key==='Enter'){event.preventDefault(); runMemorySearch();}">

        <div style="max-height:160px; overflow:auto; margin-bottom:10px;">${snapsHtml}</div>
        <div style="font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:4px;">${esc(t('ctxSessionsTitle'))} (${sEntries.length})</div>
        <div style="max-height:120px; overflow:auto; border:1px solid var(--border); border-radius:8px;">${sessHtml}</div>
      `, true);

    async function runMemorySearch() {
      const q = (document.getElementById('ctx-fts-q')?.value || '').trim();
      const box = document.getElementById('ctx-fts-results');
      if (!box) return;
      if (!q) { box.innerHTML = ''; return; }
      box.innerHTML = `<div style="font-size:11.5px; color:var(--text-3);">Searching FTS5…</div>`;
      try {
        const res = await api('GET', `/api/memory/search?q=${encodeURIComponent(q)}&limit=6`);
        const hits = res.hits || [];
        if (!hits.length) {
          box.innerHTML = `<div style="font-size:11.5px; color:var(--text-3);">${esc(t('ctxMemNoHits'))}</div>`;
          return;
        }
        box.innerHTML = hits.map(h => `
          <div style="padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); margin-bottom:5px; font-size:11.5px;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;">
              <strong class="u-wrap">${esc(h.title || h.doc_id)}</strong>
              <div style="display:flex; align-items:center; gap:4px;">
                <span class="tag">${esc(h.kind)}</span>
                ${h.blob_path ? `<button type="button" class="btn btn-ghost btn-sm" style="min-height:20px; padding:0 5px; font-size:10.5px;" data-path="${esc(h.blob_path)}" onclick="openAnswerLink(this.getAttribute('data-path'), true)">Open</button>` : ''}
              </div>
            </div>
            <div class="u-wrap" style="color:var(--text-2); margin-top:3px;">${esc(h.snippet || '')}</div>
          </div>
        `).join('');
      } catch (e) {
        box.innerHTML = `<div style="font-size:11.5px; color:var(--err);">${esc(e.message)}</div>`;
      }
    }

    async function openQuotaBackupModal(sourceMemberId, taskId = '', stepIndex = null) {
      const m = STATE?.members?.[sourceMemberId];
      if (!m) return;
      let reqSame = false;
      if (taskId && stepIndex !== null) {
        const tk = (STATE?.tasks || []).find(x => x.id === taskId);
        reqSame = Boolean(tk?.steps?.[stepIndex]?.requires_shell);
      }
      try {
        const data = await api('GET', `/api/members/backup_candidates?member_id=${encodeURIComponent(sourceMemberId)}&require_same_client=${reqSame ? 1 : 0}`);
        const cands = data.candidates || [];
        window._BACKUP_CTX = { sourceMemberId, taskId: taskId || '', stepIndex, cands, selectedIdx: 0 };
        const sameCands = cands.map((c, i) => ({ ...c, _i: i })).filter(c => c.same_engine);
        const crossCands = cands.map((c, i) => ({ ...c, _i: i })).filter(c => !c.same_engine);
        const roleName = STATE?.roles?.[m.role]?.name || m.role;

        const renderCandChips = (arr) => arr.map(c => `
          <div class="seat-pill ${c._i === 0 ? 'selected' : ''}" data-bk-idx="${c._i}" onclick="selectBackupCand(${c._i})">
            <span class="tag" style="height:18px; padding:0 5px; font-size:10px;">${c.client === 'antigravity' ? 'AGY' : 'Codex'}</span>
            <span style="font-weight:600;">${esc(c.display_name || c.model)}</span>
            <span style="font-size:10.5px; color:var(--text-3);">${esc(c.reasoning_effort)}</span>
          </div>
        `).join('');

        const hasStep = Boolean(taskId && stepIndex !== null);
        const showRtJoin = !hasStep && CMP.mode === 'roundtable';
        openModal(`
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:15px; display:inline-flex; align-items:center; gap:7px;">${svgIcon('userPlus', 16)} ${esc(t('backupModalTitle'))}</strong>
            <button class="btn btn-ghost btn-icon" onclick="closeModal()">${svgIcon('x', 15)}</button>
          </div>
          <div style="font-size:12px; color:var(--text-2); margin-bottom:12px;">${esc(t('backupModalDesc'))}</div>
          <div style="background:var(--surface-subtle); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12px;">
            <div style="font-weight:600; margin-bottom:4px;">${esc(t('backupInherited'))}</div>
            <div><strong>${esc(m.name || sourceMemberId)}</strong> · <code>${esc(m.client)}/${esc(m.model)}</code></div>
            <div style="color:var(--text-2); margin-top:3px;">${esc(roleName)} · ${esc(m.specialty || '-')} · Strict Grounding</div>
          </div>
          <div style="margin-bottom:12px;">
            <label>${esc(t('backupPickModel'))}</label>
            ${sameCands.length ? `
              <div style="font-size:11px; color:var(--text-3); margin:6px 0 4px;">${esc(t('backupSameEngine'))}</div>
              <div class="seat-picks" style="margin-bottom:8px;">${renderCandChips(sameCands)}</div>
            ` : ''}
            ${crossCands.length ? `
              <div style="font-size:11px; color:var(--text-3); margin:6px 0 4px;">${esc(t('backupCrossEngine'))}</div>
              <div class="seat-picks">${renderCandChips(crossCands)}</div>

            ${!cands.length ? `<div class="notice notice-warn"><span>No alternative flagship model available</span></div>` : ''}
          </div>
          ${hasStep ? `
            <label style="display:inline-flex; align-items:center; gap:6px; margin-bottom:10px; cursor:pointer; color:var(--text);">
              <input type="checkbox" id="bk-auto-reassign" checked style="width:auto;">
              <span>${esc(t('backupAutoReassign'))}</span>
            </label>
          ` : ''}
          ${showRtJoin ? `
            <label style="display:inline-flex; align-items:center; gap:6px; margin-bottom:10px; cursor:pointer; color:var(--text);">
              <input type="checkbox" id="bk-join-rt" checked style="width:auto;">
              <span>${esc(t('backupJoinRt'))}</span>

          </div>
        `, true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }

    function selectBackupCand(idx) {
      if (!window._BACKUP_CTX) return;
      window._BACKUP_CTX.selectedIdx = idx;
      document.querySelectorAll('[data-bk-idx]').forEach(el => {
        el.classList.toggle('selected', parseInt(el.getAttribute('data-bk-idx'), 10) === idx);

    async function confirmSpawnQuotaBackup() {
      const ctx = window._BACKUP_CTX;
      if (!ctx || !ctx.cands?.length) return;
      const chosen = ctx.cands[ctx.selectedIdx] || ctx.cands[0];
      const autoReassign = Boolean(document.getElementById('bk-auto-reassign')?.checked);
      const joinRt = Boolean(document.getElementById('bk-join-rt')?.checked);
      try {
        const res = await api('POST', '/api/members/spawn_backup', {
          source_member_id: ctx.sourceMemberId,
          client: chosen.client,
          model: chosen.model,
          reasoning_effort: chosen.reasoning_effort,
          task_id: ctx.taskId || null,
          step_index: ctx.stepIndex,
          auto_reassign: autoReassign,
          bind_as_default: true
        });
        closeModal();
        const bkId = res.member?.id;
        if (joinRt && bkId && !CMP.rtParticipants.includes(bkId)) {
          CMP.rtParticipants.push(bkId);
        }
        toast(t(res.reused ? 'backupReused' : 'backupCreated', { name: res.member?.name || bkId }));
        await refreshState(true);
        if (joinRt) renderComposerStudio();
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    // ==================== ANYTIME / MID-PROCESS SEAT HOT-SWAP & QUOTA BACKUP BINDING ====================
    async function openSeatSwapModal(taskId, oldMemberId) {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      const oldM = STATE?.members?.[oldMemberId];
      if (!task || !oldM) return;

      const steps = task.steps || [];
      const isRunningNow = steps.some(s => s.member_id === oldMemberId && s.status === 'running');
      const hasUnfinished = steps.some(s => s.member_id === oldMemberId && s.status !== 'succeeded');
      const reqShell = steps.some(s => s.member_id === oldMemberId && s.status !== 'succeeded' && s.requires_shell);

      let cands = [];
      try {
        const cRes = await api('GET', `/api/members/backup_candidates?member_id=${encodeURIComponent(oldMemberId)}&require_same_client=${reqShell ? 1 : 0}`);
        cands = cRes.candidates || [];
      } catch (e) { cands = []; }

      const ms = STATE.members || {};
      const existingOthers = getRunnableIds(STATE).filter(id => id !== oldMemberId && (!reqShell || ms[id].client === 'codex'));
      const qb = oldM.quota_backup || null;

      window._SEAT_SWAP = {
        taskId,
        oldMemberId,
        isRunningNow,
        hasUnfinished,
        reqShell,
        tab: existingOthers.length ? 'existing' : 'same_role',
        selectedMemberId: (qb?.mode === 'member' && existingOthers.includes(qb.member_id)) ? qb.member_id : (existingOthers[0] || ''),
        cands,
        selectedCandIdx: Math.max(0, cands.findIndex(c => qb && c.client === qb.client && c.model === qb.model)),
        abortRunning: true,
        triggerFresh: !hasUnfinished
      };
      renderSeatSwapModal();
    }

    function renderSeatSwapModal() {
      const ctx = window._SEAT_SWAP;
      if (!ctx || !STATE) return;
      const ms = STATE.members || {};
      const oldM = ms[ctx.oldMemberId] || { name: ctx.oldMemberId };
      const qb = oldM.quota_backup;
      const existingOthers = getRunnableIds(STATE).filter(id => id !== ctx.oldMemberId && (!ctx.reqShell || ms[id].client === 'codex'));

      const existingHtml = existingOthers.map(id => {
        const m = ms[id];
        const sel = ctx.tab === 'existing' && ctx.selectedMemberId === id;
        const isBound = qb?.mode === 'member' && qb.member_id === id;
        return `
          <div class="seat-pill ${sel ? 'selected' : ''}" onclick="selectSeatSwapExisting('${esc(id)}')" title="${esc(m.specialty || m.model)}">
            ${avatarHtml(id, m, { sm: true })}
            <span style="font-weight:${sel ? '600' : '500'};">${esc(m.name || id)}</span>
            <span style="font-size:10.5px; color:var(--text-3);">${esc(m.model)}</span>
            ${isBound ? `<span class="seat-bk-hint">${esc(t('boundBackupLbl'))}</span>` : ''}
          </div>
        `;
      }).join('');

      const sameCands = ctx.cands.map((c, i) => ({ ...c, _i: i })).filter(c => c.same_engine);
      const crossCands = ctx.cands.map((c, i) => ({ ...c, _i: i })).filter(c => !c.same_engine);
      const renderModelPills = (arr) => arr.map(c => {
        const sel = ctx.tab === 'same_role' && ctx.selectedCandIdx === c._i;
        const isBound = qb && qb.client === c.client && qb.model === c.model;
        return `
          <div class="seat-pill ${sel ? 'selected' : ''}" onclick="selectSeatSwapModel(${c._i})">
            <span class="tag" style="height:18px; padding:0 5px; font-size:10px;">${c.client === 'antigravity' ? 'AGY' : 'Codex'}</span>
            <span style="font-weight:${sel ? '600' : '500'};">${esc(c.display_name || c.model)}</span>
            <span style="font-size:10.5px; color:var(--text-3);">${esc(c.reasoning_effort)}</span>
            ${isBound ? `<span class="seat-bk-hint">${esc(t('boundBackupLbl'))}</span>` : ''}
          </div>
        `;
      }).join('');

      const timingHtml = ctx.isRunningNow ? `
        <div style="background:var(--warn-soft); border:1px solid var(--warn-border); border-radius:8px; padding:9px 12px; margin-bottom:12px; font-size:12px;">
          <div style="font-weight:600; margin-bottom:6px;">${LANG === 'en' ? 'Specialist is actively running right now:' : '该专家正在进程中发言，请选择切换时机：'}</div>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-bottom:4px; color:var(--text);">
            <input type="radio" name="swap-timing" style="width:auto;" ${ctx.abortRunning ? 'checked' : ''} onchange="window._SEAT_SWAP.abortRunning=true;">
            <span>${esc(t('swapAbortNow'))}</span>
          </label>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text);">
            <input type="radio" name="swap-timing" style="width:auto;" ${!ctx.abortRunning ? 'checked' : ''} onchange="window._SEAT_SWAP.abortRunning=false;">
            <span>${esc(t('swapNextRound'))}</span>
          </label>
        </div>
      ` : (!ctx.hasUnfinished ? `

      if (!window._SEAT_SWAP) return;
      window._SEAT_SWAP.tab = 'existing';

      renderSeatSwapModal();

    function selectSeatSwapModel(idx) {
      if (!window._SEAT_SWAP) return;
      window._SEAT_SWAP.tab = 'same_role';
      window._SEAT_SWAP.selectedCandIdx = idx;
      renderSeatSwapModal();

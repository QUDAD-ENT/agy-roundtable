<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY Roundtable · 圆桌会议</title>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0d0f14;
      --surface: #14171f;
      --surface-2: #1a1e29;
      --surface-3: #222736;
      --surface-subtle: #11141b;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text: #eceef2;
      --text-2: #9ba3b4;
      --text-3: #6c7486;
      --accent: #5e8bff;
      --accent-hover: #749bff;
      --accent-fg: #ffffff;
      --accent-soft: rgba(94, 139, 255, 0.12);
      --accent-border: rgba(94, 139, 255, 0.34);
      --ok: #3fb980;
      --ok-soft: rgba(63, 185, 128, 0.11);
      --ok-border: rgba(63, 185, 128, 0.3);
      --warn: #d9a441;
      --warn-soft: rgba(217, 164, 65, 0.12);
      --warn-border: rgba(217, 164, 65, 0.34);
      --err: #e06c75;
      --err-soft: rgba(224, 108, 117, 0.12);
      --err-border: rgba(224, 108, 117, 0.34);
      --code-bg: rgba(255, 255, 255, 0.06);
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.45);
      --backdrop: rgba(6, 8, 12, 0.72);
      --scroll-track: #0d0f14;
      --scroll-thumb: #293040;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-2: #f1f1ee;
      --surface-3: #e7e7e2;
      --surface-subtle: #fafaf8;
      --border: rgba(24, 24, 27, 0.09);
      --border-strong: rgba(24, 24, 27, 0.18);
      --text: #18181b;
      --text-2: #52525b;
      --text-3: #83838e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-fg: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --accent-border: rgba(37, 99, 235, 0.28);
      --ok: #15803d;
      --ok-soft: rgba(21, 128, 61, 0.08);
      --ok-border: rgba(21, 128, 61, 0.24);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, 0.08);
      --warn-border: rgba(180, 83, 9, 0.26);
      --err: #b91c1c;
      --err-soft: rgba(185, 28, 28, 0.08);
      --err-border: rgba(185, 28, 28, 0.26);
      --code-bg: rgba(24, 24, 27, 0.055);
      --shadow-pop: 0 12px 32px rgba(15, 23, 42, 0.12);
      --backdrop: rgba(15, 23, 42, 0.42);
      --scroll-track: #f7f7f5;
      --scroll-thumb: #d4d4d8;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }
    ::selection { background: var(--accent-soft); color: var(--text); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body {
      margin: 0;
      padding: 0 0 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon svg { display: block; }

    /* ==================== SINGLE-LINE STICKY TOP BAR ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .v-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    .proj-picker {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      max-width: 300px;
      flex: 1;
    }
    .proj-picker select {
      height: 30px;
      padding: 0 8px;
      font-size: 12.5px;
      font-weight: 500;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      text-overflow: ellipsis;
      min-width: 110px;
    }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-2);
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-btn.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
    }
    .nav-count {
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    @media (max-width: 960px) {
      .topbar { height: auto; padding: 8px 14px; flex-wrap: wrap; }
      .proj-picker { max-width: none; }
    }

    /* ==================== MAIN CONTAINER ==================== */
    .shell {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }
    @media (max-width: 680px) {
      .shell { padding: 14px 12px 0; }
    }

    /* ==================== BUTTONS, INPUTS, TAGS ==================== */
    .btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-sec {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-sec:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border-color: transparent;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger {
      background: var(--err-soft);
      color: var(--err);
      border-color: var(--err-border);
    }
    .btn-danger:hover { background: var(--err); color: #fff; }
    .btn-warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--warn-border);
    }
    .btn-warn:hover { border-color: var(--warn); }
    .btn-sm { height: 28px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
    .btn-icon { width: 30px; height: 30px; padding: 0; border-radius: 6px; }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--surface-subtle);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.14s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 78px; line-height: 1.55; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 700px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* Quiet semantic pills & status dots */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .tag-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .tag-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
    .tag-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-border); }
    .tag-err { background: var(--err-soft); color: var(--err); border-color: var(--err-border); }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-ok { background: var(--ok); }
    .dot-run { background: var(--accent); animation: calmPulse 1.8s ease-in-out infinite; }
    .dot-warn { background: var(--warn); }
    .dot-err { background: var(--err); }
    @keyframes calmPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Monochrome Initials Avatar */
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .avatar.av-human { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .avatar.av-speaking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .avatar-sm { width: 20px; height: 20px; font-size: 10px; }

    /* ==================== UTILITY POPOVER MENU ==================== */
    .popover {
      position: fixed;
      top: 52px;
      right: 18px;
      width: 316px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow-pop);
      padding: 10px;
      z-index: 80;
    }
    .pop-sec {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    .pop-sec:last-child { border-bottom: none; padding-bottom: 2px; }
    .pop-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .pop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text);
    }
    .pop-item-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }
    .pop-item-btn:hover { background: var(--surface-2); }

    /* ==================== SEGMENTED CONTROLS ==================== */
    .seg {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-wrap: wrap;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      height: 27px;
      padding: 0 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      font-weight: 600;
    }

    /* ==================== COMPOSER PANEL (FLAT, CLEAN, ON-DEMAND) ==================== */
    .composer-panel {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .composer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .composer-mode-hint {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
    }
    .setup-strip {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 13px;
      margin-bottom: 12px;
    }
    .setup-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .setup-controls select {
      width: auto;
      height: 29px;
      padding: 0 8px;
      font-size: 12px;
    }
    .seat-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .seat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 6px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--text-2);
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .seat-pill:hover { border-color: var(--border-strong); color: var(--text); }
    .seat-pill.selected {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--text);
    }
    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--accent-border);
    }
    .host-set-btn {
      font-size: 10.5px;
      color: var(--text-3);
      padding: 1px 5px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .host-set-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface);
    }
    .flow-note {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Pipeline builder inside composer */
    .stages-track {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .stage-col {
      min-width: 230px;
      max-width: 270px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .stage-arrow {
      display: flex;
      align-items: center;
      color: var(--text-3);
      font-size: 14px;
      user-select: none;
    }
    .ws-node {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px;
    }

    /* ==================== ACTIVE STAGE (CLEAN DOCUMENT-FIRST SURFACE) ==================== */
    .task-pills-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .task-pill {
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .task-pill.active {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text);
      font-weight: 600;
    }

    .stage-surface {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .stage-header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
    }
    .stage-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .stage-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--text);
    }
    .stage-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-2);
    }
    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 22px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
    }
    .stage-body {
      padding: 20px 22px;
    }

    /* Live participant bar (calm, clean, zero giant neon oval) */
    .live-roster-strip {
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }
    .live-phase-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }
    .seat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }
    .seat-card.speaking {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }
    .seat-snippet {
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text-2);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Quiet inline banners */
    .notice {
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .notice-ok { background: var(--ok-soft); border-color: var(--ok-border); }
    .notice-warn { background: var(--warn-soft); border-color: var(--warn-border); }
    .notice-err { background: var(--err-soft); border-color: var(--err-border); }

    /* ==================== READING-FIRST DELIVERABLE TYPOGRAPHY ==================== */
    .doc-reading {
      max-width: 780px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.72;
      color: var(--text);
    }
    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.4em 0;
    }
    .doc-actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .md-body { word-break: break-word; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.35;
      margin: 1.35em 0 0.5em;
    }
    .md-body h1:first-child, .md-body h2:first-child, .md-body h3:first-child { margin-top: 0; }
    .md-body h1 { font-size: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .md-body h2 { font-size: 15.5px; }
    .md-body h3 { font-size: 14px; }
    .md-body h4 { font-size: 13.5px; color: var(--text-2); }
    .md-body p { margin: 0 0 0.75em; }
    .md-body ul { margin: 0 0 0.85em 1.3em; padding: 0; }
    .md-body li { margin: 0.25em 0; }
    .md-body code {
      background: var(--code-bg);
      color: var(--text);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88em;
    }
    .md-body pre {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 11px 13px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.55;
      margin: 0.9em 0;
    }
    .md-body pre code { background: transparent; padding: 0; }
    .md-table-wrap { overflow-x: auto; margin: 1em 0; }
    .md-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    .md-table th, .md-table td {
      border: 1px solid var(--border);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
    }
    .md-table th {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }

    /* Clickable file/web links */
    .ans-link {
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid transparent;
      padding: 1px 6px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: baseline;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .ans-link:hover {
      border-color: var(--accent-border);
      text-decoration: none;
    }

    /* ==================== FLAT DISCUSSION TIMELINE (NO NESTED BUBBLE CLUTTER) ==================== */
    .chat-list {
      display: flex;
      flex-direction: column;
    }
    .chat-round-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.02em;
    }
    .chat-round-divider::before,
    .chat-round-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .chat-entry {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .chat-entry:last-child { border-bottom: none; }
    .chat-entry-body { flex: 1; min-width: 0; }
    .chat-entry-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-3);
    }
    .chat-entry-meta strong { color: var(--text); font-weight: 600; }
    .chat-entry.is-user {
      background: var(--accent-soft);
      margin: 4px -12px;
      padding: 12px;
      border-radius: 8px;
      border-bottom: none;
    }

    /* Docked Interjection Bar */
    .interject-dock {
      padding: 12px 22px;
      background: var(--surface-subtle);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .interject-dock select { width: auto; max-width: 210px; height: 34px; font-size: 12.5px; }
    .interject-dock input[type="text"] { flex: 1; min-width: 200px; height: 34px; }

    /* ==================== QUESTION CARD & MODALS ==================== */
    .q-panel {
      background: var(--surface-subtle);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .q-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      margin-top: 10px;
    }
    .q-opt {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-subtle);
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text);
    }
    .q-opt:hover { border-color: var(--accent-border); }
    .q-opt input { margin-top: 3px; width: auto; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 120;
    }
    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px 20px;
      box-shadow: var(--shadow-pop);
    }
    .modal-dialog.wide { max-width: 880px; }

    .src-viewer {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 60vh;
      overflow: auto;
      font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      padding: 6px 0;
    }
    .src-line { display: flex; padding: 1px 12px; white-space: pre-wrap; word-break: break-word; }
    .src-line.hl { background: var(--warn-soft); }
    .src-ln { width: 42px; flex-shrink: 0; color: var(--text-3); text-align: right; padding-right: 12px; user-select: none; }

    /* ==================== HISTORY & MEMBERS FLAT LISTS ==================== */
    .list-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .list-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: var(--surface-subtle); }

    .member-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .fs-list {
      max-height: 290px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-subtle);
      margin: 10px 0;
    }
    .fs-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
    }
    .fs-item:last-child { border-bottom: none; }
    .fs-item:hover { background: var(--surface-2); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-2);
      border: 1px dashed var(--border-strong);
      border-radius: 12px;
      background: var(--surface);
    }

    details summary {
      cursor: pointer;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 500;
      user-select: none;
    }
    details summary:hover { color: var(--text); }

    .footer-note {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-3);
    }
    .footer-note a { color: var(--text-2); text-decoration: none; }
    .footer-note a:hover { color: var(--text); text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      display: none;
      z-index: 200;
      box-shadow: var(--shadow-pop);
    }
    .toast.is-err { border-color: var(--err); color: var(--err); }
  </style>
</head>
<body>

  <!-- ==================== SINGLE-LINE TOP BAR ==================== -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark" id="brand-icon"></span>
        <span>AGY Roundtable</span>
      </div>
      <div class="v-sep"></div>
      <div class="proj-picker">
        <select id="project-select" onchange="onQuickProjectSelect(this.value)" title="Switch Workspace"></select>
        <button class="btn btn-ghost btn-icon" id="btn-browse-folder" onclick="openFolderBrowserModal()" title="Browse folder"></button>
        <button class="btn btn-ghost btn-icon" id="btn-open-folder" onclick="openCurrentFolder()" title="Open in Explorer"></button>
      </div>
      <div class="v-sep"></div>
      <nav class="topbar-nav" aria-label="Primary">
        <button class="nav-btn active" id="nav-workspace" onclick="switchView('workspace')">
          <span id="nav-workspace-lbl">现场</span>
          <span id="badge-active-count" class="tag tag-accent hidden" style="height:18px; padding:0 6px; font-size:10.5px;">0</span>
        </button>
        <button class="nav-btn" id="nav-history" onclick="switchView('history')">
          <span id="nav-history-lbl">历史</span>
          <span id="badge-history-count" class="nav-count">0</span>
        </button>
        <button class="nav-btn" id="nav-members" onclick="switchView('members')">
          <span id="nav-members-lbl">成员</span>
          <span id="badge-member-count" class="nav-count">0</span>
        </button>
      </nav>
    </div>

    <div class="topbar-right">
      <span id="paused-pill" class="tag tag-warn hidden"></span>
      <button class="btn btn-sm" id="btn-new-task" onclick="toggleComposerOpen()"></button>
      <button class="btn btn-ghost btn-icon" id="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme"></button>
      <button class="btn btn-ghost btn-sm" id="btn-lang-toggle" onclick="toggleLanguage()" style="font-weight:600;"></button>
      <button class="btn btn-ghost btn-icon" id="btn-utils-menu" onclick="toggleUtilsMenu(event)" title="Workspace Settings"></button>
    </div>
  </header>

  <!-- Floating Settings & Engine Popover -->
  <div id="utils-popover" class="popover hidden"></div>

  <main class="shell">
    <!-- ==================== VIEW 1: STUDIO WORKSPACE ==================== -->
    <section id="view-workspace">
      <div id="composer-panel" class="composer-panel hidden">
        <div class="composer-head">
          <div class="seg" id="mode-tabs">
            <button class="seg-btn active" data-mode="roundtable" onclick="selectComposerMode('roundtable')"></button>
            <button class="seg-btn" data-mode="chief_dispatch" onclick="selectComposerMode('chief_dispatch')"></button>
            <button class="seg-btn" data-mode="custom_dag" onclick="selectComposerMode('custom_dag')"></button>
            <button class="seg-btn" data-mode="single_member" onclick="selectComposerMode('single_member')"></button>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <select id="cmp-sandbox" style="width:auto; height:29px; padding:0 8px; font-size:12px;"></select>
            <button class="btn btn-ghost btn-icon hidden" id="btn-close-composer" onclick="setComposerOpen(false)" title="Close"></button>
          </div>
        </div>

        <div id="composer-mode-hint" class="composer-mode-hint"></div>
        <div id="composer-mode-studio"></div>

        <div style="margin-bottom:10px;">
          <textarea id="cmp-goal"></textarea>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <details id="cmp-adv-details" data-persist-id="cmp-adv" style="margin:0;">
            <summary id="cmp-adv-summary"></summary>
            <div class="grid-3" style="margin-top:10px;">
              <div>
                <label id="lbl-cmp-title"></label>
                <input type="text" id="cmp-title">
              </div>
              <div>
                <label id="lbl-cmp-scope"></label>
                <input type="text" id="cmp-subscope" value=".">
              </div>
              <div style="display:flex; flex-direction:column; gap:6px; justify-content:center; padding-top:14px;">
                <label style="display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
                  <input type="checkbox" id="cmp-manual-rule" style="width:auto;">
                  <span id="lbl-cmp-manual"></span>
                </label>
                <label style="display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
                  <input type="checkbox" id="cmp-reuse-sess" style="width:auto;">
                  <span id="lbl-cmp-reuse"></span>
                </label>
              </div>
            </div>
          </details>
          <button class="btn" id="btn-launch-task" onclick="submitTask()"></button>
        </div>
      </div>

      <!-- Active Task Pills (when >1 unarchived task in workspace) -->
      <div id="stage-pills" class="task-pills-row hidden"></div>

      <!-- Main Stage Surface + Persistent Interject Dock -->
      <div id="active-stage-container">
        <div id="active-stage-dynamic"></div>
        <div id="active-stage-interject" class="interject-dock hidden" style="border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; margin-top:-1px;">
          <select id="interject-target"></select>
          <input type="text" id="interject-input" onkeydown="if(event.key==='Enter'){event.preventDefault(); sendInterjection();}">
          <label style="display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; color:var(--text-2); white-space:nowrap;">
            <input type="checkbox" id="interject-wake" checked style="width:auto;">
            <span id="lbl-interject-wake"></span>
          </label>
          <button class="btn btn-sm" id="btn-interject-send" onclick="sendInterjection()"></button>
        </div>
      </div>
    </section>

    <!-- ==================== VIEW 2: HISTORY ==================== -->
    <section id="view-history" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div class="seg">
            <button class="seg-btn active" id="hist-scope-cur" onclick="setHistoryScope('current')"></button>
            <button class="seg-btn" id="hist-scope-all" onclick="setHistoryScope('all')"></button>
          </div>
          <input type="text" id="hist-search" style="width:220px; height:32px;" oninput="renderHistoryView()">
        </div>
        <button class="btn btn-sec btn-sm" id="btn-archive-all" onclick="archiveAllCompleted()"></button>
      </div>
      <div id="history-container"></div>
    </section>

    <!-- ==================== VIEW 3: MEMBERS & MODELS ==================== -->
    <section id="view-members" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
        <div>
          <div style="font-size:15px; font-weight:600;" id="lbl-members-heading"></div>
          <div style="font-size:12px; color:var(--text-2);" id="lbl-members-sub"></div>
        </div>
        <button class="btn btn-sec btn-sm" id="btn-refresh-models" onclick="loadCapabilities(true)"></button>
      </div>

      <div id="members-grid" class="grid-2" style="margin-bottom:14px;"></div>

      <div class="composer-panel" style="margin-bottom:12px; padding:14px 16px;">
        <details data-persist-id="add-member-drawer">
          <summary id="lbl-add-member"></summary>
          <div class="grid-3" style="margin-top:12px;">
            <div><label id="lbl-m-id"></label><input type="text" id="add-m-id"></div>
            <div><label id="lbl-m-name"></label><input type="text" id="add-m-name"></div>
            <div><label id="lbl-m-role"></label><select id="add-m-role"></select></div>
            <div>
              <label id="lbl-m-client"></label>
              <select id="add-m-client" onchange="populateClientModels('add-m-client', 'add-m-model', 'add-m-effort')">
                <option value="antigravity">Antigravity (Gemini / Claude)</option>
                <option value="codex">Codex (GPT)</option>
              </select>
            </div>
            <div><label id="lbl-m-model"></label><select id="add-m-model" onchange="syncClientEfforts('add-m-client', 'add-m-model', 'add-m-effort')"></select></div>
            <div><label id="lbl-m-effort"></label><select id="add-m-effort"></select></div>
          </div>
          <div style="margin-top:12px;">
            <button class="btn btn-sm" id="btn-save-member" onclick="createMember()"></button>
          </div>
        </details>
      </div>

      <div class="composer-panel" style="padding:14px 16px;">
        <details data-persist-id="roles-drawer">
          <summary id="lbl-roles-drawer"></summary>
          <div id="roles-box" style="margin-top:10px;"></div>
          <div class="grid-3" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
            <div><label id="lbl-r-id"></label><input type="text" id="r-id"></div>
            <div><label id="lbl-r-name"></label><input type="text" id="r-name"></div>
            <div><label id="lbl-r-desc"></label><input type="text" id="r-desc"></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:12px;">
            <button class="btn btn-sec btn-sm" id="btn-save-role" onclick="saveRole()"></button>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:12px; color:var(--text-2);" id="lbl-max-conc"></span>
              <input type="number" id="cfg-conc" min="1" max="6" value="3" style="width:62px; height:28px;">
              <button class="btn btn-sec btn-sm" id="btn-save-conc" onclick="saveConcurrency()"></button>
            </div>
          </div>
        </details>
      </div>
    </section>

    <footer class="footer-note">
      <span>AGY Roundtable · Dual-Engine Studio (Antigravity + Codex)</span>
      <a href="#open-link" class="ans-link" style="background:transparent; padding:0; border:none;" data-ans-link="https://github.com/dneo9527-ctrl/agy-console">Companion: dneo9527-ctrl/agy-console</a>
    </footer>
  </main>

  <!-- Question Confirmation Modal -->
  <div id="q-modal-backdrop" class="modal-backdrop">
    <div class="modal-dialog" id="q-modal-body" style="max-width:640px;"></div>
  </div>

  <!-- General & File Preview Modal -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-dialog" id="modal-body"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>

      trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',

    function t(key, vars = null) {
      let s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
      if (vars) {
        for (const [k, v] of Object.entries(vars)) {
          s = s.replaceAll('{' + k + '}', String(v ?? ''));
        }
      }
      return s;
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', THEME === 'light' ? 'light' : 'dark');
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) {
        btn.innerHTML = svgIcon(THEME === 'light' ? 'moon' : 'sun', 15);
        btn.title = t('themeToggle');
      }
    }

    function toggleTheme() {
      THEME = THEME === 'light' ? 'dark' : 'light';
      localStorage.setItem('roundtable_theme', THEME);
      applyTheme();
      toast(t('toastSwitchedTheme'));
    }

    function toggleLanguage() {
      LANG = LANG === 'en' ? 'zh' : 'en';
      localStorage.setItem('roundtable_lang', LANG);
      renderStaticChrome();
      renderComposerStudio();
      if (STATE) renderAll(STATE);
      if (UTILS_OPEN) renderUtilsPopover();
      toast(t('toastSwitchedLang'));
    }

    function toast(msg, isErr = false) {
      const el = document.getElementById('toast');
      el.className = 'toast' + (isErr ? ' is-err' : '');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._tt);
      window._tt = setTimeout(() => { el.style.display = 'none'; }, 3400);
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function normPath(p) {
      return String(p || '').replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase();
    }

    function fmtTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function fmtElapsedSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function liveTimerBadge(startedAt) {
      if (!startedAt) return '';
      const sec = Math.max(0, (Date.now() / 1000) - startedAt);
      return `<span class="tag tag-accent live-timer" data-started-at="${startedAt}">${fmtElapsedSec(sec)}</span>`;
    }

    function updateLiveTimersInDom() {
      const nowSec = Date.now() / 1000;
      document.querySelectorAll('.live-timer[data-started-at]').forEach(el => {
        const st = parseFloat(el.getAttribute('data-started-at') || '0');
        if (st > 0) el.textContent = fmtElapsedSec(nowSec - st);
      });
    }

    function initialsFor(id, member) {
      if (id === 'user') return LANG === 'en' ? 'You' : '我';
      const name = String(member?.name || id || '?').trim();
      if (/^Antigravity/i.test(name)) return 'AG';
      if (/^Codex/i.test(name)) return 'CX';
      const ascii = name.match(/[A-Za-z0-9]+/g);
      if (ascii && ascii.length >= 2) return (ascii[0][0] + ascii[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    function avatarHtml(id, member, opts = {}) {
      const cls = ['avatar'];
      if (id === 'user') cls.push('av-human');

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      const d = await r.json();
      if (!r.ok || d.ok === false) throw new Error(d.error || `HTTP ${r.status}`);
      return d;
    }

    // ==================== MARKDOWN RENDERER ====================
    function safeSliceMarkdown(rawText, maxLen = 760) {
      if (!rawText || rawText.length <= maxLen) return rawText;
      let cut = rawText.lastIndexOf('\n', maxLen);
      if (cut < maxLen * 0.55) cut = maxLen;
      const tail = rawText.slice(Math.max(0, cut - 220), cut);
      if (tail.lastIndexOf('[') > tail.lastIndexOf(')')) {
        const closeAfter = rawText.indexOf(')', cut);
        if (closeAfter !== -1 && closeAfter - cut < 260) cut = closeAfter + 1;
      }
      return rawText.slice(0, cut);
    }

    function formatInlineMd(escapedLine) {
      return escapedLine
        .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
        .replace(/\\text\{([^}]*)\}/g, '$1')
        .replace(/\\ge\b/g, '≥')
        .replace(/\\le\b/g, '≤')
        .replace(/\$([^$\n]{1,80})\$/g, '$1')
        .replace(/\[([^\]]+)\]\(((?:[^()\n]+|\([^()\n]*\))+)\)/g, (m, lbl, href) => {
          const cleanHref = href.trim();
          const ic = /^https?:\/\//i.test(cleanHref) ? svgIcon('external', 12) : svgIcon('file', 12);
          return `<a href="#open-link" class="ans-link" data-ans-link="${cleanHref}">${ic}<span>${lbl}</span></a>`;
        })
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    }

    function renderLiteMarkdown(rawText) {
      const src = String(rawText ?? '');
      if (!src.trim()) return '';
      const lines = src.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let inCode = false;
      let codeBuf = [];
      let tableBuf = [];
      let listBuf = [];

      const flushList = () => {
        if (listBuf.length) {
          out.push('<ul>' + listBuf.map(x => `<li>${x}</li>`).join('') + '</ul>');
          listBuf = [];
        }
      };
      const flushTable = () => {
        if (!tableBuf.length) return;
        const rows = tableBuf.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => formatInlineMd(esc(c.trim()))));
        tableBuf = [];
        if (rows.length >= 2 && rows[1].every(c => /^[-:\s]+$/.test(c))) {
          const head = '<tr>' + rows[0].map(c => `<th>${c}</th>`).join('') + '</tr>';
          const body = rows.slice(2).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
          out.push(`<div class="md-table-wrap"><table class="md-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`);
        } else {
          out.push(rows.map(r => `<p>${r.join(' | ')}</p>`).join(''));
        }
      };

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          flushList(); flushTable();
          if (!inCode) { inCode = true; codeBuf = []; }
          else { out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`); inCode = false; }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }

        if (/^\s*\|.+\|\s*$/.test(line)) {
          flushList();
          tableBuf.push(line.trim());
          continue;
        } else {
          flushTable();
        }

        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
          flushList();
          out.push('<hr>');
          continue;
        }
        const hm = line.match(/^(#{1,4})\s+(.+)$/);
        if (hm) {
          flushList();
          const lvl = hm[1].length;
          out.push(`<h${lvl}>${formatInlineMd(esc(hm[2]))}</h${lvl}>`);
          continue;
        }
        const lm = line.match(/^\s*[-*]\s+(.+)$/);
        if (lm) {
          listBuf.push(formatInlineMd(esc(lm[1])));
          continue;
        } else {
          flushList();
        }
        if (!line.trim()) continue;
        out.push(`<p>${formatInlineMd(esc(line))}</p>`);
      }
      if (inCode) out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`);
      flushList(); flushTable();
      return `<div class="md-body">${out.join('')}</div>`;
    }

    // ==================== COMPOSER LOGIC ====================
    function ensureComposerDefaults(st) {
      const ids = getRunnableIds(st);
      if (!ids.length) return;
      CMP.rtParticipants = CMP.rtParticipants.filter(x => ids.includes(x));
      if (!CMP.initialized || CMP.rtParticipants.length < 2) {
        const defaults = ['agy_gemini', 'codex_author', 'agy_claude_reviewer'].filter(x => ids.includes(x));
        CMP.rtParticipants = defaults.length >= 2 ? defaults : ids.slice(0, Math.min(3, ids.length));
      }
      if (!CMP.rtHost || !ids.includes(CMP.rtHost)) CMP.rtHost = CMP.rtParticipants[0] || ids[0];
      if (!CMP.chiefId || !ids.includes(CMP.chiefId)) CMP.chiefId = ids.includes('agy_gemini') ? 'agy_gemini' : ids[0];
      if (!CMP.soloId || !ids.includes(CMP.soloId)) CMP.soloId = ids.includes('codex_author') ? 'codex_author' : ids[0];
      if (!CMP.dagStages.length) {
        applyDagPreset('parallel_research_review', false);
      } else {
        CMP.dagStages.forEach(stg => stg.forEach(n => {
          if (!ids.includes(n.member_id)) n.member_id = ids[0];
        }));
      }
      CMP.initialized = true;
    }

      } else {

      CMP.rtHost = mid;
      renderComposerStudio();

    function applyDagPreset(presetName, showMsg = true) {
      const ids = getRunnableIds();
      const pick = (pref, idx = 0) => ids.includes(pref) ? pref : (ids[idx % Math.max(1, ids.length)] || 'codex_author');
      if (presetName === 'parallel_research_review') {
        CMP.dagStages = [
          [
            { member_id: pick('codex_author', 0), step_type: 'discussion', prompt: '' },
            { member_id: pick('agy_gemini', 1), step_type: 'discussion', prompt: '' }
          ],
          [{ member_id: pick('codex_author_2', 0), step_type: 'synthesis', prompt: '' }],
          [{ member_id: pick('agy_claude_reviewer', 2), step_type: 'review', prompt: '' }]
        ];
      } else if (presetName === 'impl_review_loop') {
        CMP.dagStages = [
          [{ member_id: pick('codex_author', 0), step_type: 'execution', prompt: '' }],
          [{ member_id: pick('agy_claude_reviewer', 1), step_type: 'review', prompt: '' }]
        ];
      } else if (presetName === 'impl_doc_parallel') {
        CMP.dagStages = [
          [{ member_id: pick('codex_author', 0), step_type: 'execution', prompt: '' }],
          [
            { member_id: pick('agy_claude_reviewer', 1), step_type: 'discussion', prompt: '' },
            { member_id: pick('codex_documenter', 2), step_type: 'synthesis', prompt: '' }
          ]
        ];
      }
      if (showMsg) toast(LANG === 'en' ? 'Pipeline preset loaded' : '已载入流水线预设');
      renderComposerStudio();
    }

    function addDagStage() {
      const ids = getRunnableIds();
      if (CMP.dagStages.length >= 6) return;
      CMP.dagStages.push([{ member_id: ids[0] || 'codex_author', step_type: 'execution', prompt: '' }]);
      renderComposerStudio();
    }
    function removeDagStage(sIdx) {
      if (CMP.dagStages.length <= 1) return;
      CMP.dagStages.splice(sIdx, 1);
      renderComposerStudio();
    }
    function addDagParallelNode(sIdx) {
      const ids = getRunnableIds();
      const stg = CMP.dagStages[sIdx];
      if (!stg || stg.length >= 4) return;
      const used = stg.map(x => x.member_id);
      stg.push({ member_id: ids.find(x => !used.includes(x)) || ids[0], step_type: 'discussion', prompt: '' });
      renderComposerStudio();
    }
    function removeDagNode(sIdx, nIdx) {
      const stg = CMP.dagStages[sIdx];
      if (!stg) return;
      stg.splice(nIdx, 1);
      if (!stg.length) {
        if (CMP.dagStages.length > 1) CMP.dagStages.splice(sIdx, 1);
        else stg.push({ member_id: getRunnableIds()[0] || 'codex_author', step_type: 'execution', prompt: '' });
      }
      renderComposerStudio();
    }
    function updateDagNode(sIdx, nIdx, field, val) {
      if (CMP.dagStages[sIdx]?.[nIdx]) {
        CMP.dagStages[sIdx][nIdx][field] = val;
        if (field !== 'prompt') renderComposerStudio();
      }
    }

    function renderComposerStudio() {
      const box = document.getElementById('composer-mode-studio');
      if (!box || !STATE) return;
      ensureComposerDefaults(STATE);
      const ms = STATE.members || {};
      const ids = getRunnableIds(STATE);

      const memberOptions = (selectedId) => ids.map(id => {
        const m = ms[id];
        const eng = m.client === 'antigravity' ? 'AGY' : 'Codex';
        return `<option value="${esc(id)}" ${id === selectedId ? 'selected' : ''}>[${eng}] ${esc(m.name || id)} (${esc(m.model)})</option>`;
      }).join('');

      if (CMP.mode === 'roundtable') {
        const chips = ids.map(id => {
          const m = ms[id];
          const sel = CMP.rtParticipants.includes(id);
          const isHost = id === CMP.rtHost;
          return `
            <div class="seat-pill ${sel ? 'selected' : ''}" onclick="toggleRtParticipant('${esc(id)}')">
              ${avatarHtml(id, m, { sm: true })}

    // ==================== CAPABILITIES & PROJECTS ====================
    async function loadCapabilities(refresh = false) {
      try {
        CAPS = await api('GET', `/api/models?refresh=${refresh ? 1 : 0}`);
        populateClientModels('add-m-client', 'add-m-model', 'add-m-effort');
        if (UTILS_OPEN) renderUtilsPopover();
        if (refresh) toast(LANG === 'en' ? 'CLI model catalog refreshed' : '已刷新双端官方模型列表');
      } catch (e) {
        toast(t('toastFail', { err: e.message }), true);
      }
    }

    function populateClientModels(clientSelId, modelSelId, effortSelId, preferredModel, preferredEffort) {
      const cSel = document.getElementById(clientSelId);
      const mSel = document.getElementById(modelSelId);
      if (!cSel || !mSel) return;
      const models = (CAPS.clients?.[cSel.value]?.models) || [];
      mSel.innerHTML = models.map(m => `<option value="${esc(m.slug)}" ${m.slug === preferredModel ? 'selected' : ''}>${esc(m.display_name)}</option>`).join('')
        || `<option value="client_default">Default</option>`;
      syncClientEfforts(clientSelId, modelSelId, effortSelId, preferredEffort);
    }

    function syncClientEfforts(clientSelId, modelSelId, effortSelId, preferredEffort) {
      const client = document.getElementById(clientSelId)?.value;
      const slug = document.getElementById(modelSelId)?.value;
      const eSel = document.getElementById(effortSelId);
      if (!eSel) return;
      const found = ((CAPS.clients?.[client]?.models) || []).find(x => x.slug === slug);
      const efforts = found?.supported_reasoning_efforts?.length ? found.supported_reasoning_efforts : ['medium'];
      const chosen = (preferredEffort && efforts.includes(preferredEffort)) ? preferredEffort : (found?.default_reasoning_effort || efforts[0]);
      eSel.innerHTML = efforts.map(ef => `<option value="${esc(ef)}" ${ef === chosen ? 'selected' : ''}>${esc(ef)}</option>`).join('');
    }

    async function loadProjects() {
      try {
        PROJECTS = await api('GET', '/api/projects');
        renderProjectDropdown();
      } catch (e) { console.error(e); }
    }

    function renderProjectDropdown() {
      const sel = document.getElementById('project-select');
      const curPath = STATE?.binding?.project_path || PROJECTS.current_project_path || '';
      const curNorm = normPath(curPath);
      let matched = false;
      let html = '';
      for (const grp of (PROJECTS.groups || [])) {
        const opts = (grp.items || []).map(it => {
          const isCur = normPath(it.path) === curNorm;
          if (isCur) matched = true;
          return `<option value="${esc(it.path)}" ${isCur ? 'selected' : ''}>${esc(it.name)}</option>`;
        }).join('');
        if (opts) html += `<optgroup label="${esc(grp.group)}">${opts}</optgroup>`;
      }
      if (!matched && curPath) {
        const base = curPath.split(/[\\/]/).filter(Boolean).pop() || curPath;
        html = `<optgroup label="Current"><option value="${esc(curPath)}" selected>${esc(base)}</option></optgroup>` + html;
      }
      sel.innerHTML = html;
      sel.title = curPath;
    }

    async function onQuickProjectSelect(targetPath) {
      if (!targetPath) return;
      try {
        await api('POST', '/api/projects/switch', { project_path: targetPath });
        COMPOSER_OPEN_OVERRIDE = null;
        await loadProjects();
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function pickNativeFolder() {
      try {
        const r = await api('POST', '/api/fs/pick_native', {});
        if (!r.cancelled && r.path) {

          await loadProjects();

        </div>
        <div class="fs-list">${rows.join('') || `<div style="padding:18px; text-align:center; color:var(--text-3);">${esc(t('emptyDir'))}</div>`}</div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button class="btn btn-sec btn-sm" onclick="closeModal()">${esc(t('cancel'))}</button>
          <button class="btn btn-sm" onclick="selectFolderFromModal(document.getElementById('mdl-fs-path').value)">${LANG === 'en' ? 'Use Current Folder' : '选定当前目录'}</button>

    // ==================== STATE POLLING & RENDERING ====================
    function saveOpenDetails() {
      document.querySelectorAll('details[data-persist-id]').forEach(d => {
        const id = d.getAttribute('data-persist-id');
        if (d.open) OPEN_DETAILS.add(id); else OPEN_DETAILS.delete(id);
      });
    }
    function restoreOpenDetails() {
      document.querySelectorAll('details[data-persist-id]').forEach(d => {
        if (OPEN_DETAILS.has(d.getAttribute('data-persist-id'))) d.open = true;
      });
    }

    async function refreshState(force = false) {
      try {
        const st = await api('GET', '/api/state');
        STATE = st;
        const h = JSON.stringify(st) + '|' + HISTORY_SCOPE + '|' + JSON.stringify(MANUAL_STAGE_TABS) + '|' + LANG;
        if (force || h !== LAST_HASH) {
          LAST_HASH = h;
          renderAll(st);
        }
      } catch (e) { console.error(e); }
    }

    function renderAll(st) {
      saveOpenDetails();
      renderProjectDropdown();

      document.getElementById('paused-pill').classList.toggle('hidden', !st.paused);

      const runnableIds = getRunnableIds(st);
      const memberSig = JSON.stringify(runnableIds.map(id => [id, st.members[id].name, st.members[id].client, st.members[id].model, st.members[id].reasoning_effort, st.members[id].role]));
      if (memberSig !== LAST_MEMBER_SIG) {
        LAST_MEMBER_SIG = memberSig;
        renderComposerStudio();
      }

      const rSel = document.getElementById('add-m-role');
      if (rSel) {
        const prevR = rSel.value;
        rSel.innerHTML = Object.keys(st.roles || {}).map(rid => `<option value="${esc(rid)}">${esc(st.roles[rid].name)}</option>`).join('');
        if (prevR && st.roles[prevR]) rSel.value = prevR;
      }

      const projUnarchived = getProjUnarchived(st);
      const workingMembers = runnableIds.filter(id => st.members[id].status === 'working').length;
      const actBadge = document.getElementById('badge-active-count');
      if (workingMembers > 0) {
        actBadge.textContent = String(workingMembers);
        actBadge.classList.remove('hidden');
      } else {
        actBadge.classList.add('hidden');
      }
      document.getElementById('badge-history-count').textContent = String((st.tasks || []).length);
      document.getElementById('badge-member-count').textContent = String(runnableIds.length);

      syncComposerVisibility(projUnarchived);
      renderActiveStage(st, projUnarchived);
      renderHistoryView();
      renderMembersView(st);
      if (UTILS_OPEN) renderUtilsPopover();
      restoreOpenDetails();
    }

    // ==================== ACTIVE STAGE (SINGLE-TRACK, READING-FIRST) ====================
    function activeTabFor(task) {
      const explicit = MANUAL_STAGE_TABS[task.id];
      if (explicit) return explicit;
      return task.status === 'succeeded' ? 'deliverable' : 'discussion';
    }

    function setStageTab(taskId, tab) {
      MANUAL_STAGE_TABS[taskId] = tab;
      refreshState(true);
    }

    function toggleExpandMsg(msgId) {
      if (EXPANDED_MSGS.has(msgId)) EXPANDED_MSGS.delete(msgId);
      else EXPANDED_MSGS.add(msgId);
      refreshState(true);
    }

    function renderLiveRosterStrip(st, task) {
      const ms = st.members || {};
      const steps = task.steps || [];
      const meta = task.mode_meta || {};
      const mode = task.execution_mode || task.dispatch_mode || 'single_member';
      const hostId = meta.host_member_id || meta.chief_member_id || steps[0]?.member_id;
      const parts = meta.participants || [...new Set(steps.map(s => s.member_id))];
      const ordered = (hostId && parts.includes(hostId)) ? parts : (hostId ? [hostId, ...parts.filter(x => x !== hostId)] : parts);
      const consultTotal = steps.reduce((a, s) => a + (s.consult_count || 0), 0);

      // Completed: show a calm 1-line summary + quiet specialist chips
      if (task.status === 'succeeded') {
        const sumTxt = mode === 'roundtable'
          ? t('consensusDone', { n: ordered.length, r: meta.discussion_rounds || 2, c: consultTotal })
          : t('completedSummary', { n: steps.length, m: (task.chat_room || []).length });
        const chips = ordered.map(mid => {
          const m = ms[mid] || { name: mid };
          const isHost = mid === hostId && (mode === 'roundtable' || mode === 'chief_dispatch');
          return `<span class="tag">${avatarHtml(mid, m, { sm: true })}<span>${esc(m.name || mid)}</span>${isHost ? svgIcon('crown', 11) : ''}</span>`;
        }).join('');
        return `
          <div class="live-roster-strip" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:10px 22px;">
            <span style="font-size:12px; color:var(--text-2); display:inline-flex; align-items:center; gap:7px;">
              <span class="dot dot-ok"></span>${esc(sumTxt)}
            </span>
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">${chips}</div>
          </div>
        `;
      }

      // Running / Active: clean horizontal live cards showing who is speaking right now
      const curStep = steps.find(s => s.status === 'running') || steps[task.current_step_index || 0] || steps[steps.length - 1];
      const latestByMember = {};
      steps.forEach(s => {
        const att = (s.attempts || [])[s.attempts.length - 1];
        const txt = (s.status === 'running' && att?.partial_text) ? att.partial_text : (s.latest_result_text || '');
        if (txt) latestByMember[s.member_id] = txt;
      });
      (task.chat_room || []).forEach(cm => {
        if (cm.sender_id && cm.sender_id !== 'user' && cm.content) latestByMember[cm.sender_id] = cm.content;
      });

      const cards = ordered.map(mid => {
        const m = ms[mid] || { name: mid, client: 'codex', model: '-' };
        const isHost = mid === hostId && (mode === 'roundtable' || mode === 'chief_dispatch');
        const runStep = steps.find(s => s.status === 'running' && s.member_id === mid);
        const runAtt = runStep?.attempts?.[runStep.attempts.length - 1];
        const isSpeaking = Boolean(runStep) || (m.status === 'working' && m.current_task_id === task.id);
        const snip = latestByMember[mid] || '';
        return `
          <div class="seat-card ${isSpeaking ? 'speaking' : ''}">
            ${avatarHtml(mid, m, { speaking: isSpeaking })}
            <div style="min-width:0; flex:1;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <span style="font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                  ${isHost ? svgIcon('crown', 12) : ''}${esc(m.name || mid)}
                </span>
                ${isSpeaking ? liveTimerBadge(runAtt?.started_at) : `<span style="font-size:11px; color:var(--text-3);">${esc(snip ? t('spoke') : t('listening'))}</span>`}
              </div>
              <div style="font-size:11px; color:var(--text-3); margin-top:1px;">${esc(m.model || '-')}</div>
              ${snip ? `<div class="seat-snippet">${esc(snip.slice(0, 96))}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="live-roster-strip">
          <div class="live-phase-row">
            <span style="font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:7px;">
              <span class="dot dot-run"></span>
              ${esc(t('liveAgenda', { phase: curStep?.round_label || curStep?.title || '-' }))}
            </span>
            <span class="tabular" style="color:var(--text-3);">${esc(t('msgsUnit', { n: (task.chat_room || []).length }))}</span>
          </div>
          <div class="seat-grid">${cards}</div>
        </div>
      `;
    }

    function renderDiscussionTab(st, task) {
      const msgs = task.chat_room || [];
      const ms = st.members || {};
      const runningSteps = (task.steps || []).filter(s => s.status === 'running');
      if (!msgs.length && !runningSteps.length) {
        return `<div style="padding:28px 0; text-align:center; color:var(--text-3);">${esc(t('noChatYet'))}</div>`;
      }

      let lastRound = '';
      const out = [];
      for (const cm of msgs) {
        const rl = cm.round_label || '';
        if (rl && rl !== lastRound) {
          lastRound = rl;
          out.push(`<div class="chat-round-divider">${esc(rl)}</div>`);
        }
        const isUser = cm.sender_id === 'user';
        const mem = ms[cm.sender_id] || { name: cm.sender_name, client: cm.sender_client || 'codex' };
        let kindTag = '';
        if (cm.kind === 'mention_ask') kindTag = `<span class="tag tag-warn">@${esc(cm.to_member_name || cm.to_member_id)}</span>`;
        else if (cm.kind === 'mention_reply') kindTag = `<span class="tag tag-accent">↳ @${esc(cm.to_member_name || cm.to_member_id)}</span>`;
        else if (cm.kind === 'review') kindTag = `<span class="tag">${LANG === 'en' ? 'Review' : '审查意见'}</span>`;
        else if (cm.kind === 'deliverable') kindTag = `<span class="tag tag-ok">${LANG === 'en' ? 'Synthesis' : '终稿交付'}</span>`;

        const rawC = cm.content || '';
        const isLong = rawC.length > 900;
        const expanded = EXPANDED_MSGS.has(cm.id);
        const shown = (isLong && !expanded) ? (safeSliceMarkdown(rawC, 820) + '\n\n*...*') : rawC;

        out.push(`
          <article class="chat-entry ${isUser ? 'is-user' : ''}">
            ${avatarHtml(cm.sender_id, mem)}
            <div class="chat-entry-body">
              <div class="chat-entry-meta">
                <strong>${esc(cm.sender_name || cm.sender_id)}</strong>
                ${cm.sender_model ? `<span>${esc(cm.sender_model)}</span>` : ''}
                ${kindTag}
                <span class="tabular">${fmtTime(cm.ts)}</span>
              </div>
              <div class="doc-reading" style="margin:0; max-width:none; font-size:13.5px;">${renderLiteMarkdown(shown)}</div>
              ${isLong ? `<div style="margin-top:8px;"><button class="btn btn-sec btn-sm" onclick="toggleExpandMsg('${esc(cm.id)}')">${esc(expanded ? t('collapseText') : t('expandFull', { n: rawC.length }))}</button></div>` : ''}
            </div>
          </article>
        `);
      }

      runningSteps.forEach(s => {
        const m = ms[s.member_id] || { name: s.member_id };
        const att = (s.attempts || [])[s.attempts.length - 1];
        const partial = att?.partial_text || m.live_activity || (LANG === 'en' ? 'Analyzing workspace files...' : '正在查阅项目文件并思考...');
        out.push(`
          <article class="chat-entry">
            ${avatarHtml(s.member_id, m, { speaking: true })}
            <div class="chat-entry-body">
              <div class="chat-entry-meta">
                <strong>${esc(m.name || s.member_id)}</strong>
                <span class="tag tag-accent"><span class="dot dot-run"></span>${esc(s.title)}</span>
                ${liveTimerBadge(att?.started_at)}
              </div>
              <div class="doc-reading" style="margin:0; max-width:none; color:var(--text-2); font-size:13px;">${renderLiteMarkdown(partial.slice(-1400))}</div>
            </div>
          </article>
        `);
      });

      return `<div class="chat-list">${out.join('')}</div>`;
    }

                <div style="font-size:11.5px; color:var(--text-3);">

              ${['failed', 'aborted', 'blocked'].includes(s.status) ? `<button class="btn btn-sec btn-sm" onclick="retrySingleStep('${esc(task.id)}', ${s.step_index})">${esc(t('retryClean'))}</button>` : ''}

    function syncInterjectBar(st, focused) {
      const dock = document.getElementById('active-stage-interject');
      if (!focused) {
        dock.classList.add('hidden');
        FOCUSED_TASK_ID = null;
        return;
      }
      dock.classList.remove('hidden');
      const sel = document.getElementById('interject-target');
      const ids = getRunnableIds(st);
      const sig = focused.id + '|' + LANG + '|' + ids.map(id => `${id}:${st.members[id].name}`).join(',');
      if (sel.getAttribute('data-sig') !== sig) {
        const prev = sel.value;
        sel.innerHTML = `<option value="">${esc(t('interjectAll'))}</option>` + ids.map(id => {
          const m = st.members[id];
          return `<option value="${esc(id)}">@${esc(m.name || id)}</option>`;
        }).join('');
        if (prev && ids.includes(prev)) sel.value = prev;
        sel.setAttribute('data-sig', sig);
      }
      FOCUSED_TASK_ID = focused.id;
    }

    function renderActiveStage(st, projUnarchived) {
      const pillsEl = document.getElementById('stage-pills');
      const stageEl = document.getElementById('active-stage-dynamic');

      if (!projUnarchived.length) {
        pillsEl.classList.add('hidden');
        syncInterjectBar(st, null);
        syncQuestionPopupModal(st, null);
        stageEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:4px;">${esc(t('emptyStageTitle'))}</div>
            <div style="font-size:12.5px;">${esc(t('emptyStageSub'))}</div>
          </div>
        `;
        return;
      }

      const focused = projUnarchived.find(x => x.id === st.active_task_id) || projUnarchived[projUnarchived.length - 1];
      syncInterjectBar(st, focused);
      syncQuestionPopupModal(st, focused);

      if (projUnarchived.length > 1) {
        pillsEl.classList.remove('hidden');
        pillsEl.innerHTML = projUnarchived.slice().reverse().map(tk => {
          const [, dotCls] = statusMeta(tk.status);
          return `
            <button class="task-pill ${tk.id === focused.id ? 'active' : ''}" onclick="focusTask('${esc(tk.id)}')">
              <span class="dot ${dotCls}"></span>
              <span>${esc(tk.title)}</span>
            </button>
          `;
        }).join('');
      } else {
        pillsEl.classList.add('hidden');
      }

      const steps = focused.steps || [];
      const curStep = steps.find(s => s.status === 'running') || steps[focused.current_step_index ?? (steps.length - 1)] || steps[steps.length - 1];
      const lastAtt = curStep?.attempts?.[curStep.attempts.length - 1];
      let mainOutput = focused.summary || (focused.status === 'running' && lastAtt?.partial_text) || curStep?.latest_result_text || lastAtt?.result_text || lastAtt?.partial_text || '';
      window._LATEST_MAIN_OUTPUT = mainOutput;

      const curTab = activeTabFor(focused);
      const qCardHtml = renderQuestionCardHtml(focused);

      // Troubled step rescue notice
      const troubledStep = steps.find(s => ['failed', 'aborted', 'blocked'].includes(s.status));
      let rescueHtml = '';
      if (troubledStep) {
        const tAtt = [...(troubledStep.attempts || [])].reverse().find(a => (a.result_text || a.partial_text || '').trim().length > 60);
        const rLen = tAtt ? (tAtt.result_text || tAtt.partial_text || '').trim().length : 0;
        rescueHtml = `
          <div class="notice notice-warn">
            <div>
              <div style="font-weight:600;">${esc(t('rescueTitle', { n: troubledStep.step_index, t: troubledStep.title }))}</div>
              <div style="font-size:12px; color:var(--text-2); margin-top:2px;">${esc(rLen > 0 ? t('rescueHasPartial', { len: rLen }) : t('rescueNoPartial'))}</div>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${rLen > 0 ? `<button class="btn btn-sm" onclick="acceptStepPartial('${esc(focused.id)}', ${troubledStep.step_index})">${esc(t('adoptPartial', { len: rLen }))}</button>` : ''}
              <button class="btn btn-sec btn-sm" onclick="retrySingleStep('${esc(focused.id)}', ${troubledStep.step_index})">${esc(t('retryClean'))}</button>
              <button class="btn btn-sec btn-sm" onclick="openReassignModal('${esc(focused.id)}', ${troubledStep.step_index}, '${esc(troubledStep.member_id)}')">${esc(t('reassign'))}</button>
            </div>
          </div>
        `;
      }

      const latestRev = (focused.reviews || [])[focused.reviews.length - 1];
      const revHtml = latestRev ? `
        <div class="notice ${latestRev.verdict === 'ACCEPT' ? 'notice-ok' : 'notice-warn'}">
          <div>
            <strong>${esc(t('reviewVerdict', { v: latestRev.verdict, r: latestRev.round }))}</strong>
            <span style="color:var(--text-2); margin-left:6px;">${latestRev.problem ? esc(latestRev.problem) + ' — ' : ''}${esc(latestRev.evidence)}</span>
          </div>
        </div>
      ` : '';

      const blockingHtml = (!qCardHtml && focused.blocking_reason)
        ? `<div class="notice notice-err"><span>${esc(focused.blocking_reason)}</span></div>`
        : '';

      let tabContentHtml = '';
      if (curTab === 'deliverable') {
        tabContentHtml = mainOutput
          ? `
            <div class="doc-reading">
              <div class="doc-actions-row">
                <span style="font-size:12px; color:var(--text-3);" class="tabular">${esc(t('charsUnit', { n: mainOutput.length }))}</span>
                <button class="btn btn-sec btn-sm" onclick="copyText(window._LATEST_MAIN_OUTPUT || '')">${svgIcon('copy', 13)} ${esc(t('copyMd'))}</button>
              </div>
              ${renderLiteMarkdown(mainOutput)}
            </div>
          `
          : `<div style="padding:28px 0; text-align:center; color:var(--text-2); font-size:13px;">${esc(t('noDeliverable'))}</div>`;
      } else if (curTab === 'discussion') {
        tabContentHtml = renderDiscussionTab(st, focused);
      } else {
        tabContentHtml = renderDetailsTab(st, focused);
      }

      stageEl.innerHTML = `
        <div class="stage-surface" style="border-bottom-left-radius:0; border-bottom-right-radius:0;">
          <div class="stage-header">
            <div class="stage-title-row">
              <div style="min-width:0; flex:1;">
                <h1 class="stage-title">${esc(focused.title)}</h1>
                <div class="stage-meta">
                  ${statusTag(focused.status)}
                  <span class="tag">${esc(modeLabel(focused.execution_mode || focused.dispatch_mode))}</span>
                  <span>${esc(focused.sandbox || 'read-only')}</span>
                  <span class="tabular">${fmtTime(focused.created_at)}</span>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                ${focused.status === 'running' ? `<button class="btn btn-danger btn-sm" onclick="abortTask('${esc(focused.id)}')">${svgIcon('stop', 12)} ${esc(t('abort'))}</button>` : ''}
                ${['aborted', 'failed', 'needs_verification', 'blocked'].includes(focused.status) ? `<button class="btn btn-warn btn-sm" onclick="continueTask('${esc(focused.id)}')">${svgIcon('play', 12)} ${esc(t('resume'))}</button>` : ''}
                ${focused.status === 'needs_ruling' ? `<button class="btn btn-warn btn-sm" onclick="openRulingModal('${esc(focused.id)}', ${curStep ? curStep.step_index : 0})">${esc(t('ruling'))}</button>` : ''}
                ${focused.status !== 'running' ? `<button class="btn btn-sec btn-sm" onclick="openFollowupModal('${esc(focused.id)}')">${svgIcon('repeat', 12)} ${esc(t('followup'))}</button>` : ''}
                <button class="btn btn-ghost btn-sm" onclick="archiveSingleTask('${esc(focused.id)}')">${svgIcon('archive', 13)} ${esc(t('archive'))}</button>
              </div>
            </div>
          </div>

          ${renderLiveRosterStrip(st, focused)}

          <div class="stage-toolbar">
            <div class="seg">
              <button class="seg-btn ${curTab === 'deliverable' ? 'active' : ''}" onclick="setStageTab('${esc(focused.id)}', 'deliverable')">${svgIcon('file', 13)} ${esc(t('tabDeliverable'))}</button>
              <button class="seg-btn ${curTab === 'discussion' ? 'active' : ''}" onclick="setStageTab('${esc(focused.id)}', 'discussion')">${svgIcon('message', 13)} ${esc(t('tabDiscussion'))} <span class="tabular" style="opacity:0.7;">${(focused.chat_room || []).length}</span></button>
              <button class="seg-btn ${curTab === 'details' ? 'active' : ''}" onclick="setStageTab('${esc(focused.id)}', 'details')">${svgIcon('layers', 13)} ${esc(t('tabDetails'))} <span class="tabular" style="opacity:0.7;">${steps.length}</span></button>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              ${focused.status !== 'needs_ruling' ? `<button class="btn btn-ghost btn-sm" onclick="openRulingModal('${esc(focused.id)}', ${curStep ? curStep.step_index : 0})">${esc(t('ruling'))}</button>` : ''}
              <button class="btn btn-ghost btn-sm" onclick="openReassignModal('${esc(focused.id)}', ${curStep ? curStep.step_index : 0}, '${esc(curStep ? curStep.member_id : 'codex_author')}')">${esc(t('reassign'))}</button>
            </div>
          </div>

          <div class="stage-body">
            ${qCardHtml}
            ${blockingHtml}
            ${rescueHtml}
            ${revHtml}
            ${tabContentHtml}
          </div>
        </div>
      `;
    }

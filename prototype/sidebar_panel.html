    // ==================== MARKDOWN RENDERER (O(N) ZERO-ReDoS + LRU MEMOIZATION + INLINE CODE GUARD) ====================
    function _fastStrHash(str) {
      let h = 2166136261 >>> 0;
      const len = str.length;
      const step = len > 4096 ? Math.floor(len / 1024) : 1;
      for (let i = 0; i < len; i += step) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      h ^= len;
      return h.toString(36);
    }

    function safeSliceMarkdown(rawText, maxLen = 760) {
      if (!rawText || rawText.length <= maxLen) return rawText;
      let cut = rawText.lastIndexOf('\n', maxLen);
      if (cut < maxLen * 0.55) cut = maxLen;
      const tail = rawText.slice(Math.max(0, cut - 260), cut);
      if (tail.lastIndexOf('[') > tail.lastIndexOf(')')) {
        const closeAfter = rawText.indexOf(')', cut);
        if (closeAfter !== -1 && closeAfter - cut < 320) cut = closeAfter + 1;
        else {
          const lb = rawText.lastIndexOf('[', cut);
          if (lb > maxLen * 0.35) cut = lb;
        }
      }
      if (cut > 0 && rawText[cut - 1] === '!' && rawText[cut] === '[') cut -= 1;
      let sliced = rawText.slice(0, cut);
      // Close any unclosed triple-backtick fence so preview never swallows following UI
      const fences = sliced.match(/^\s*```/gm);
      if (fences && (fences.length % 2 === 1)) sliced += '\n```';
      return sliced;
    }

    function _replaceMdLinksAndImagesLinear(str, taskId, stash) {
      // Strictly linear O(N) balanced-paren parser: eliminates O(2^N) catastrophic regex backtracking on unclosed links!
      if (!str || str.indexOf('[') === -1) return str;
      const n = str.length;
      let out = '';
      let i = 0;
      while (i < n) {
        const lb = str.indexOf('[', i);
        if (lb === -1) {
          out += str.slice(i);
          break;
        }
        const isImg = lb > i && str.charCodeAt(lb - 1) === 33; // '!'
        const startPos = isImg ? lb - 1 : lb;
        // Find closing ']' on same line
        let rb = -1;
        for (let k = lb + 1; k < n && k - lb <= 400; k++) {
          const ch = str.charCodeAt(k);
          if (ch === 10 || ch === 13) break;
          if (ch === 93) { rb = k; break; } // ']'
        }
        if (rb === -1 || rb + 1 >= n || str.charCodeAt(rb + 1) !== 40) { // '('
          out += str.slice(i, lb + 1);
          i = lb + 1;
          continue;
        }
        // Scan balanced '(' ... ')' on same line (bounded to 640 chars)
        let depth = 1;
        let rp = -1;
        const maxScan = Math.min(n, rb + 2 + 640);
        for (let k = rb + 2; k < maxScan; k++) {
          const ch = str.charCodeAt(k);
          if (ch === 10 || ch === 13) break;
          if (ch === 40) depth++;
          else if (ch === 41) {
            depth--;
            if (depth === 0) { rp = k; break; }
          }
        }
        if (rp === -1) {
          out += str.slice(i, lb + 1);
          i = lb + 1;
          continue;
        }
        const label = str.slice(lb + 1, rb);
        const href = str.slice(rb + 2, rp);
        if (!href || (!isImg && !label)) {
          out += str.slice(i, lb + 1);
          i = lb + 1;
          continue;
        }
        out += str.slice(i, startPos);
        if (isImg) {
          out += stash(_renderInlineMdImage(label, href, taskId));
        } else {
          const cleanHref = _decodeHtmlEntitiesUrl(href).trim();
          const ic = /^https?:\/\//i.test(cleanHref) ? svgIcon('external', 12) : svgIcon('file', 12);
          out += stash(`<a href="#open-link" class="ans-link" data-ans-link="${esc(cleanHref)}">${ic}<span>${label}</span></a>`);
        }
        i = rp + 1;
      }
      return out;
    }

    function _decodeHtmlEntitiesUrl(s) {
      return String(s || '')
        .replace(/&amp;/g, '&')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>');
    }

    function _renderInlineMdImage(altEsc, hrefEsc, taskId) {
      const cleanHref = _decodeHtmlEntitiesUrl(hrefEsc).trim();
      const lower = cleanHref.toLowerCase();
      // Never auto-fetch remote http(s) or data:/javascript: URLs -> keep as safe clickable link!
      if (/^(?:https?:|data:|javascript:)/i.test(cleanHref)) {
        const ic = /^https?:\/\//i.test(cleanHref) ? svgIcon('external', 12) : svgIcon('file', 12);
        return `<a href="#open-link" class="ans-link" data-ans-link="${esc(cleanHref)}">${ic}<span>${altEsc || esc(cleanHref)}</span></a>`;
      }
      const noFrag = cleanHref.split('#')[0].split('?')[0];
      const ext = (noFrag.match(/\.([a-z0-9]+)$/i)?.[1] || '').toLowerCase();
      const baseName = noFrag.split(/[\\/]/).pop() || noFrag;
      const tid = taskId || FOCUSED_TASK_ID || '';

      if (['pdf', 'tif', 'tiff'].includes(ext)) {
        return `<button type="button" class="md-fig-stub" data-md-file="${esc(cleanHref)}" onclick="openAnswerLink(this.getAttribute('data-md-file'))">${svgIcon('image', 13)}<span class="tag">${esc(ext.toUpperCase())}</span><span class="tx">${altEsc || esc(baseName)}</span></button>`;
      }
      if (['svg', 'png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) {
        const rawUrl = `/api/fs/raw_file?path=${encodeURIComponent(cleanHref)}&task_id=${encodeURIComponent(tid)}`;
        const capTxt = altEsc || esc(baseName);
        return (
          `<span class="md-fig-box">` +
            `<span class="md-fig-canvas ${proofFilterClass()}" data-lb-url="${esc(rawUrl)}" data-lb-path="${esc(cleanHref)}" data-lb-title="${capTxt}" data-lb-fmt="${esc(ext)}" onclick="openSimpleFigLightbox(this)">` +
              `<img src="${esc(rawUrl)}" alt="${capTxt}" loading="lazy" onerror="fallbackBrokenInlineImage(this)">` +
            `</span>` +
            `<span class="md-fig-cap">` +
              `<span class="u-wrap">${capTxt}</span>` +
              `<span style="display:inline-flex; gap:6px; flex-shrink:0;">` +
                `<a href="#open-link" class="ans-link" data-ans-link="${esc(cleanHref)}">${svgIcon('file', 11)}<span>${esc(baseName)}</span></a>` +
              `</span>` +
            `</span>` +
          `</span>`
        );
      }
      return `<a href="#open-link" class="ans-link" data-ans-link="${esc(cleanHref)}">${svgIcon('file', 12)}<span>${altEsc || esc(baseName)}</span></a>`;
    }

    function fallbackBrokenInlineImage(imgEl) {
      const box = imgEl?.closest?.('.md-fig-box');
      if (!box) return;
      const p = imgEl.closest('.md-fig-canvas')?.getAttribute('data-lb-path') || '';
      const a = document.createElement('a');
      a.href = '#open-link';
      a.className = 'ans-link';
      a.setAttribute('data-ans-link', p);
      a.textContent = imgEl.alt || p || 'figure';
      box.replaceWith(a);
    }

    function formatInlineMd(escapedLine, taskId = '') {
      // 1. Protect inline `code` spans FIRST so `[x](y)` or `![a](b)` inside code never becomes a link/image!
      const codeSlots = [];
      let s = escapedLine.replace(/`([^`]+)`/g, (m, inner) => {
        const idx = codeSlots.length;
        codeSlots.push(`<code>${inner}</code>`);
        return `\u0000CODE${idx}\u0000`;
      });

      // 2. Protect inline images `![alt](href)` BEFORE links `[label](href)` (stores HTML in placeholders so emphasis regex never corrupts attributes!)
      const htmlSlots = [];
      const stash = (html) => {
        const idx = htmlSlots.length;
        htmlSlots.push(html);
        return `\u0000HTML${idx}\u0000`;
      };

      s = s
        .replace(/&lt;br\s*\/?&gt;/gi, () => stash('<br>'))
        .replace(/\\text\{([^}]*)\}/g, '$1')
        .replace(/\\ge\b/g, '≥')
        .replace(/\\le\b/g, '≤')
        .replace(/\$([^$\n]{1,80})\$/g, '$1');
      s = _replaceMdLinksAndImagesLinear(s, taskId, stash);
      s = s
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

      s = s.replace(/\u0000HTML(\d+)\u0000/g, (_, i) => htmlSlots[Number(i)] || '');
      s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codeSlots[Number(i)] || '');
      return s;
    }

    function renderLiteMarkdown(rawText, ctx = null) {
      const taskId = ctx?.taskId || FOCUSED_TASK_ID || '';
      const src = String(rawText ?? '');
      if (!src.trim()) return '';
      const cacheKey = `${taskId}\0${FIG_PROOF_FILTER}\0${src.length}\0${_fastStrHash(src)}`;
      const cached = MD_RENDER_CACHE.get(cacheKey);
      if (cached !== undefined) return cached;
      const lines = src.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let inCode = false;
      let codeBuf = [];
      let tableBuf = [];
      let listBuf = [];

      const flushList = () => {
        if (listBuf.length) {
          out.push('<ul>' + listBuf.map(x => `<li>${x}</li>`).join('') + '</ul>');
          listBuf = [];
        }
      };
      const flushTable = () => {
        if (!tableBuf.length) return;
        const rows = tableBuf.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => formatInlineMd(esc(c.trim()), taskId)));
        tableBuf = [];
        if (rows.length >= 2 && rows[1].every(c => /^[-:\s]+$/.test(c))) {
          const head = '<tr>' + rows[0].map(c => `<th>${c}</th>`).join('') + '</tr>';
          const body = rows.slice(2).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
          out.push(`<div class="md-table-wrap"><table class="md-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`);
        } else {
          out.push(rows.map(r => `<p>${r.join(' | ')}</p>`).join(''));
        }
      };

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          flushList(); flushTable();
          if (!inCode) { inCode = true; codeBuf = []; }
          else { out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`); inCode = false; }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }

        if (/^\s*\|.+\|\s*$/.test(line)) {
          flushList();
          tableBuf.push(line.trim());
          continue;
        } else {
          flushTable();
        }

        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
          flushList();
          out.push('<hr>');
          continue;
        }
        const hm = line.match(/^(#{1,4})\s+(.+)$/);
        if (hm) {
          flushList();
          const lvl = hm[1].length;
          out.push(`<h${lvl}>${formatInlineMd(esc(hm[2]), taskId)}</h${lvl}>`);
          continue;
        }
        const lm = line.match(/^\s*[-*]\s+(.+)$/);
        if (lm) {
          listBuf.push(formatInlineMd(esc(lm[1]), taskId));
          continue;
        } else {
          flushList();
        }
        if (!line.trim()) continue;
        out.push(`<p>${formatInlineMd(esc(line), taskId)}</p>`);
      }
      if (inCode) out.push(`<pre><code>${esc(codeBuf.join('\n'))}</code></pre>`);
      flushList(); flushTable();
      const rendered = `<div class="md-body">${out.join('')}</div>`;
      if (MD_RENDER_CACHE.size >= 180) {
        const firstKey = MD_RENDER_CACHE.keys().next().value;
        MD_RENDER_CACHE.delete(firstKey);
      }
      MD_RENDER_CACHE.set(cacheKey, rendered);
      return rendered;
    }

    function ensureComposerDefaults(st) {
      const ids = getRunnableIds(st);
      if (!ids.length) return;
      CMP.rtParticipants = CMP.rtParticipants.filter(x => ids.includes(x));
      if (!CMP.initialized || CMP.rtParticipants.length < 2) {
        const defaults = ['agy_gemini', 'codex_author', 'agy_claude_reviewer'].filter(x => ids.includes(x));
        CMP.rtParticipants = defaults.length >= 2 ? defaults : ids.slice(0, Math.min(3, ids.length));
      }
      if (!CMP.rtHost || !ids.includes(CMP.rtHost)) CMP.rtHost = CMP.rtParticipants[0] || ids[0];
      if (!CMP.chiefId || !ids.includes(CMP.chiefId)) CMP.chiefId = ids.includes('agy_gemini') ? 'agy_gemini' : ids[0];
      if (!CMP.soloId || !ids.includes(CMP.soloId)) CMP.soloId = ids.includes('codex_author') ? 'codex_author' : ids[0];
      if (!CMP.dagStages.length) {
        applyDagPreset('parallel_research_review', false);
      } else {
        CMP.dagStages.forEach(stg => stg.forEach(n => {

    function setRtParticipantCount(rawCount) {
      if (!STATE) return;
      const ids = getRunnableIds(STATE);
      if (ids.length < 2) return;
      const n = Math.max(2, Math.min(ids.length, parseInt(rawCount, 10) || 2));
      const ms = STATE.members || {};
      const agyPool = ids.filter(id => ms[id].client === 'antigravity');
      const codexPool = ids.filter(id => ms[id].client === 'codex');

      // Keep current host first, then interleave AGY & Codex for cross-engine diversity!
      const picked = [];
      const add = (id) => { if (id && !picked.includes(id)) picked.push(id); };
      if (CMP.rtHost && ids.includes(CMP.rtHost)) add(CMP.rtHost);
      // Preserve currently selected specialists up to n when shrinking, or expand with balanced interleaving
      if (n <= CMP.rtParticipants.length) {
        for (const id of CMP.rtParticipants) {
          if (picked.length >= n) break;
          add(id);
        }
      } else {
        for (const id of CMP.rtParticipants) add(id);
        let ai = 0, ci = 0;
        while (picked.length < n && (ai < agyPool.length || ci < codexPool.length)) {
          if (ai < agyPool.length) add(agyPool[ai++]);
          if (picked.length >= n) break;
          if (ci < codexPool.length) add(codexPool[ci++]);
        }
      }
      for (const id of ids) {
        if (picked.length >= n) break;
        add(id);
      }
      CMP.rtParticipants = picked.slice(0, n);
      if (!CMP.rtParticipants.includes(CMP.rtHost)) CMP.rtHost = CMP.rtParticipants[0];
      renderComposerStudio();
    }

              prompt: '作为科研绘图架构与视觉质检官，按 Nature/Science 投稿规范逐项核查版面尺寸 (89mm/183mm)、≥6pt 字号、Okabe-Ito/viridis 色盲友好、图数一致性 (对照原 CSV p_adj/组别标签) 与 figure_manifest.json 完整性，分 BLOCKING 与 OBSERVATION 输出修正清单。'
            },
            {
              member_id: pick('agy_claude_reviewer', 2),
              step_type: 'discussion',
              prompt: '作为顶刊方法学与代码审稿官，审计统计检验选择、多重检验校正口径、防数据泄漏与可复现边界，并核查图注统计声明是否与计算脚本完全一致。'
            }
          ],
          [
            {
              member_id: pick('codex_author', 3),
              step_type: 'synthesis',
              prompt: '吸收视觉质检官与方法学审稿官的 BLOCKING 修正意见，更新绘图/统计脚本并重跑生成最终出版级图件，汇总交付可复现清单、图注与验收结论。'
            }
          ]
        ];
        CMP.playbooks = ['publication_figures_schematics', 'execution_hygiene_code'];
        CMP.figContractOpen = true;
        CMP.figContract.enabled = true;
      } else if (presetName === 'openscience_sources_audit') {
        CMP.dagStages = [
          [
            {
              member_id: pick('codex_reviewer', 0),
              step_type: 'discussion',
              prompt: '执行 OpenScience sources + citations 协议：将目标文本拆解为可独立判定真伪的原子声明，逐条核对工作区 CSV/代码/文献 DOI，按 SUPPORTED / PARTIAL / UNSUPPORTED / CONTRADICTED 打分。'
            },
            {
              member_id: pick('agy_claude_reviewer', 1),
              step_type: 'discussion',
              prompt: '独立并行开展顶刊方法学与统计口径复核，重点核查是否存在未报告校正 P 值、样本量漂移、过度外推或遗漏竞争性解释。'
            }
          ],
          [
            {
              member_id: pick('agy_gemini', 2),
              step_type: 'synthesis',
              prompt: '综合双端原子溯源表与方法学复核意见，输出《原子声明核证台账》与最小无幻觉修订稿。'
            }
          ]
        ];
        CMP.playbooks = ['sources_citations_audit', 'peer_review_submission'];
      } else if (presetName === 'parallel_research_review') {
        CMP.dagStages = [
          [
            { member_id: pick('codex_author', 0), step_type: 'discussion', prompt: '' },
            { member_id: pick('agy_gemini', 1), step_type: 'discussion', prompt: '' }
          ],
          [{ member_id: pick('codex_author_2', 0), step_type: 'synthesis', prompt: '' }],
          [{ member_id: pick('agy_claude_reviewer', 2), step_type: 'review', prompt: '' }]
        ];
      } else if (presetName === 'impl_review_loop') {
        CMP.dagStages = [
          [{ member_id: pick('codex_author', 0), step_type: 'execution', prompt: '' }],
          [{ member_id: pick('agy_claude_reviewer', 1), step_type: 'review', prompt: '' }]
        ];
      } else if (presetName === 'impl_doc_parallel') {
        CMP.dagStages = [
          [{ member_id: pick('codex_author', 0), step_type: 'execution', prompt: '' }],
          [
            { member_id: pick('agy_claude_reviewer', 1), step_type: 'discussion', prompt: '' },
            { member_id: pick('codex_documenter', 2), step_type: 'synthesis', prompt: '' }
          ]
        ];
      }
      if (showMsg) toast(LANG === 'en' ? 'Pipeline preset loaded' : '已载入流水线预设');
      renderComposerStudio();
    }

    function addDagStage() {
      const ids = getRunnableIds();
      if (CMP.dagStages.length >= 10) return;
      CMP.dagStages.push([{ member_id: ids[0] || 'codex_author', step_type: 'execution', prompt: '' }]);
      renderComposerStudio();
    }
    function removeDagStage(sIdx) {
      if (CMP.dagStages.length <= 1) return;
      CMP.dagStages.splice(sIdx, 1);
      renderComposerStudio();
    }
    function addDagParallelNode(sIdx) {
      const ids = getRunnableIds();
      const stg = CMP.dagStages[sIdx];
      if (!stg || stg.length >= 10) return;
      const used = stg.map(x => x.member_id);
      stg.push({ member_id: ids.find(x => !used.includes(x)) || ids[0], step_type: 'discussion', prompt: '' });
      renderComposerStudio();
    }
    function removeDagNode(sIdx, nIdx) {
      const stg = CMP.dagStages[sIdx];
      if (!stg) return;
      stg.splice(nIdx, 1);
      if (!stg.length) {
        if (CMP.dagStages.length > 1) CMP.dagStages.splice(sIdx, 1);
        else stg.push({ member_id: getRunnableIds()[0] || 'codex_author', step_type: 'execution', prompt: '' });
      }
      renderComposerStudio();
    }
    function updateDagNode(sIdx, nIdx, field, val) {
      if (CMP.dagStages[sIdx]?.[nIdx]) {
        CMP.dagStages[sIdx][nIdx][field] = val;
        if (field !== 'prompt') renderComposerStudio();
      }
    }

    function renderComposerStudio() {
      const box = document.getElementById('composer-mode-studio');
      if (!box || !STATE) return;
      ensureComposerDefaults(STATE);
      const ms = STATE.members || {};
      const ids = getRunnableIds(STATE);

      const memberOptions = (selectedId) => ids.map(id => {
        const m = ms[id];
        return `<option value="${esc(id)}" ${id === selectedId ? 'selected' : ''}>${esc(formatMemberOptionLabel(m, id))}</option>`;
      }).join('');

      if (CMP.mode === 'roundtable') {
        const presetsHtml = (CATALOG.squad_presets || []).map(p => `
          <button class="preset-chip" onclick="applySquadPreset('${esc(p.id)}')" title="${esc(LANG === 'en' ? p.desc_en : p.desc_zh)}">
            ${svgIcon('users', 12)}<span class="tx">${esc(LANG === 'en' ? p.name_en : p.name_zh)}</span>
          </button>
        `).join('');

        const selEngines = new Set(CMP.rtParticipants.map(id => ms[id]?.client).filter(Boolean));
        const hasCrossEngine = selEngines.size >= 2;
        const healthTag = hasCrossEngine
          ? `<span class="tag tag-ok"><span class="dot dot-ok"></span>${esc(t('squadHealthOk'))}</span>`

        const curTaskSb = document.getElementById('cmp-sandbox')?.value || 'read-only';
        const effAllowWrites = Boolean(CMP.rtAllowWrites ?? STATE?.settings?.roundtable_allow_member_writes);
        const chips = ids.map(id => {
          const m = ms[id];
          const sel = CMP.rtParticipants.includes(id);
          const isHost = id === CMP.rtHost;
          const spec = m.specialty || '';
          const specShort = spec ? spec.split('·')[0].trim() : m.model;
          let seatSbHtml = '';
          if (sel && curTaskSb !== 'read-only') {
            const effSeatSb = getEffectiveRtSeatSandbox(id, curTaskSb, effAllowWrites);
            const sbCls = effSeatSb === 'danger-full-access' ? 'danger' : (effSeatSb === 'workspace-write' ? 'rw' : '');
            const sbIcon = effSeatSb === 'danger-full-access' ? '⚠️' : (effSeatSb === 'workspace-write' ? '✏️' : '🔒');
            seatSbHtml = `<button type="button" class="seat-sb-btn ${sbCls}" onclick="event.stopPropagation(); cycleRtSeatSandbox('${esc(id)}')" title="${esc(t('sbSeatTip', { sb: effSeatSb }))}">${sbIcon}</button>`;

              <div class="seat-pill-main">
                <span class="seat-pill-name" style="font-weight:${sel ? '600' : '500'};">${esc(m.name || id)}</span>
                <span class="seat-pill-spec">${esc(specShort)}</span>
              </div>
              <div class="seat-pill-actions">
                ${seatSbHtml}
                ${sel && isHost ? `<span class="host-badge">${svgIcon('crown', 11)}${esc(t('hostTag'))}</span>` : ''}
                ${sel && !isHost ? `<button type="button" class="host-set-btn" onclick="event.stopPropagation(); setRtHost('${esc(id)}')">${esc(t('setHost'))}</button>` : ''}
                <button type="button" class="pill-edit-btn" onclick="event.stopPropagation(); openSwitchMemberModal('${esc(id)}')" title="${esc(t('editMember'))}" aria-label="${esc(t('editMember'))}">${svgIcon('edit', 11)}</button>
              </div>
            </div>
          `;
        }).join('');

        const flowKey = CMP.rtRounds > 1
          ? (CMP.rtHostOpening ? 'flowOpenMulti' : 'flowFastMulti')
          : (CMP.rtHostOpening ? 'flowOpenOne' : 'flowFastOne');

        const curConc = STATE.max_concurrency || 3;
        const quickCounts = [2, 3, 4, 5, 6].filter(n => n < ids.length);
        const countChipsHtml = `
          <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:8px;">
            <span style="font-size:11.5px; color:var(--text-3); white-space:nowrap;">${esc(t('rtQuickCount'))}:</span>
            ${quickCounts.map(n => `
              <button class="qt-chip ${CMP.rtParticipants.length === n ? 'active' : ''}" onclick="setRtParticipantCount(${n})">${n}${LANG === 'en' ? '' : '人'}</button>
            `).join('')}
            <button class="qt-chip ${CMP.rtParticipants.length === ids.length ? 'active' : ''}" onclick="setRtParticipantCount(${ids.length})">${esc(t('rtAllCount', { n: ids.length }))}</button>
            <input type="number" min="2" max="${ids.length}" value="${CMP.rtParticipants.length}"
              style="width:54px; min-height:24px; padding:2px 6px; font-size:11.5px;"
              onchange="setRtParticipantCount(this.value)" title="${esc(t('rtQuickCount'))}" aria-label="${esc(t('rtQuickCount'))}">
          </div>
        `;

        box.innerHTML = `
          <div class="setup-strip">
            ${presetsHtml ? `<div class="preset-strip">${presetsHtml}</div>` : ''}
            <div class="setup-controls">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span style="font-size:12px; font-weight:600; color:var(--text);">${esc(t('rtParticipants', { n: CMP.rtParticipants.length }))}</span>
                ${healthTag}
              </div>
              <div style="display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; max-width:100%;">
                <div class="ctrl-inline-field">
                  <span>${esc(t('rtHost'))}</span>
                  <select onchange="setRtHost(this.value)">${memberOptions(CMP.rtHost)}</select>
                </div>
                <div class="ctrl-inline-field">
                  <span>${esc(t('rtRounds'))}</span>
                  <select onchange="CMP.rtRounds=parseInt(this.value,10); renderComposerStudio();" style="max-width:160px;">
                    <option value="1" ${CMP.rtRounds === 1 ? 'selected' : ''}>${esc(t('round1'))}</option>
                    <option value="2" ${CMP.rtRounds === 2 ? 'selected' : ''}>${esc(t('round2'))}</option>
                    <option value="3" ${CMP.rtRounds === 3 ? 'selected' : ''}>${esc(t('round3'))}</option>
                  </select>
                </div>
                <div class="ctrl-inline-field" title="${esc(t('maxConc'))}">
                  <span>${esc(t('maxConcInline'))}</span>
                  <select onchange="setQuickConcurrency(this.value)" style="width:66px; max-width:74px;">
                    ${[1,2,3,4,5,6,8,10,12].map(n => `<option value="${n}" ${curConc === n ? 'selected' : ''}>${n}</option>`).join('')}
                  </select>
                </div>
                <label style="display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; font-size:12px; color:var(--text-2); white-space:nowrap;">
                  <input type="checkbox" style="width:auto;" ${!CMP.rtHostOpening ? 'checked' : ''} onchange="CMP.rtHostOpening=!this.checked; renderComposerStudio();">
                  <span>${esc(t('rtFastR1'))}</span>
                </label>
                <label style="display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; font-size:12px; color:var(--text-2); white-space:nowrap;">
                  <input type="checkbox" style="width:auto;" ${CMP.rtAnonymousPeer ? 'checked' : ''} onchange="CMP.rtAnonymousPeer=this.checked; renderComposerStudio();">
                  <span>${esc(t('rtAnonPeer'))}</span>
                </label>
                ${(curTaskSb !== 'read-only') ? `
                  <label style="display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; font-size:12px; color:${curTaskSb === 'danger-full-access' ? 'var(--err)' : 'var(--accent)'}; white-space:nowrap;">
                    <input type="checkbox" id="cmp-rt-allow-writes" style="width:auto;" ${effAllowWrites ? 'checked' : ''} onchange="CMP.rtAllowWrites=this.checked; renderComposerStudio();">
                    <span>${esc(t('rtAllowWrites'))}</span>
                  </label>
                ` : ''}
              </div>
            </div>
            ${countChipsHtml}
            <div class="seat-picks">${chips}</div>
            <div class="flow-note">
              <span>${esc(t(flowKey, { n: CMP.rtParticipants.length, r: CMP.rtRounds }))}</span>
            </div>
          </div>
        `;
      } else if (CMP.mode === 'chief_dispatch') {
        const standby = ids.filter(x => x !== CMP.chiefId).map(id => {
          const m = ms[id];
          return `<span class="tag"><span class="tx">${esc(m.name || id)}</span></span>`;
        }).join('');
        const chiefCapOpts = [
          `<option value="" ${!CMP.chiefMaxMembers ? 'selected' : ''}>${esc(t('chiefMaxAuto'))}</option>`,
          ...[2,3,4,5,6,8,10,12].map(n => `<option value="${n}" ${CMP.chiefMaxMembers === n ? 'selected' : ''}>${n}${LANG === 'en' ? '' : ' 人'}</option>`)
        ].join('');
        box.innerHTML = `
          <div class="setup-strip">
            <div class="setup-controls" style="margin-bottom:8px;">
              <div style="display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; max-width:100%;">
                <div class="ctrl-inline-field" style="font-weight:600; color:var(--text);">
                  <span>${esc(t('chiefCommander'))}</span>
                  <select onchange="CMP.chiefId=this.value; renderComposerStudio();">${memberOptions(CMP.chiefId)}</select>
                </div>
                <div class="ctrl-inline-field">
                  <span>${esc(t('chiefMaxLbl'))}</span>
                  <select style="max-width:130px;" onchange="CMP.chiefMaxMembers=this.value ? parseInt(this.value,10) : null;">${chiefCapOpts}</select>
                </div>
              </div>
              <span style="font-size:12px; color:var(--text-2);">${esc(t('chiefFlow', { n: Math.max(0, ids.length - 1) }))}</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">${standby}</div>
          </div>
        `;
      } else if (CMP.mode === 'custom_dag') {
        const cols = CMP.dagStages.map((stg, sIdx) => {
          const nodes = stg.map((n, nIdx) => `
            <div class="ws-node">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span style="font-size:11.5px; font-weight:600; color:var(--text-2);">${esc(t('stationN', { s: sIdx + 1, n: nIdx + 1 }))}</span>
                <button class="btn btn-ghost btn-icon" style="width:22px; min-height:22px; height:22px;" onclick="removeDagNode(${sIdx}, ${nIdx})" aria-label="Remove">${svgIcon('x', 12)}</button>
              </div>
              <select onchange="updateDagNode(${sIdx}, ${nIdx}, 'member_id', this.value)" title="${esc(formatMemberOptionLabel(ms[n.member_id], n.member_id))}">${memberOptions(n.member_id)}</select>
              <select onchange="updateDagNode(${sIdx}, ${nIdx}, 'step_type', this.value)">
                <option value="execution" ${n.step_type === 'execution' ? 'selected' : ''}>${esc(t('stepExec'))}</option>
                <option value="discussion" ${n.step_type === 'discussion' ? 'selected' : ''}>${esc(t('stepDisc'))}</option>
                <option value="review" ${n.step_type === 'review' ? 'selected' : ''}>${esc(t('stepRev'))}</option>
                <option value="synthesis" ${n.step_type === 'synthesis' ? 'selected' : ''}>${esc(t('stepSynth'))}</option>
              </select>
              <input type="text" placeholder="${esc(t('stationNotePh'))}" value="${esc(n.prompt || '')}" oninput="updateDagNode(${sIdx}, ${nIdx}, 'prompt', this.value)">
            </div>
          `).join('');
          return `
            ${sIdx > 0 ? '<div class="stage-arrow">→</div>' : ''}
            <div class="stage-col">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <span style="font-size:12px; font-weight:600; white-space:nowrap;">${esc(t('stageN', { n: sIdx + 1 }))} <span style="color:var(--text-3); font-weight:400;">· ${esc(stg.length > 1 ? t('parallelN', { n: stg.length }) : t('serial'))}</span></span>
                <button class="btn btn-ghost btn-xs" onclick="removeDagStage(${sIdx})">${esc(t('removeStage'))}</button>
              </div>
              ${nodes}
              <button class="btn btn-sec btn-sm" onclick="addDagParallelNode(${sIdx})">${svgIcon('plus', 12)} ${esc(t('addParallel'))}</button>
            </div>
          `;
        }).join('');

        box.innerHTML = `
          <div class="setup-strip">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
              <div style="display:flex; gap:6px; flex-wrap:wrap; max-width:100%;">
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('openscience_4stage')">${esc(t('dagPresetOpenScience'))}</button>
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('openscience_code_figure')">${esc(t('dagPresetCodePlot'))}</button>
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('openscience_sources_audit')">${esc(t('dagPresetSourcesAudit'))}</button>
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('parallel_research_review')">${esc(t('dagPreset1'))}</button>
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('impl_review_loop')">${esc(t('dagPreset2'))}</button>
                <button class="btn btn-sec btn-sm btn-wrap" onclick="applyDagPreset('impl_doc_parallel')">${esc(t('dagPreset3'))}</button>
              </div>
              <button class="btn btn-sec btn-sm" onclick="addDagStage()">${svgIcon('plus', 12)} ${esc(t('addStage'))}</button>
            </div>
            <div class="stages-track">${cols}</div>
          </div>
        `;
      } else {
        const soloPills = ids.map(id => {
          const m = ms[id];
          const sel = id === CMP.soloId;
          const spec = m.specialty || m.model;
          return `
            <div class="seat-pill ${sel ? 'selected' : ''}" onclick="CMP.soloId='${esc(id)}'; renderComposerStudio();" title="${esc(m.specialty || m.model)}">
              ${avatarHtml(id, m, { sm: true })}
              <div class="seat-pill-main">
                <span class="seat-pill-name" style="font-weight:${sel ? '600' : '500'};">${esc(m.name || id)}</span>
                <span class="seat-pill-spec">${esc(spec.split('·')[0].trim())}</span>
              </div>
              <div class="seat-pill-actions">
                <button type="button" class="pill-edit-btn" onclick="event.stopPropagation(); openSwitchMemberModal('${esc(id)}')" title="${esc(t('editMember'))}" aria-label="${esc(t('editMember'))}">${svgIcon('edit', 11)}</button>
              </div>
            </div>
          `;
        }).join('');
        box.innerHTML = `
          <div class="setup-strip">
            <div style="font-size:12px; font-weight:600; color:var(--text); margin-bottom:8px;">${esc(t('soloSelect'))}</div>
            <div class="seat-picks">${soloPills}</div>
          </div>
        `;
      }
      renderPlaybooksBar();
      renderFigureContractStrip();
    }

    function togglePlaybook(pid) {
      if (!pid) {
        CMP.playbooks = [];
      } else {
        const idx = CMP.playbooks.indexOf(pid);
        if (idx >= 0) CMP.playbooks.splice(idx, 1);
        else CMP.playbooks.push(pid);
      }
      if (CMP.playbooks.includes('publication_figures_schematics')) {
        CMP.figContractOpen = true;
        CMP.figContract.enabled = true;
      }
      renderPlaybooksBar();
      renderFigureContractStrip();
    }

    function toggleFigureContractStrip() {
      CMP.figContractOpen = !CMP.figContractOpen;
      CMP.figContract.enabled = CMP.figContractOpen;
      renderPlaybooksBar();
      renderFigureContractStrip();
    }

    function renderPlaybooksBar() {
      const bar = document.getElementById('composer-playbooks-bar');
      if (!bar) return;
      const pbs = CATALOG.openscience_playbooks || [];
      if (!pbs.length) { bar.innerHTML = ''; return; }
      const isAuto = !CMP.playbooks.length;
      bar.innerHTML = `
        <span style="font-size:11px; color:var(--text-3); font-weight:600; margin-right:2px; white-space:nowrap;">${esc(t('osPlaybooksLbl'))}:</span>
        <button class="qt-chip ${isAuto ? 'active' : ''}" onclick="togglePlaybook('')">${esc(t('osAutoChip'))}</button>
        ${pbs.map(pb => {
          const active = CMP.playbooks.includes(pb.id);
          return `<button class="qt-chip ${active ? 'active' : ''}" onclick="togglePlaybook('${esc(pb.id)}')" title="${esc((pb.source_skills || []).join(' + '))}"><span class="tx">${esc(LANG === 'en' ? pb.name_en : pb.name_zh)}</span></button>`;
        }).join('')}
        <button class="qt-chip ${CMP.figContractOpen ? 'active' : ''}" onclick="toggleFigureContractStrip()">${svgIcon('image', 11)}<span>${esc(t('figContractToggle'))}</span></button>
      `;
    }

    function renderFigureContractStrip() {
      const box = document.getElementById('composer-figure-contract');
      if (!box) return;
      if (!CMP.figContractOpen) { box.innerHTML = ''; return; }
      const fc = CMP.figContract;
      const pyAvail = PLOT_BACKENDS ? Boolean(PLOT_BACKENDS.python?.available) : true;
      const rAvail = PLOT_BACKENDS ? Boolean(PLOT_BACKENDS.r?.available) : false;
      const rErr = PLOT_BACKENDS?.r?.error || 'Rscript unavailable';
      if (fc.backend === 'r' && !rAvail) fc.backend = 'python';
      const curSb = document.getElementById('cmp-sandbox')?.value || 'read-only';
      const jOpts = JOURNAL_WIDTH_PRESETS.map(jp =>
        `<option value="${esc(jp.id)}" ${fc.journalPreset === jp.id ? 'selected' : ''}>${esc(LANG === 'en' ? jp.label_en : jp.label_zh)}</option>`
      ).join('');
      box.innerHTML = `
        <div class="fig-contract-strip">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px;">

    function applySquadPreset(presetId) {
      const p = (CATALOG.squad_presets || []).find(x => x.id === presetId);
      if (!p || !STATE) return;
      const ms = STATE.members || {};
      const ids = getRunnableIds(STATE);
      if (ids.length < 2) return;

      const agyIds = ids.filter(id => ms[id].client === 'antigravity');
      const codexIds = ids.filter(id => ms[id].client === 'codex');
      const picked = [];
      const addUniq = (id) => { if (id && !picked.includes(id)) picked.push(id); };

      // Prefer heterogeneous cross-engine pairing + tag matching!
      const findBest = (pool, tagPref) => pool.find(id => !picked.includes(id) && (ms[id].tags || []).includes(tagPref))
        || pool.find(id => !picked.includes(id) && ms[id].role === tagPref)
        || pool.find(id => !picked.includes(id));

      if (p.id === 'openscience_discovery') {
        addUniq(findBest(agyIds, 'hypothesis') || findBest(agyIds, 'openscience') || agyIds[0]);
        addUniq(findBest(agyIds, 'review') || agyIds[1]);
        addUniq(findBest(codexIds, 'fact_check') || findBest(codexIds, 'implementation') || codexIds[0]);
        addUniq(findBest(codexIds, 'review') || findBest(agyIds, 'scout') || codexIds[1]);
      } else if (p.id === 'scientific_coding_plotting') {
        addUniq(ids.includes('codex_author_2') ? 'codex_author_2' : (findBest(codexIds, 'plotting') || findBest(codexIds, 'implementation') || codexIds[0]));
        addUniq(ids.includes('agy_carbon_plotter') ? 'agy_carbon_plotter' : (findBest(agyIds, 'visual_qa') || findBest(agyIds, 'plotting') || agyIds[0]));
        addUniq(ids.includes('agy_claude_reviewer') ? 'agy_claude_reviewer' : (findBest(agyIds, 'review') || agyIds[1]));
        addUniq(ids.includes('codex_author') ? 'codex_author' : (findBest(codexIds, 'implementation') || findBest(agyIds, 'openscience')));
      } else if (p.id === 'openscience_autoresearch') {
        addUniq(ids.includes('codex_author') ? 'codex_author' : (findBest(codexIds, 'implementation') || codexIds[0]));
        addUniq(ids.includes('codex_author_2') ? 'codex_author_2' : (findBest(codexIds, 'plotting') || codexIds[1]));
        addUniq(ids.includes('agy_gemini') ? 'agy_gemini' : (findBest(agyIds, 'openscience') || agyIds[0]));
        addUniq(ids.includes('agy_claude_reviewer') ? 'agy_claude_reviewer' : (findBest(agyIds, 'review') || agyIds[1]));
      } else if (p.id === 'fast_cross_check') {
        addUniq(findBest(agyIds, 'implementation') || agyIds[0]);
        addUniq(findBest(codexIds, 'review') || findBest(codexIds, 'implementation') || codexIds[0]);
      } else if (p.id === 'research_submission') {
        addUniq(findBest(agyIds, 'research') || agyIds[0]);
        addUniq(findBest(agyIds, 'review') || findBest(codexIds, 'review'));
        addUniq(findBest(codexIds, 'fact_check') || findBest(codexIds, 'writing') || codexIds[0]);
      } else if (p.id === 'code_arch_audit') {
        addUniq(findBest(agyIds, 'engineering') || agyIds[0]);
        addUniq(findBest(codexIds, 'implementation') || codexIds[0]);
        addUniq(findBest(codexIds, 'review') || findBest(agyIds, 'review'));
      } else {
        // dual_redteam
        addUniq(findBest(agyIds, 'implementation') || agyIds[0]);
        addUniq(findBest(codexIds, 'fact_check') || findBest(codexIds, 'review') || codexIds[0]);
        addUniq(findBest(agyIds, 'review') || findBest(codexIds, 'implementation'));
      }
      for (const id of ids) {
        if (picked.length >= Math.min(p.target_count || 3, ids.length)) break;
        addUniq(id);
      }

      CMP.mode = p.mode || 'roundtable';
      CMP.rtParticipants = picked.slice(0, p.target_count || 3);
      CMP.rtHost = CMP.rtParticipants[0];
      CMP.rtRounds = p.rounds || 2;
      CMP.rtHostOpening = false;
      CMP.squadPreset = p.id || '';
      if (Array.isArray(p.playbooks) && p.playbooks.length) {
        CMP.playbooks = p.playbooks.slice();
      }
      if (p.id === 'scientific_coding_plotting' || (CMP.playbooks || []).includes('publication_figures_schematics')) {
        CMP.figContractOpen = true;
        CMP.figContract.enabled = true;
      }
      selectComposerMode(CMP.mode);
      toast(t('presetApplied', { name: LANG === 'en' ? p.name_en : p.name_zh }));
    }

    function _hasActiveWorkload(st = STATE) {
      if (!st) return false;
      const ms = st.members || {};
      if (Object.values(ms).some(m => m && m.status === 'working')) return true;
      return (st.tasks || []).some(t => t && (t.status === 'running' || t.status === 'queued'));
    }

    function scheduleNextPoll() {
      if (POLL_TIMER) { clearTimeout(POLL_TIMER); POLL_TIMER = null; }
      if (document.hidden) return;
      const delay = _hasActiveWorkload(STATE) ? 1000 : 3000;
      POLL_TIMER = setTimeout(async () => {
        POLL_TIMER = null;
        if (!document.hidden) await refreshState(false);
        scheduleNextPoll();
      }, delay);
    }

    async function refreshState(force = false) {
      if (POLL_IN_FLIGHT && !force) return;
      POLL_IN_FLIGHT = true;
      try {
        const params = new URLSearchParams({ slim: '1' });
        if (!force && LAST_STATE_REV > 0) {
          params.set('since_rev', String(LAST_STATE_REV));
        }
        const resp = await fetch(`/api/state?${params.toString()}`, { cache: 'no-store' });
        // Detect hot-upgraded local server on already-open older browser tabs!
        const hdrSrvRev = Number(resp.headers.get('X-Server-Rev') || 0);
        const hdrAppVer = resp.headers.get('X-App-Version') || '';
        if (hdrSrvRev > CLIENT_SERVER_REV && hdrSrvRev > LOCAL_UPGRADE_NOTIFIED_REV) {
          LOCAL_UPGRADE_NOTIFIED_REV = hdrSrvRev;
          onLocalServerUpgraded(hdrAppVer || CLIENT_APP_VERSION, hdrSrvRev);
        }
        if (resp.status === 304) {
          return;
        }
        const st = await resp.json();
        if (!resp.ok || st.ok === false) throw new Error(st.error || `HTTP ${resp.status}`);
        STATE = st;
        LAST_STATE_REV = Number(st.state_rev || 0);
        LAST_FOCUSED_IN_SLIM = String(st.focused_task_id || '');
        const h = `${LAST_STATE_REV}|${LAST_FOCUSED_IN_SLIM}|${HISTORY_SCOPE}|${JSON.stringify(MANUAL_STAGE_TABS)}|${LANG}|${CURRENT_VIEW}`;
        if (force || h !== LAST_HASH) {
          LAST_HASH = h;
          renderAll(st, { forceFullStage: force });
        }
      } catch (e) { console.error(e); }
      finally { POLL_IN_FLIGHT = false; }
    }

          cmpSbEl.value = defSb;

      }
      renderComposerSandboxBanner();

      if (memberSig !== LAST_MEMBER_SIG) {
        LAST_MEMBER_SIG = memberSig;
        renderComposerStudio();

      const rSel = document.getElementById('add-m-role');
      if (rSel) {
        const prevR = rSel.value;

        }

      const projUnarchived = getProjUnarchived(st);

      if (CURRENT_VIEW === 'members') renderMembersView(st);
      if (UTILS_OPEN) renderUtilsPopover();
      restoreOpenDetails();

      // Fast in-place single-article DOM patch: zero HTTP fetch, zero scroll jump!
      const artEl = document.querySelector(`article.chat-entry[data-msg-id="${CSS.escape(msgId)}"]`);
      const task = (STATE?.tasks || []).find(x => x.id === FOCUSED_TASK_ID);
      const cm = (task?.chat_room || []).find(m => m.id === msgId);
      if (artEl && task && cm) {
        const rawC = cm.content || '';
        const shown = willExpand ? rawC : (safeSliceMarkdown(rawC, 820) + '\n\n*...*');
        const bodyEl = artEl.querySelector('.chat-msg-md');
        const btnEl = artEl.querySelector('.btn-expand-msg');
        if (bodyEl) bodyEl.innerHTML = renderLiteMarkdown(shown, { taskId: task.id });
        if (btnEl) btnEl.textContent = willExpand ? t('collapseText') : t('expandFull', { n: rawC.length });
        return;

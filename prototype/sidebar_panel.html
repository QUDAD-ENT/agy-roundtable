    // ==================== ACTIONS ====================
    async function submitTask() {
      const goal = document.getElementById('cmp-goal').value.trim();
      if (!goal) { toast(t('needGoal'), true); return; }

      const mode = CMP.mode;
      const payload = {
        title: document.getElementById('cmp-title').value.trim(),
        goal,
        dispatch_mode: mode,
        execution_mode: mode,
        workspace_scope: document.getElementById('cmp-subscope').value.trim() || '.',
        sandbox: document.getElementById('cmp-sandbox').value,
        require_manual_ruling: document.getElementById('cmp-manual-rule').checked,
        reuse_member_session: document.getElementById('cmp-reuse-sess').checked
      };
      if (mode === 'roundtable') {
        if (CMP.rtParticipants.length < 2) { toast(t('need2Rt'), true); return; }
        payload.participants = CMP.rtParticipants.slice();
        payload.host_member_id = CMP.rtHost;
        payload.discussion_rounds = CMP.rtRounds;
        payload.enable_host_opening = Boolean(CMP.rtHostOpening);
      } else if (mode === 'chief_dispatch') {
        payload.chief_member_id = CMP.chiefId;
      } else if (mode === 'custom_dag') {
        payload.stages = CMP.dagStages;
      } else {
        payload.target_member_id = CMP.soloId;
      }

      try {
        const r = await api('POST', '/api/tasks', payload);
        document.getElementById('cmp-goal').value = '';
        document.getElementById('cmp-title').value = '';
        COMPOSER_OPEN_OVERRIDE = false;
        toast(t('startedTask', { title: r.task.title }));
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function sendInterjection() {
      if (!FOCUSED_TASK_ID) return;
      const inp = document.getElementById('interject-input');
      const content = inp.value.trim();
      if (!content) return;
      const target = document.getElementById('interject-target').value || null;
      const wake = document.getElementById('interject-wake').checked;
      try {
        inp.value = '';
        await api('POST', '/api/tasks/interject', {
          task_id: FOCUSED_TASK_ID,
          content,
          target_member_id: target,
          trigger_reply: wake
        });
        MANUAL_STAGE_TABS[FOCUSED_TASK_ID] = 'discussion';
        toast(t('sentChat'));
        await refreshState(true);
      } catch (e) {
        inp.value = content;
        toast(t('toastFail', { err: e.message }), true);
      }
    }

    async function focusTask(tid) { await api('POST', '/api/tasks/focus', { task_id: tid }); await refreshState(true); }
    async function archiveSingleTask(tid) {
      await api('POST', '/api/tasks/archive', { task_id: tid, archived: true });
      toast(t('archivedOne'));
      await refreshState(true);
    }
    async function archiveAllCompleted() {
      const r = await api('POST', '/api/tasks/archive_completed', { keep_active: false });
      toast(t('archivedMany', { n: r.archived_count }));
      await refreshState(true);
    }
    async function bringToWorkspace(tid, projPath) {
      if (projPath && normPath(projPath) !== normPath(STATE?.binding?.project_path)) {
        await api('POST', '/api/projects/switch', { project_path: projPath });
      }
      await api('POST', '/api/tasks/focus', { task_id: tid });
      COMPOSER_OPEN_OVERRIDE = false;
      switchView('workspace');
      await refreshState(true);
    }
    async function togglePause() {
      const r = await api('POST', '/api/toggle_pause');
      toast(r.paused ? t('queuePaused') : t('queueRunning'));
      await refreshState(true);
    }
    async function abortTask(tid) { await api('POST', '/api/tasks/abort', { task_id: tid }); await refreshState(true); }
    async function continueTask(tid) { await api('POST', '/api/tasks/continue', { task_id: tid }); await refreshState(true); }
    async function acceptStepPartial(tid, stepIdx) {
      try { await api('POST', '/api/tasks/accept_partial', { task_id: tid, step_index: stepIdx }); await refreshState(true); }
      catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }
    async function retrySingleStep(tid, stepIdx) {
      try { await api('POST', '/api/tasks/retry_step', { task_id: tid, step_index: stepIdx, reset_session: true }); await refreshState(true); }
      catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }
    function copyText(txt) {
      navigator.clipboard.writeText(txt || '').then(() => toast(t('toastCopied')));
    }

    async function openItemNatively(target, reveal = false) {
      try {
        const res = await api('POST', '/api/fs/open_item', { target, task_id: FOCUSED_TASK_ID, reveal });
        if (res.kind === 'web') toast(t('toastOpenedUrl'));
        else if (reveal) toast(t('toastRevealed', { name: res.name || res.opened }));
        else toast(t('toastOpenedFile', { name: res.name || res.opened }));
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function openAnswerLink(rawTarget) {
      if (!rawTarget) return;
      if (/^https?:\/\//i.test(rawTarget)) { await openItemNatively(rawTarget, false); return; }
      try {
        const data = await api('GET', `/api/fs/preview_file?target=${encodeURIComponent(rawTarget)}&task_id=${encodeURIComponent(FOCUSED_TASK_ID || '')}`);
        if (data.preview_type === 'web') { await openItemNatively(data.url, false); return; }
        renderFilePreviewModal(data);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    function renderFilePreviewModal(data) {
      window._CURRENT_PREVIEW_PATH = data.path || '';
      const lineStr = data.start_line ? `${data.start_line}${data.end_line && data.end_line !== data.start_line ? '-' + data.end_line : ''}` : '';
      const lineBadge = lineStr ? `<span class="tag tag-accent">${esc(t('linesBadge', { s: lineStr }))}</span>` : '';

      let bodyHtml = '';
      if (data.preview_type === 'directory') {
        const rows = (data.entries || []).map(en => `
          <div class="fs-item" data-subpath="${esc(en.path)}" onclick="openAnswerLink(this.getAttribute('data-subpath'))">
            <span style="display:flex; align-items:center; gap:7px;">${svgIcon(en.is_dir ? 'folder' : 'file', 14)} <strong>${esc(en.name)}</strong></span>
            <span style="font-size:11.5px; color:var(--text-3);">${en.is_dir ? esc(t('enterSubdir')) : (Math.round(en.size / 1024 * 10) / 10 + ' KB')}</span>
          </div>
        `).join('');
        bodyHtml = `<div class="fs-list" style="max-height:56vh;">${rows || `<div style="padding:18px; text-align:center; color:var(--text-3);">${esc(t('emptyDir'))}</div>`}</div>`;
      } else if (data.preview_type === 'image') {
        bodyHtml = `<div style="text-align:center; background:var(--surface-subtle); padding:14px; border-radius:8px; border:1px solid var(--border);"><img src="${esc(data.raw_url)}" style="max-width:100%; max-height:62vh; border-radius:6px;"></div>`;
      } else if (data.preview_type === 'pdf') {
        bodyHtml = `<iframe src="${esc(data.raw_url)}" style="width:100%; height:64vh; border:1px solid var(--border); border-radius:8px; background:#fff;"></iframe>`;
      } else if (data.preview_type === 'docx') {
        bodyHtml = `
          <div class="notice" style="margin-bottom:12px;"><span>${esc(t('wordPreviewHint'))}</span></div>
          <div class="doc-reading" style="max-height:58vh; overflow-y:auto; padding:4px 8px;">${renderLiteMarkdown(data.content || '')}</div>
        `;
      } else if (data.preview_type === 'markdown') {
        bodyHtml = `<div class="doc-reading" style="max-height:60vh; overflow-y:auto; padding:4px 8px;">${renderLiteMarkdown(data.content || '')}</div>`;
      } else if (data.preview_type === 'table') {
        const rows = data.rows || [];
        if (rows.length) {
          const head = '<tr>' + rows[0].map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
          const body = rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('');
          bodyHtml = `<div class="md-table-wrap" style="max-height:60vh; overflow:auto;"><table class="md-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
        } else {
          bodyHtml = `<div class="empty-state">${esc(t('emptyTable'))}</div>`;
        }
      } else if (data.preview_type === 'text') {
        const lines = String(data.content || '').replace(/\r\n/g, '\n').split('\n');
        const sLine = data.start_line || 0;
        const eLine = data.end_line || sLine;
        const rowsHtml = lines.map((ln, idx) => {
          const lNum = idx + 1;
          const isHl = sLine > 0 && lNum >= sLine && lNum <= eLine;
          return `<div class="src-line ${isHl ? 'hl' : ''}" ${lNum === sLine ? 'id="preview-target-line"' : ''}><span class="src-ln tabular">${lNum}</span><span>${esc(ln)}</span></div>`;
        }).join('');
        bodyHtml = `<div class="src-viewer">${rowsHtml}</div>`;
      } else {
        bodyHtml = `<div class="empty-state"><div style="font-weight:600; color:var(--text); margin-bottom:6px;">${esc(data.name)} (${Math.round((data.size || 0) / 1024)} KB)</div><div>${esc(data.note || '')}</div></div>`;
      }

      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);">
          <div style="min-width:0; flex:1;">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              ${svgIcon('file', 16)}
              <strong style="font-size:15px;">${esc(data.name)}</strong>
              ${lineBadge}
            </div>
            <div style="font-size:11.5px; color:var(--text-3); word-break:break-all; margin-top:4px; font-family:ui-monospace,Consolas,monospace;">${esc(t('filePath'))}: ${esc(data.path)}</div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="openItemNatively(window._CURRENT_PREVIEW_PATH, false)">${svgIcon('external', 13)} ${esc(t('openNative'))}</button>
            <button class="btn btn-sec btn-sm" onclick="openItemNatively(window._CURRENT_PREVIEW_PATH, true)">${svgIcon('folderOpen', 13)} ${esc(t('revealExplorer'))}</button>
            <button class="btn btn-ghost btn-icon" onclick="closeModal()" title="${esc(t('close'))}">${svgIcon('x', 15)}</button>
          </div>
        </div>
        ${bodyHtml}
      `, true);

      if (data.start_line) {
        setTimeout(() => document.getElementById('preview-target-line')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50);
      }
    }

    function ensureQuestionDraft(task) {
      const qs = task?.pending_questions?.questions || [];
      if (!USER_CHOICE_DRAFT[task.id]) {
        const initAns = {};
        qs.forEach((q, idx) => {
          const qid = q.id || `q${idx + 1}`;
          initAns[qid] = {
            selected: q.multi_select ? (q.options?.[0] ? [q.options[0]] : []) : (q.options?.[0] || ''),
            other: ''
          };
        });
        USER_CHOICE_DRAFT[task.id] = { answers: initAns, custom_note: '' };
      }
      return USER_CHOICE_DRAFT[task.id];
    }

    function buildQuestionBlocksHtml(task, idPrefix = 'inline') {
      const qs = task?.pending_questions?.questions || [];
      const draft = ensureQuestionDraft(task);
      return qs.map((q, idx) => {
        const qid = q.id || `q${idx + 1}`;
        const cur = draft.answers[qid] || { selected: q.multi_select ? [] : '', other: '' };
        const optsHtml = (q.options || []).map((opt, oIdx) => {
          const isChecked = q.multi_select ? (Array.isArray(cur.selected) && cur.selected.includes(opt)) : (cur.selected === opt);
          return `
            <label class="q-opt">
              <input type="${q.multi_select ? 'checkbox' : 'radio'}" name="${idPrefix}_q_${esc(task.id)}_${esc(qid)}"
                ${isChecked ? 'checked' : ''}
                onchange="onChoiceChange('${esc(task.id)}', '${esc(qid)}', ${q.multi_select}, ${oIdx}, this.checked)">
              <span>${esc(opt)}</span>
            </label>
          `;
        }).join('');
        return `
          <div class="q-item">
            <div style="font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px;">
              <span>${idx + 1}. ${esc(q.question)}</span>
              <span class="tag">${esc(q.multi_select ? t('multiChoice') : t('singleChoice'))}</span>
            </div>
            ${optsHtml}
            <div style="margin-top:8px;">
              <input type="text" placeholder="${esc(t('qCustomPh'))}" value="${esc(cur.other || '')}" oninput="onChoiceOtherInput('${esc(task.id)}', '${esc(qid)}', this.value)">
            </div>
          </div>
        `;
      }).join('');
    }

    function getQuestionModalKey(task) {
      if (!task || task.status !== 'awaiting_user' || !task.pending_questions?.questions?.length) return '';
      return `${task.id}_${task.pending_questions.ts || task.steps?.length || 0}`;
    }

    function openQuestionPopupModal(taskId) {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      if (!task || task.status !== 'awaiting_user') return;
      DISMISSED_Q_KEYS.delete(getQuestionModalKey(task));
      ACTIVE_Q_MODAL_KEY = '';
      syncQuestionPopupModal(STATE, task, true);
    }

    function dismissQuestionPopupModal(qKey) {
      if (qKey) DISMISSED_Q_KEYS.add(qKey);
      ACTIVE_Q_MODAL_KEY = '';
      document.getElementById('q-modal-backdrop').style.display = 'none';
    }

    function syncQuestionPopupModal(st, focused, forceOpen = false) {
      const backdrop = document.getElementById('q-modal-backdrop');
      const bodyEl = document.getElementById('q-modal-body');
      const qKey = getQuestionModalKey(focused);
      if (!qKey) { ACTIVE_Q_MODAL_KEY = ''; backdrop.style.display = 'none'; return; }
      if (!forceOpen && (!AUTO_POPUP_QUESTIONS || DISMISSED_Q_KEYS.has(qKey))) return;
      if (backdrop.style.display === 'flex' && ACTIVE_Q_MODAL_KEY === qKey) return;

      ACTIVE_Q_MODAL_KEY = qKey;
      const pq = focused.pending_questions;
      const draft = ensureQuestionDraft(focused);
      const askMem = st?.members?.[pq.member_id] || { name: pq.member_id || 'Agent' };
      const contextNote = (focused.steps || [])[pq.step_index ?? 0]?.latest_result_text || '';

      bodyEl.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;">
          <div style="display:flex; gap:10px; align-items:center;">
            ${avatarHtml(pq.member_id, askMem, { speaking: true })}
            <div>
              <div style="font-size:15px; font-weight:600;">${esc(t('qHeader', { name: askMem.name || pq.member_id }))}</div>
              <div style="font-size:12px; color:var(--text-2);">${esc(t('qSub', { title: focused.title }))}</div>
            </div>
          </div>
          <button class="btn btn-sec btn-sm" onclick="dismissQuestionPopupModal('${esc(qKey)}')">${esc(t('qViewContext'))}</button>
        </div>
        ${contextNote ? `<div style="background:var(--surface-subtle); border:1px solid var(--border); border-radius:8px; padding:10px 12px; max-height:140px; overflow-y:auto; margin-bottom:10px; font-size:12.5px;">${renderLiteMarkdown(contextNote)}</div>` : ''}
        ${buildQuestionBlocksHtml(focused, 'modal')}
        <div style="margin-top:10px;">
          <input type="text" placeholder="${esc(t('qGlobalNotePh'))}" value="${esc(draft.custom_note || '')}" oninput="onChoiceGlobalNote('${esc(focused.id)}', this.value)">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-top:14px;">
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm" onclick="submitQuestionAnswers('${esc(focused.id)}', false)">${esc(t('qConfirm'))}</button>
            <button class="btn btn-sec btn-sm" onclick="submitQuestionAnswers('${esc(focused.id)}', true)">${esc(t('qRecommended'))}</button>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="dismissQuestionPopupModal('${esc(qKey)}')">${esc(t('qMinimize'))}</button>
        </div>
      `;
      backdrop.style.display = 'flex';
    }

    function renderQuestionCardHtml(task) {
      const qs = task.pending_questions?.questions || [];
      if (task.status !== 'awaiting_user' || !qs.length) return '';
      const draft = ensureQuestionDraft(task);
      return `
        <div class="q-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <strong style="font-size:13.5px;">${esc(t('qInlineHeader', { n: qs.length }))}</strong>
            <button class="btn btn-sec btn-sm" onclick="openQuestionPopupModal('${esc(task.id)}')">${esc(t('qPopupBtn'))}</button>
          </div>
          ${buildQuestionBlocksHtml(task, 'inline')}
          <div style="margin-top:10px;">
            <input type="text" placeholder="${esc(t('qGlobalNotePh'))}" value="${esc(draft.custom_note || '')}" oninput="onChoiceGlobalNote('${esc(task.id)}', this.value)">
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn btn-sm" onclick="submitQuestionAnswers('${esc(task.id)}', false)">${esc(t('qConfirm'))}</button>
            <button class="btn btn-sec btn-sm" onclick="submitQuestionAnswers('${esc(task.id)}', true)">${esc(t('qRecommended'))}</button>
          </div>
        </div>
      `;
    }

    function onChoiceChange(taskId, qid, isMulti, optIdx, checked) {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      const q = (task?.pending_questions?.questions || []).find((x, i) => (x.id || `q${i + 1}`) === qid);
      if (!q || !USER_CHOICE_DRAFT[taskId]) return;
      const optVal = q.options[optIdx];
      const slot = USER_CHOICE_DRAFT[taskId].answers[qid];
      if (isMulti) {
        const arr = new Set(Array.isArray(slot.selected) ? slot.selected : []);
        if (checked) arr.add(optVal); else arr.delete(optVal);
        slot.selected = Array.from(arr);
      } else {
        slot.selected = optVal;
      }
    }
    function onChoiceOtherInput(taskId, qid, val) { if (USER_CHOICE_DRAFT[taskId]?.answers?.[qid]) USER_CHOICE_DRAFT[taskId].answers[qid].other = val; }
    function onChoiceGlobalNote(taskId, val) { if (USER_CHOICE_DRAFT[taskId]) USER_CHOICE_DRAFT[taskId].custom_note = val; }

    async function submitQuestionAnswers(taskId, useRecommended) {
      const draft = USER_CHOICE_DRAFT[taskId] || { answers: {}, custom_note: '' };
      const answersArr = Object.keys(draft.answers).map(qid => ({
        id: qid, selected: draft.answers[qid].selected, other: draft.answers[qid].other
      }));
      try {
        await api('POST', '/api/tasks/answer', {
          task_id: taskId, answers: answersArr, custom_note: draft.custom_note || '', use_recommended: useRecommended
        });
        delete USER_CHOICE_DRAFT[taskId];
        ACTIVE_Q_MODAL_KEY = '';
        document.getElementById('q-modal-backdrop').style.display = 'none';
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

          role: document.getElementById('add-m-role').value,

        document.getElementById('add-m-name').value = '';
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }
    async function deleteMember(id) {
      try { await api('POST', '/api/members/delete', { id }); await refreshState(true); }
      catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }
    async function saveRole() {
      try {
        await api('POST', '/api/roles', {
          id: document.getElementById('r-id').value.trim(),
          name: document.getElementById('r-name').value.trim(),
          description: document.getElementById('r-desc').value.trim()
        });
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }
    async function saveConcurrency() {
      try {
        await api('POST', '/api/binding', { max_concurrency: parseInt(document.getElementById('cfg-conc').value, 10) });
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    // Global click delegation: answer links + click-outside to close popover
    document.addEventListener('click', (ev) => {
      const linkEl = ev.target.closest && ev.target.closest('a.ans-link');
      if (linkEl) {
        ev.preventDefault();
        openAnswerLink(linkEl.getAttribute('data-ans-link') || '');
        return;
      }
      if (UTILS_OPEN && !ev.target.closest('#utils-popover') && !ev.target.closest('#btn-utils-menu')) {
        closeUtilsMenu();
      }
    });

    // Boot
    (async function boot() {
      renderStaticChrome();
      await loadCapabilities(false);
      await refreshState(true);
      selectComposerMode('roundtable');
      await loadProjects();
      setInterval(() => refreshState(false), 1200);
      setInterval(updateLiveTimersInDom, 1000);
    })();
  </script>
</body>
</html>

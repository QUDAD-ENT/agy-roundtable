    async function bindSelectedAsBackupOnly() {
      const ctx = window._SEAT_SWAP;
      if (!ctx) return;
      const oldName = STATE?.members?.[ctx.oldMemberId]?.name || ctx.oldMemberId;
      try {
        let payload = { source_member_id: ctx.oldMemberId };
        if (ctx.tab === 'existing' && ctx.selectedMemberId) {
          payload.backup_member_id = ctx.selectedMemberId;
        } else if (ctx.cands?.[ctx.selectedCandIdx]) {
          const c = ctx.cands[ctx.selectedCandIdx];
          payload.client = c.client;
          payload.model = c.model;
          payload.reasoning_effort = c.reasoning_effort;
        }
        const r = await api('POST', '/api/members/bind_backup', payload);
        closeModal();
        toast(t('bindDoneToast', { name: oldName, bk: r.quota_backup?.display_name || r.quota_backup?.model || 'Auto' }));
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function confirmSeatSwap() {
      const ctx = window._SEAT_SWAP;
      if (!ctx) return;
      const oldName = STATE?.members?.[ctx.oldMemberId]?.name || ctx.oldMemberId;
      const alsoBind = Boolean(document.getElementById('swap-also-bind')?.checked);
      const reason = (document.getElementById('swap-reason')?.value || '').trim() || (LANG === 'en' ? 'Live hot-swap' : '现场快速换人');
      const payload = {
        task_id: ctx.taskId,
        old_member_id: ctx.oldMemberId,
        abort_running: Boolean(ctx.abortRunning),
        trigger_fresh_turn: Boolean(ctx.triggerFresh),
        bind_as_quota_backup: alsoBind,
        reason
      };
      if (ctx.tab === 'existing') {
        if (!ctx.selectedMemberId) return;
        payload.new_member_id = ctx.selectedMemberId;
      } else {
        const c = ctx.cands?.[ctx.selectedCandIdx];
        if (!c) return;
        payload.spawn_backup_client = c.client;
        payload.spawn_backup_model = c.model;
        payload.spawn_backup_effort = c.reasoning_effort;
      }
      try {
        const r = await api('POST', '/api/tasks/swap_seat', payload);
        closeModal();
        await refreshState(true);
        const newName = STATE?.members?.[r.new_member_id]?.name || r.new_member_id;
        toast(t('swapDoneToast', { oldName, newName }));
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    function openAddSeatModal(taskId) {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      if (!task) return;
      const ms = STATE.members || {};
      const seated = new Set(task.mode_meta?.participants || (task.steps || []).map(s => s.member_id));
      const candidates = getRunnableIds(STATE).filter(id => !seated.has(id));
      const list = candidates.length ? candidates : getRunnableIds(STATE);
      window._ADD_SEAT = { taskId, memberId: list[0] || '' };
      const pills = list.map(id => {
        const m = ms[id];
        return `
          <div class="seat-pill ${id === window._ADD_SEAT.memberId ? 'selected' : ''}" data-add-seat="${esc(id)}" onclick="selectAddSeatPill('${esc(id)}')">
            ${avatarHtml(id, m, { sm: true })}
            <span style="font-weight:600;">${esc(m.name || id)}</span>
            <span style="font-size:10.5px; color:var(--text-3);">${esc(m.model)}</span>
          </div>
        `;
      }).join('');
      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong style="font-size:15px; display:inline-flex; align-items:center; gap:7px;">${svgIcon('userPlus', 15)} ${esc(t('addSeatModalTitle'))}</strong>
          <button class="btn btn-ghost btn-icon" onclick="closeModal()">${svgIcon('x', 15)}</button>
        </div>
        <div class="seat-picks" id="add-seat-pills" style="margin-bottom:12px;">${pills}</div>
        <div style="margin-bottom:10px;">
          <input type="text" id="add-seat-inst" placeholder="${LANG === 'en' ? 'Optional focus note for the invited specialist...' : '可选：给新加入专家的重点关注方向...'}">
        </div>
        <label style="display:flex; align-items:center; gap:6px; margin-bottom:12px; cursor:pointer; font-size:12.5px; color:var(--text);">
          <input type="checkbox" id="add-seat-trigger" checked style="width:auto;">
          <span>${esc(t('addSeatTrigger'))}</span>
        </label>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-sec btn-sm" onclick="closeModal()">${esc(t('cancel'))}</button>
          <button class="btn btn-sm" onclick="confirmAddSeat()">${svgIcon('plus', 12)} ${esc(t('confirm'))}</button>
        </div>
      `);

            <button class="btn btn-sec btn-sm" onclick='autoBindAllBackupsAction(${JSON.stringify(seatIds)}, true, true)'>${LANG === 'en' ? 'Auto-Bind Cross Engine' : '一键自动绑定（优先跨端换引擎）'}</button>

          member_ids: memberIds || null,

        });

    // ==================== MODALS, LINK PREVIEWER & QUESTION POPUP ====================
    function openModal(html, wide = false) {
      const bd = document.getElementById('modal-backdrop');
      if (bd && bd.style.display !== 'flex') LAST_FOCUS_EL = document.activeElement;
      const mEl = document.getElementById('modal-body');
      mEl.classList.toggle('wide', Boolean(wide));
      mEl.innerHTML = html;
      bd.style.display = 'flex';
    }
    function closeModal() {
      const bd = document.getElementById('modal-backdrop');
      if (bd) bd.style.display = 'none';
      if (LAST_FOCUS_EL && typeof LAST_FOCUS_EL.focus === 'function') {
        try { LAST_FOCUS_EL.focus(); } catch (_) {}
      }
      LAST_FOCUS_EL = null;
    }

    function toggleAutoQuestionPopup() {
      AUTO_POPUP_QUESTIONS = !AUTO_POPUP_QUESTIONS;
      localStorage.setItem('team_q_popup', AUTO_POPUP_QUESTIONS ? '1' : '0');
      if (AUTO_POPUP_QUESTIONS && STATE) {
        DISMISSED_Q_KEYS.clear();
        refreshState(true);
      }
    }

    async function openItemNatively(target, reveal = false) {
      try {
        const res = await api('POST', '/api/fs/open_item', { target, task_id: FOCUSED_TASK_ID, reveal });
        if (res.kind === 'web') toast(t('toastOpenedUrl'));
        else if (reveal) toast(t('toastRevealed', { name: res.name || res.opened }));
        else toast(t('toastOpenedFile', { name: res.name || res.opened }));
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    async function openAnswerLink(rawTarget, strict = false) {
      if (!rawTarget) return;
      if (/^https?:\/\//i.test(rawTarget)) { await openItemNatively(rawTarget, false); return; }
      try {
        const sFlag = strict ? '&strict=1' : '';
        const data = await api('GET', `/api/fs/preview_file?target=${encodeURIComponent(rawTarget)}&task_id=${encodeURIComponent(FOCUSED_TASK_ID || '')}${sFlag}`);
        if (data.preview_type === 'web') { await openItemNatively(data.url, false); return; }
        renderFilePreviewModal(data);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

    function renderFilePreviewModal(data) {
      window._CURRENT_PREVIEW_PATH = data.path || '';
      const lineStr = data.start_line ? `${data.start_line}${data.end_line && data.end_line !== data.start_line ? '-' + data.end_line : ''}` : '';
      const lineBadge = lineStr ? `<span class="tag tag-accent">${esc(t('linesBadge', { s: lineStr }))}</span>` : '';

      let bodyHtml = '';
      if (data.preview_type === 'directory') {
        const rows = (data.entries || []).map(en => `
          <div class="fs-item" data-subpath="${esc(en.path)}" onclick="openAnswerLink(this.getAttribute('data-subpath'))" title="${esc(en.name)}">
            <span style="display:flex; align-items:center; gap:7px; min-width:0; flex:1;">${svgIcon(en.is_dir ? 'folder' : 'file', 14)} <strong class="tx">${esc(en.name)}</strong></span>
            <span style="font-size:11.5px; color:var(--text-3); flex-shrink:0;">${en.is_dir ? esc(t('enterSubdir')) : (Math.round(en.size / 1024 * 10) / 10 + ' KB')}</span>
          </div>
        `).join('');
        bodyHtml = `<div class="fs-list" style="max-height:56vh;">${rows || `<div style="padding:18px; text-align:center; color:var(--text-3);">${esc(t('emptyDir'))}</div>`}</div>`;
      } else if (data.preview_type === 'image') {
        const insp = data.inspect || {};
        const infoBits = formatFigureInspectBits(insp, { size: data.size });
        bodyHtml = `
          ${infoBits.length ? `<div class="u-wrap" style="margin-bottom:8px; font-size:11.5px; color:var(--text-2); font-family:ui-monospace,Consolas,monospace;">${esc(infoBits.join(' · '))}</div>` : ''}
          <div class="${proofFilterClass()}" style="text-align:center; background:#ffffff; padding:16px; border-radius:8px; border:1px solid var(--border);"><img src="${esc(data.raw_url)}" style="max-width:100%; max-height:62vh; border-radius:4px;"></div>
        `;
      } else if (data.preview_type === 'tiff') {
        const insp = data.inspect || {};
        const pw = insp.physical_width_mm ?? insp.width_mm ?? '-';
        const ph = insp.physical_height_mm ?? insp.height_mm ?? '-';
        bodyHtml = `
          <div class="notice" style="margin-bottom:12px;"><span>${esc(t('tiffPreviewHint'))}</span></div>
          <div class="list-box">
            <div class="list-row"><span>Pixels</span><code>${esc(insp.width_px || '-')} × ${esc(insp.height_px || '-')} px</code></div>
            <div class="list-row"><span>Resolution (DPI)</span><code>${esc(insp.dpi_x || '-')} × ${esc(insp.dpi_y || '-')} DPI</code></div>
            <div class="list-row"><span>Physical Size</span><code>${esc(pw)} × ${esc(ph)} mm</code></div>
            <div class="list-row"><span>File Size</span><code>${Math.max(1, Math.round((data.size || 0) / 1024))} KB</code></div>
          </div>
        `;
      } else if (data.preview_type === 'pdf') {
        bodyHtml = `<iframe src="${esc(data.raw_url)}" style="width:100%; height:64vh; border:1px solid var(--border); border-radius:8px; background:#fff;"></iframe>`;
      } else if (data.preview_type === 'docx') {
        bodyHtml = `
          <div class="notice" style="margin-bottom:12px;"><span>${esc(t('wordPreviewHint'))}</span></div>
          <div class="doc-reading" style="max-height:58vh; overflow-y:auto; padding:4px 8px;">${renderLiteMarkdown(data.content || '', { taskId: FOCUSED_TASK_ID || '' })}</div>
        `;
      } else if (data.preview_type === 'markdown') {
        bodyHtml = `<div class="doc-reading" style="max-height:60vh; overflow-y:auto; padding:4px 8px;">${renderLiteMarkdown(data.content || '', { taskId: FOCUSED_TASK_ID || '' })}</div>`;
      } else if (data.preview_type === 'table') {
        const rows = data.rows || [];
        const truncNote = (data.col_truncated || data.row_truncated)
          ? `<div class="notice notice-warn" style="margin-bottom:10px;"><span>${esc(t('colTruncBanner', { shown: data.shown_cols || (rows[0]?.length || 0), total: data.total_cols || (rows[0]?.length || 0) }))}</span></div>`
          : '';
        if (rows.length) {
          const head = '<tr>' + rows[0].map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
          const body = rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('');
          bodyHtml = `${truncNote}<div class="md-table-wrap" style="max-height:60vh; overflow:auto;"><table class="md-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
        } else {
          bodyHtml = `<div class="empty-state">${esc(t('emptyTable'))}</div>`;
        }
      } else if (data.preview_type === 'text') {
        const lines = String(data.content || '').replace(/\r\n/g, '\n').split('\n');
        const sLine = data.start_line || 0;
        const eLine = data.end_line || sLine;
        const rowsHtml = lines.map((ln, idx) => {
          const lNum = idx + 1;
          const isHl = sLine > 0 && lNum >= sLine && lNum <= eLine;
          return `<div class="src-line ${isHl ? 'hl' : ''}" ${lNum === sLine ? 'id="preview-target-line"' : ''}><span class="src-ln tabular">${lNum}</span><span>${esc(ln)}</span></div>`;
        }).join('');
        bodyHtml = `<div class="src-viewer">${rowsHtml}</div>`;
      } else {
        bodyHtml = `<div class="empty-state"><div style="font-weight:600; color:var(--text); margin-bottom:6px;">${esc(data.name)} (${Math.round((data.size || 0) / 1024)} KB)</div><div>${esc(data.note || '')}</div></div>`;
      }

      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);">
          <div style="min-width:0; flex:1 1 220px;">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              ${svgIcon('file', 16)}
              <strong class="u-wrap" style="font-size:15px;">${esc(data.name)}</strong>
              ${lineBadge}
            </div>
            <div class="u-wrap" style="font-size:11.5px; color:var(--text-3); margin-top:4px; font-family:ui-monospace,Consolas,monospace;">${esc(t('filePath'))}: ${formatPathBreakable(data.path)}</div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="openItemNatively(window._CURRENT_PREVIEW_PATH, false)">${svgIcon('external', 13)} ${esc(t('openNative'))}</button>
            <button class="btn btn-sec btn-sm" onclick="openItemNatively(window._CURRENT_PREVIEW_PATH, true)">${svgIcon('folderOpen', 13)} ${esc(t('revealExplorer'))}</button>
            <button class="btn btn-ghost btn-icon" onclick="closeModal()" title="${esc(t('close'))}">${svgIcon('x', 15)}</button>
          </div>
        </div>
        ${bodyHtml}
      `, true);

      if (data.start_line) {
        setTimeout(() => document.getElementById('preview-target-line')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50);
      }
    }

    function ensureQuestionDraft(task) {
      const qs = task?.pending_questions?.questions || [];
      if (!USER_CHOICE_DRAFT[task.id]) {
        const initAns = {};
        qs.forEach((q, idx) => {
          const qid = q.id || `q${idx + 1}`;
          initAns[qid] = {
            selected: q.multi_select ? (q.options?.[0] ? [q.options[0]] : []) : (q.options?.[0] || ''),
            other: ''
          };
        });
        USER_CHOICE_DRAFT[task.id] = { answers: initAns, custom_note: '' };
      }
      return USER_CHOICE_DRAFT[task.id];
    }

    function buildQuestionBlocksHtml(task, idPrefix = 'inline') {
      const qs = task?.pending_questions?.questions || [];
      const draft = ensureQuestionDraft(task);
      return qs.map((q, idx) => {
        const qid = q.id || `q${idx + 1}`;
        const cur = draft.answers[qid] || { selected: q.multi_select ? [] : '', other: '' };
        const optsHtml = (q.options || []).map((opt, oIdx) => {
          const isChecked = q.multi_select ? (Array.isArray(cur.selected) && cur.selected.includes(opt)) : (cur.selected === opt);
          return `
            <label class="q-opt">
              <input type="${q.multi_select ? 'checkbox' : 'radio'}" name="${idPrefix}_q_${esc(task.id)}_${esc(qid)}"
                ${isChecked ? 'checked' : ''}
                onchange="onChoiceChange('${esc(task.id)}', '${esc(qid)}', ${q.multi_select}, ${oIdx}, this.checked)">
              <span>${esc(opt)}</span>
            </label>
          `;
        }).join('');
        return `
          <div class="q-item">
            <div style="font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;">
              <span class="u-wrap" style="min-width:0; flex:1 1 180px;">${idx + 1}. ${esc(q.question)}</span>

          </div>
        `;
      }).join('');

    function onChoiceChange(taskId, qid, isMulti, optIdx, checked) {
      const task = (STATE?.tasks || []).find(x => x.id === taskId);
      const q = (task?.pending_questions?.questions || []).find((x, i) => (x.id || `q${i + 1}`) === qid);
      if (!q || !USER_CHOICE_DRAFT[taskId]) return;
      const optVal = q.options[optIdx];
      const slot = USER_CHOICE_DRAFT[taskId].answers[qid];
      if (isMulti) {
        const arr = new Set(Array.isArray(slot.selected) ? slot.selected : []);
        if (checked) arr.add(optVal); else arr.delete(optVal);
        slot.selected = Array.from(arr);
      } else {
        slot.selected = optVal;
      }
    }

    // ==================== v5.6.0 THREE-TIER SANDBOX & DIRECTORY PERMISSION CENTER ====================
    function isDangerFullAccessAvailable(st) {
      const b = st?.binding || {};
      return Boolean(b.allow_danger_full_access) && (b.max_sandbox || 'workspace-write') === 'danger-full-access';
    }

    function syncSandboxSelects(st) {
      const b = st?.binding || {};
      const maxSb = b.max_sandbox || 'workspace-write';
      const allowDanger = isDangerFullAccessAvailable(st);
      const buildOpts = (cur) => {
        const opts = [];
        opts.push(`<option value="read-only" ${cur === 'read-only' ? 'selected' : ''}>${esc(t('sandboxRo'))}</option>`);
        opts.push(`<option value="workspace-write" ${cur === 'workspace-write' ? 'selected' : ''} ${maxSb === 'read-only' ? 'disabled' : ''}>${esc(t('sandboxRw'))}</option>`);
        if (allowDanger) {
          opts.push(`<option value="danger-full-access" ${cur === 'danger-full-access' ? 'selected' : ''}>${esc(t('sandboxFull'))}</option>`);
        }
        return opts.join('');
      };
      const clampVal = (v, fallback) => {
        const val = v || fallback;
        if (val === 'danger-full-access' && !allowDanger) return maxSb === 'read-only' ? 'read-only' : 'workspace-write';
        if (val === 'workspace-write' && maxSb === 'read-only') return 'read-only';
        return val;
      };
      const cmpSb = document.getElementById('cmp-sandbox');
      if (cmpSb) {
        const prev = clampVal(cmpSb.value, st?.settings?.default_task_sandbox || 'read-only');
        const sig = `${LANG}|${maxSb}|${allowDanger ? 1 : 0}`;
        if (cmpSb.getAttribute('data-sb-sig') !== sig) {
          cmpSb.innerHTML = buildOpts(prev);
          cmpSb.setAttribute('data-sb-sig', sig);
        }
        cmpSb.value = prev;
      }
      const addSb = document.getElementById('add-m-sandbox');
      if (addSb) {
        const prev = clampVal(addSb.value, maxSb === 'read-only' ? 'read-only' : 'workspace-write');
        const sig = `${LANG}|${maxSb}|${allowDanger ? 1 : 0}`;
        if (addSb.getAttribute('data-sb-sig') !== sig) {
          addSb.innerHTML = buildOpts(prev);
          addSb.setAttribute('data-sb-sig', sig);
        }
        addSb.value = prev;
      }
    }

    function updateSandboxPill(st) {
      const el = document.getElementById('btn-sandbox-pill');
      if (!el) return;
      const b = st?.binding || {};
      const maxSb = b.max_sandbox || 'workspace-write';
      const defSb = st?.settings?.default_task_sandbox || 'read-only';
      const addDirs = Array.isArray(b.extra_add_dirs) ? b.extra_add_dirs : [];
      const eff = maxSb === 'read-only' ? 'read-only' : defSb;
      el.classList.remove('sb-ro', 'sb-rw', 'sb-danger');
      if (eff === 'danger-full-access' && b.allow_danger_full_access) {
        el.classList.add('sb-danger');
        el.textContent = t('sbPillFull');
      } else if (eff === 'workspace-write') {
        el.classList.add('sb-rw');
        el.textContent = addDirs.length > 0 ? `${t('sbPillRw')} +${addDirs.length}` : t('sbPillRw');
      } else {
        el.classList.add('sb-ro');
        el.textContent = addDirs.length > 0 ? `${t('sbPillRo')} +${addDirs.length}` : t('sbPillRo');
      }
      el.title = `${t('sbCenterTitle')} | ${t('permMaxSandbox')}: ${maxSb} | ${t('permDefaultTask')}: ${defSb}${addDirs.length ? ` | --add-dir: ${addDirs.length}` : ''}`;
    }

    function getEffectiveRtSeatSandbox(mid, taskSb, allowWrites) {
      const rank = { 'read-only': 0, 'workspace-write': 1, 'danger-full-access': 2 };
      const toSb = ['read-only', 'workspace-write', 'danger-full-access'];
      const taskRank = rank[taskSb] ?? 0;
      if (taskRank === 0) return 'read-only';
      const ov = CMP.rtSeatSandboxes && CMP.rtSeatSandboxes[mid];
      if (ov && rank[ov] !== undefined) {
        return toSb[Math.min(taskRank, rank[ov])];
      }
      if (allowWrites) {
        const memSb = STATE?.members?.[mid]?.sandbox || 'read-only';
        if (memSb !== 'read-only' && rank[memSb] !== undefined) {
          return toSb[Math.min(taskRank, rank[memSb])];
        }
      }
      return 'read-only';
    }

    function cycleRtSeatSandbox(mid) {
      const curTaskSb = document.getElementById('cmp-sandbox')?.value || 'read-only';
      if (curTaskSb === 'read-only') return;
      const effAllowWrites = Boolean(CMP.rtAllowWrites ?? STATE?.settings?.roundtable_allow_member_writes);
      const cur = getEffectiveRtSeatSandbox(mid, curTaskSb, effAllowWrites);
      const allowed = curTaskSb === 'danger-full-access'
        ? ['read-only', 'workspace-write', 'danger-full-access']
        : ['read-only', 'workspace-write'];
      const idx = allowed.indexOf(cur);
      const next = allowed[(idx + 1) % allowed.length];
      CMP.rtSeatSandboxes = CMP.rtSeatSandboxes || {};
      CMP.rtSeatSandboxes[mid] = next;
      renderComposerStudio();
    }

    async function applySandboxPresetTier(tier, lockCeilingRo) {

          body.max_sandbox = 'read-only';
        } else if (tier === 'workspace-write') {
          if ((STATE?.binding?.max_sandbox || 'workspace-write') === 'read-only') {
            body.max_sandbox = 'workspace-write';

          body.max_sandbox = 'danger-full-access';
        }
        CMP.sandboxUserTouched = false;
        await api('POST', '/api/binding', body);
        await refreshState(true);
        const cmpSbEl = document.getElementById('cmp-sandbox');
        if (cmpSbEl && Array.from(cmpSbEl.options).some(o => o.value === tier && !o.disabled)) {

    async function recruitFromTemplate(tplId) {
      const tpl = (CATALOG.templates || []).find(x => x.template_id === tplId);
      if (!tpl || !STATE) return;
      const client = tpl.recommended_client || 'codex';
      const models = (CAPS.clients?.[client]?.models) || [];
      let chosenM = null;
      for (const prefSlug of (tpl.recommended_models || [])) {
        chosenM = models.find(m => m.slug === prefSlug);
        if (chosenM) break;
      }
      if (!chosenM) chosenM = models[0] || { slug: client === 'antigravity' ? 'gemini-4-neon' : 'gpt-6.2-sol', default_reasoning_effort: 'medium', supported_reasoning_efforts: ['medium'] };
      const suppEffs = chosenM.supported_reasoning_efforts || [];
      const prefEff = tpl.recommended_effort || chosenM.default_reasoning_effort || 'medium';
      const chosenEff = suppEffs.includes(prefEff) ? prefEff : (chosenM.default_reasoning_effort || suppEffs[0] || 'medium');
      let baseId = tpl.template_id;
      let newId = baseId;
      let n = 2;
      while (STATE.members?.[newId]) { newId = `${baseId}_${n++}`; }
      const nm = LANG === 'en' ? tpl.name_en : tpl.name_zh;
      try {
        await api('POST', '/api/members', {
          id: newId,
          name: nm,
          role: STATE.roles?.[tpl.role] ? tpl.role : 'review',
          client,
          model: chosenM.slug,
          reasoning_effort: chosenEff,
          specialty: LANG === 'en' ? tpl.specialty_en : tpl.specialty_zh,
          persona_prompt: tpl.persona_prompt,
          grounding_mode: tpl.grounding_mode || 'strict',
          tags: tpl.tags || []
        });
        toast(t('recruitedToast', { name: nm }));
        await refreshState(true);
      } catch (e) { toast(t('toastFail', { err: e.message }), true); }
    }

      }
      if (!authorClient) {
        const synth = [...(task?.steps || [])].reverse().find(s => s.step_type !== 'fact_check');
        if (synth) { authorId = synth.member_id; authorClient = ms[authorId]?.client; }
      }
      return ids.slice().sort((a, b) => {
        const sc = (id) => {
          const m = ms[id];
          return (authorClient && m.client !== authorClient ? 4 : 0)
            + ((m.tags || []).includes('fact_check') || m.role === 'review' ? 2 : 0)
            + (id !== authorId ? 1 : 0);
        };
        return sc(b) - sc(a);
      })[0] || ids[0];
    }

    function renderCmdKList() {

      const ms = STATE?.members || {};
      const ids = getRunnableIds(STATE || {});

      const itemsHtml = [];
      // 1. Specialists
      const matchedMems = ids.filter(id => {
        const m = ms[id];
        return !q || id.toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q) || (m.specialty || '').toLowerCase().includes(q) || (m.model || '').toLowerCase().includes(q);

      if (matchedMems.length) {
        itemsHtml.push(`<div class="cmdk-group">${esc(t('cmdKGroupSpecialists'))}</div>`);
        matchedMems.forEach(id => {
          const m = ms[id];
          const idx = CMDK_ITEMS.length;
          CMDK_ITEMS.push({
            run: () => {
              closeCmdK();
              if (FOCUSED_TASK_ID && CURRENT_VIEW === 'workspace' && !isComposerOpen(getProjUnarchived())) {

          });
          itemsHtml.push(`

                <button class="btn btn-ghost btn-sm" style="min-height:24px; padding:1px 6px;" onclick="event.stopPropagation(); closeCmdK(); openSwitchMemberModal('${esc(id)}');">${esc(t('editMember'))}</button>

      // 2. Fact-check & Quick Actions
      const actions = [];
      if (FOCUSED_TASK_ID) {

          sub: t('factCheckDesc'),
          icon: 'shield',
          run: () => { closeCmdK(); openFactCheckModal(FOCUSED_TASK_ID); }

        actions.push({
          label: t('switchSpecTitle'),
          sub: LANG === 'en' ? 'Summon another specialist for a fresh independent answer' : '一键换另一位专家独立重新研判',
          icon: 'repeat',
          run: () => { closeCmdK(); openReanswerModal(FOCUSED_TASK_ID); }
        });

      actions.push({
        label: t('optimizeRoster'),
        sub: LANG === 'en' ? 'Align all idle members with verified live CLI models & OpenScience personas' : '按双端实测能力一键修复失效模型并升级 OpenScience 科研/工程身份',
        icon: 'sliders',
        run: () => { closeCmdK(); optimizeRosterAction(); }

      if (matchedActs.length) {

      const matchedPresets = (CATALOG.squad_presets || []).filter(p => {

      if (matchedPresets.length) {
        itemsHtml.push(`<div class="cmdk-group">${esc(t('cmdKGroupPresets'))}</div>`);

      box.innerHTML = itemsHtml.join('') || `<div style="padding:20px; text-align:center; color:var(--text-3); font-size:12.5px;">No match</div>`;

    function execCmdK(idx) {
      if (CMDK_ITEMS[idx]) CMDK_ITEMS[idx].run();
    }

    function onCmdKKeydown(ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closeCmdK(); return; }
      if (!CMDK_ITEMS.length) return;
      if (ev.key === 'ArrowDown') { ev.preventDefault(); CMDK_INDEX = (CMDK_INDEX + 1) % CMDK_ITEMS.length; renderCmdKList(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); CMDK_INDEX = (CMDK_INDEX - 1 + CMDK_ITEMS.length) % CMDK_ITEMS.length; renderCmdKList(); }
      else if (ev.key === 'Enter') { ev.preventDefault(); execCmdK(CMDK_INDEX); }
    }

            <button class="btn btn-ghost btn-sm" onclick="dismissVersionUpdate('${esc(latV)}', ${isLocalHot ? 'true' : 'false'})">${esc(t('verLaterBtn'))}</button>
            ${isLocalHot ? `
              <button class="btn btn-sm" onclick="location.reload()">${svgIcon('refresh', 13)} ${esc(t('verReloadNow'))}</button>
            ` : `
              <button class="btn btn-sec btn-sm" onclick="navigator.clipboard?.writeText('git pull origin main').then(() => toast(t('verCopiedPullToast')))">${svgIcon('copy', 12)} ${esc(t('verCopyGitPull'))}</button>
              <a class="btn btn-sm" style="text-decoration:none;" href="${esc(relUrl)}" target="_blank" rel="noopener noreferrer">${svgIcon('external', 12)} ${esc(t('verOpenGithub'))}</a>
            `}
          </div>
        </div>
      `);
    }

    function dismissVersionUpdate(latestVer, isLocalHot = false) {
      if (!isLocalHot && latestVer) {
        try { localStorage.setItem('agy_rt_dismissed_update_ver', String(latestVer)); } catch (_) {}
      }
      closeModal();
      renderVersionPill();
    }

    async function checkVersionUpdates(manual = false) {
      try {
        const res = await api('GET', `/api/version/check?force=${manual ? 1 : 0}`);
        UPDATE_INFO = res;
        renderVersionPill();
        if (res.has_update) {
          const dismissed = localStorage.getItem('agy_rt_dismissed_update_ver') || '';
          const modalOpen = document.getElementById('modal-backdrop')?.style.display === 'flex';
          if (manual || (dismissed !== String(res.latest_version) && !modalOpen)) {
            showVersionUpdateModal(res, false);
          }
        } else if (manual) {
          toast(t('verUpToDate', { v: res.current_version || CLIENT_APP_VERSION }));
        }
      } catch (e) {
        if (manual) toast(t('toastFail', { err: e.message }), true);
      }
    }

    // Boot
    (async function boot() {
      renderStaticChrome();
      renderVersionPill();
      await Promise.all([loadCapabilities(false), loadCatalog(), loadPlottingBackends(false)]);
      await refreshState(true);
      selectComposerMode('roundtable');
      await loadProjects();
      scheduleNextPoll();
      setInterval(() => { if (!document.hidden) updateLiveTimersInDom(); }, 1000);
      setTimeout(() => { checkVersionUpdates(false); }, 1500);
    })();
  </script>
</body>
</html>
